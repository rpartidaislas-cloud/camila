<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SMYL · Centro de alertas QA</title>
  <link rel="stylesheet" href="../../smyl-panel.css"><link rel="stylesheet" href="../../smyl-task-center.css">
  <style>*{box-sizing:border-box}body{margin:0;background:#f5f4ef;font-family:Inter,Arial,sans-serif}.shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.side{padding:28px 18px;background:#fdfdf9;border-right:1px solid #dce2dd}.brand{padding:0 8px 30px;font-size:26px;font-weight:800;letter-spacing:-.06em}.brand small{display:block;margin-top:5px;color:#657777;font-size:10px;font-weight:500;letter-spacing:0}.side nav{display:grid;gap:4px}.side button{min-height:44px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:#526465;text-align:left}.side .active{background:#e8f1ef;color:#215d60;font-weight:700}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#fdfdf9;border-bottom:1px solid #dce2dd;color:#233c3d;font-weight:650}.btn-noti{position:relative;width:38px;height:38px;border:1px solid #dce2dd;border-radius:9px;background:#fff}.noti-dot{position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%;background:#b35d47}.contenido{max-width:1280px;width:100%;padding:32px;margin:0 auto}.card{display:block}.btn{min-height:42px;padding:0 14px;border:1px solid #cbd8d2;border-radius:9px;background:#fff;font-weight:700}@media(max-width:760px){.shell{display:block}.side{display:none}.top{height:58px;padding:0 18px}.contenido{padding:19px 14px 70px}}</style>
</head>
<body class="smyl-professional"><div class="shell"><aside class="side"><div class="brand">smyl<small>Panel profesional</small></div><nav><button>Inicio</button><button>Pacientes</button><button>Agenda</button><button>Mensajes</button><button class="active" data-route="notificaciones">Alertas</button></nav></aside><main><header class="top"><span>Centro de alertas</span><button class="btn-noti" aria-label="Alertas"><span class="noti-dot" id="noti-dot"></span>◌</button></header><div class="contenido"><section id="p-notificaciones"><div class="card">Notificaciones anteriores</div></section></div></main></div>
<script>
window.tenantId='00000000-0000-0000-0000-000000000001';window.TITULOS={};window.ir=route=>document.body.dataset.route=route;window.sbTimeout=value=>value;
const today=new Date(),at=(h,m)=>{const d=new Date(today);d.setHours(h,m,0,0);return d.toISOString();};
const rows={smyl_appointments:[{id:'a1',starts_at:at(9,0),status:'arrived'},{id:'a2',starts_at:at(11,0),status:'no_show'}],smyl_appointment_requests:[{id:'r1',status:'pending'}],smyl_appointment_reminders:[{id:'m1',scheduled_for:at(8,0),status:'failed'}],camila_notificaciones:[{id:'n1',titulo:'Agenda mejorada',cuerpo:'Ahora puedes revisar solicitudes y recordatorios desde una sola vista.',tipo:'Actualización',created_at:today.toISOString()}],inventory:[{item_id:'i1',below_minimum:true,days_to_expiry:12,on_hand:4}]};
function chain(data){const api={select(){return api},eq(){return api},gte(){return api},lt(){return api},lte(){return api},in(){return api},order(){return api},limit(){return api},then(resolve){resolve({data,error:null})}};return api;}window.sb={from:table=>chain(rows[table]||[]),rpc:()=>chain(rows.inventory)};window.SmylLanaAttention={getSummary:()=>({loaded:true,total:2,unread:3,linked:1}),load:()=>Promise.resolve()};
</script><script src="../../smyl-task-center.js"></script></body></html>
