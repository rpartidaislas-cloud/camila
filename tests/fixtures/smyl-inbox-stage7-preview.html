  <script>
    if (new URLSearchParams(location.search).has('mobile')) document.documentElement.classList.add('qa-mobile');
    if (new URLSearchParams(location.search).has('tablet')) document.documentElement.classList.add('qa-tablet');
    window.SUPA_URL = 'https://preview.invalid';
    window.SUPA_KEY = 'preview';
    window.TITULOS = {};
    window.tenantData = { nombre:'Clínica Sonrisa', config:{ consultorio:'Clínica Sonrisa' } };
    window.sb = { auth: { getSession: async function () { return { data: { session: { access_token: 'preview' } } }; } } };
    window.ir = function (route) {
      document.querySelectorAll('.pantalla').forEach(function (page) { page.classList.toggle('activa', page.id === 'p-' + route); });
    };

    var conversation = {
      id:'c-preview', channel:'whatsapp', contact_name:'Ana López', last_message:'Perfecto, quiero confirmar el horario de mi valoración.',
      last_message_at:new Date(Date.now()-38*60000).toISOString(), unread_count:2, paused:true, needs_human:true, can_operate:true,
      pinned:true, stage_id:'stage-valoracion',
      assignment:{ source:'smyl', actor_id:'owner-preview', name:'Dra. Mariana' },
      whatsapp_window:{ status:'expired', expires_at:new Date(Date.now()-25*60000).toISOString(), remaining_seconds:0, freeform_allowed:false },
      automation:{ auto_reactivate_hours:6, window_reactivation:false, reminder_sent_at:new Date(Date.now()-26*3600000).toISOString() }
    };
    var messages = [
      { id:'m1', author_type:'patient', role:'user', content:'Hola, quiero información sobre diseño de sonrisa.', status:'sent', created_at:new Date(Date.now()-27*3600000).toISOString() },
      { id:'m2', author_type:'assistant', role:'assistant', content:'Con gusto, Ana. Puedo ayudarte a conocer el proceso y agendar una valoración con la clínica.', status:'sent', created_at:new Date(Date.now()-26.8*3600000).toISOString() },
      { id:'m3', author_type:'patient', role:'user', content:'Perfecto, quiero confirmar el horario de mi valoración.', status:'sent', starred:true, created_at:new Date(Date.now()-25.5*3600000).toISOString() }
    ];
    var previewParams = new URLSearchParams(location.search);
    // A board of fictitious contacts for exercising the real side-by-side workspace.
    var pipelineDemo, demoThreads;
    if (previewParams.has('pipeline-preview')) {
      sessionStorage.setItem('smyl_inbox_view', 'pipeline');
      var demoDate = new Intl.DateTimeFormat('sv-SE', {timeZone:'America/Mexico_City'}).format(new Date());
      var demoStage = {confirmed:'smyl:confirmed', arrived:'smyl:arrived', completed:'smyl:attended'};
      pipelineDemo = [
        ['c-preview','Ana López','whatsapp','confirmed','10:30','Gracias, nos vemos en la consulta.'],
        ['c-elena','Elena Cruz','instagram','arrived','11:00','Ya llegué a recepción.'],
        ['c-mateo','Mateo Ruiz','messenger',null,null,'¿Tienen horarios disponibles el viernes?'],
        ['c-lucia','Lucía Díaz','whatsapp','completed','09:00','Muchas gracias por la atención.']
      ].map(function (values) {
        var [id,name,channel,status,time,preview] = values;
        var starts = time && new Date(demoDate+'T'+time+':00-06:00');
        var stage = demoStage[status] || null;
        return Object.assign({}, conversation, {
          id:id, contact_name:name, channel:channel, stage_id:stage, last_message:preview, pinned:false,
          needs_human:!stage, unread_count:id === 'c-mateo' ? 1 : 0,
          pipeline:{stage_id:stage,source:stage ? 'agenda' : 'none',revision:0,provider_stage_id:null},
          appointment:starts && {id:'visit-'+id,status:status,starts_at:starts.toISOString(),ends_at:new Date(+starts+3600000).toISOString(),timezone:'America/Mexico_City'},
          whatsapp_window:{status:'open',freeform_allowed:true,expires_at:new Date(Date.now()+8*3600000).toISOString()}
        });
      });
      demoThreads = new Map(pipelineDemo.map(function (card) {
        return [card.id, [{id:'hello-'+card.id,role:'user',author_type:'patient',content:card.last_message,status:'sent',created_at:card.last_message_at}]];
      }));
      demoThreads.get('c-preview').unshift(
        {id:'greeting-preview',role:'user',author_type:'patient',content:'Buen día. ¿Me confirman la hora de mi valoración?',status:'sent',created_at:new Date(Date.now()-45*60000).toISOString()},
        {id:'answer-preview',role:'assistant',author_type:'team',content:'Hola, Ana. Tu valoración es hoy a las 10:30 en la sucursal Centro.',status:'sent',created_at:new Date(Date.now()-42*60000).toISOString()}
      );
    }
    var demoFiles = [];
    if (previewParams.has('chat-ux')) {
      // Synthetic thread for checking location cards, staff-only handoff and scrolling.
      var uxContact = pipelineDemo ? pipelineDemo[0] : conversation;
      var uxMessages = demoThreads ? demoThreads.get(uxContact.id) : messages;
      uxContact.private_handoff_note = 'Recepción: confirmar la sucursal antes de agendar.';
      for (var uxIndex = 0; uxIndex < 20; uxIndex++) {
        uxMessages.push({id:'history-'+uxIndex, role:'user', author_type:'patient', status:'sent', content:'Mensaje de ejemplo '+(uxIndex+1), created_at:new Date(Date.now()-(21-uxIndex)*60000).toISOString()});
      }
      uxMessages.push({id:'map-example', role:'assistant', author_type:'team', status:'sent', content:'📍 Ubicación actual\nhttps://www.google.com/maps?q=20.674%2C-103.344', created_at:new Date().toISOString()});
    }
    if (previewParams.has('media-preview')) {
      var created = {created_at:new Date().toISOString(), status:'sent'};
      demoFiles = [
        Object.assign({}, created, {id:'img-test', author_type:'patient', role:'user', media_type:'image', media_filename:'ejemplo.png', media_url:new URL('../../icons/icon-512.png', location.href).href, content:'Imagen'}),
        Object.assign({}, created, {id:'pdf-test', author_type:'team', role:'assistant', media_type:'document', media_filename:'ejemplo.pdf', media_url:new URL('chat-media-ejemplo.pdf', location.href).href, content:'Documento de ejemplo'})
      ];
      (demoThreads ? demoThreads.get('c-preview') : messages).push(...demoFiles);
    }
    if (previewParams.has('care-history')) {
      var clinicalVisits = [
        {attended_at:'2026-11-14T16:00:00Z', branch_id:'plaza', branch_name:'Plaza Sol', professional_id:'p1', professional_name:'Dra. Valeria Montoya'},
        {attended_at:'2026-10-08T16:00:00Z', branch_id:'lomas', branch_name:'Lomas Verdes', professional_id:'p2', professional_name:'Dr. Rodrigo Pineda'},
        {attended_at:'2026-08-15T16:00:00Z', branch_id:'plaza', branch_name:'Plaza Sol', professional_id:'p1', professional_name:'Dra. Valeria Montoya'},
        {attended_at:'2026-06-20T16:00:00Z', branch_id:'plaza', branch_name:'Plaza Sol', professional_id:'p3', professional_name:'Dra. Isabel Vega'}
      ];
      window.SmylSchedule = {
        patientVisits: async function(){ return [{id:'future-care-demo',status:'confirmed',starts_at:new Date(Date.now()+5*86400000).toISOString(),service:'Valoración de seguimiento',professional:'Dra. Ana Flores',branch:'Centro'}]; },
        patientCareHistory: async function() {
          if (previewParams.get('care-history') === 'error') throw new Error('Error de prueba');
          if (previewParams.get('care-history') === 'missing') return {visits:[{branch_id:'archived',professional_name:null,attended_at:null}],truncated:false};
          return {visits:previewParams.get('care-history') === 'empty' ? [] : clinicalVisits,truncated:false};
        }
      };
    }
    if (['composer-tools', 'composer-emoji', 'productivity-quick', 'media-preview'].some(function (name) { return previewParams.has(name); })) {
      conversation.whatsapp_window = {status:'open', freeform_allowed:true, remaining_seconds:3600, expires_at:new Date(Date.now()+3600000).toISOString()};
    }
    conversation.assignment_version = 0;
    if (previewParams.get('chat') === 'agent') conversation.assignment = {actor_id:'owner-preview',name:'Dra. Mariana'};
    var quickRows = [], nextQuickId = 0;
    window.sb.rpc = async function (action, args) {
      if (action === 'smyl_list_quick_replies') return {data:quickRows.slice(),error:null};
      var index = args ? quickRows.findIndex(function (item) { return item.id === args.p_id; }) : -1;
      if (action === 'smyl_save_quick_reply') {
        var row = {id:index < 0 ? 'local-' + (++nextQuickId) : args.p_id, shortcut:args.p_shortcut, text:args.p_text, version:index < 0 ? 1 : quickRows[index].version+1};
        if (index < 0) quickRows.push(row); else quickRows[index] = row;
        return {data:row,error:null};
      }
      if (action === 'smyl_delete_quick_reply' && index >= 0) { quickRows.splice(index,1); return {data:true,error:null}; }
      return {data:null,error:{message:'Operación de prueba sin configurar'}};
    };
    var autoLinkedPatient = !previewParams.has('new-patient') && !previewParams.has('unlinked-patient') && !previewParams.has('ambiguous-patient');
    function json(data, status) { return Promise.resolve(new Response(JSON.stringify(data), { status:status||200, headers:{'Content-Type':'application/json'} })); }
    var fetchAsset = window.fetch.bind(window);
    window.fetch = function (input, init) {
      var url = new URL(String(input), document.baseURI);
      if (url.origin === location.origin && previewParams.has('media-preview') &&
          (url.pathname.includes('/vendor/') || demoFiles.some(file => new URL(file.media_url).pathname === url.pathname))) return fetchAsset(url, init);
      if (url.origin === location.origin && url.pathname.includes('/assets/emoji/')) return fetchAsset(url, init);
      var action = url.searchParams.get('action'); var body = {};
      try { body = init && typeof init.body === 'string' ? JSON.parse(init.body) : {}; } catch (_) {}
      action = action || body.action;
      var mode = previewParams.get('chat') || 'coordinator';
      var actor = {id:'owner-preview',role:'owner',name:'Dra. Mariana', chat_access:mode};
      var permitted = mode === 'coordinator' || mode === 'agent' && conversation.assignment && conversation.assignment.actor_id === actor.id;
      if (action === 'access') return json({actor:actor});
      if (mode === 'none') return json({code:'chat_access_denied'},403);
      if (pipelineDemo && mode === 'coordinator') {
        var id = url.searchParams.get('conversation_id') || body.conversation_id;
        var demo = pipelineDemo.find(function (card) { return card.id === id; });
        if (action === 'stages') return json({stages:[]});
        if (action === 'list') return json({actor:actor,conversations:pipelineDemo,page:{total:pipelineDemo.length,has_more:false},synced_at:new Date().toISOString()});
        if (demo && action === 'messages') return json({conversation:demo,messages:demoThreads.get(id),page:{has_more:false}});
        if (demo && action === 'read') { demo.unread_count=0; return json({unread_count:0}); }
        if (demo && action === 'send') {
          var message = {id:crypto.randomUUID(),role:'assistant',author_type:'team',content:body.content,status:'sent',created_at:new Date().toISOString()};
          demoThreads.get(id).push(message); demo.last_message=message.content; demo.last_message_at=message.created_at;
          return json({message:message});
        }
        if (demo && action === 'stage') {
          demo.stage_id=body.target_stage_id;
          demo.pipeline={stage_id:demo.stage_id,source:'manual',revision:demo.pipeline.revision+1,provider_stage_id:null};
          return json({stage_id:demo.stage_id,pipeline:demo.pipeline,appointment:demo.appointment});
        }
        if (demo && ['auto_patient_link','clinical_context'].includes(action)) return json({ok:true,linked:true,patient:{id:'patient-'+id,name:demo.contact_name},clinical_images:[]});
        if (demo && action === 'appointment_context') return json({linked:true,patient_id:'patient-'+id,items:[]});
      }
      if (action === 'messages' && !permitted) return json({code:'conversation_scope_denied'},403);
      if (action === 'list') return json({ actor:actor, conversations:permitted ? [conversation] : [], page:{total:1,has_more:false}, synced_at:new Date().toISOString() });
      if (action === 'messages') return json({ conversation:conversation, messages:messages, page:{has_more:false,before:null} });
      if (action === 'team') return json({ members:[{id:'owner-preview',name:'Dra. Mariana'},{id:'desk-preview',name:'Sofía · Recepción'}] });
      if (action === 'assign' || action === 'release') {
        if (body.expected_version !== conversation.assignment_version) return json({error:'Asignación desactualizada'},409);
        conversation.assignment_version++;
        conversation.private_handoff_note = body.private_note || null;
        conversation.assignment = action === 'release' ? null : {source:'smyl', actor_id:body.target_actor_id, name:body.target_actor_id === 'desk-preview' ? 'Sofía · Recepción' : 'Dra. Mariana'};
        return json({assignment_version:conversation.assignment_version, private_handoff_note:conversation.private_handoff_note, paused:conversation.paused, needs_human:conversation.needs_human, unread_count:conversation.unread_count, assigned_actor_id:conversation.assignment && conversation.assignment.actor_id, assigned_actor_name:conversation.assignment && conversation.assignment.name});
      }
      if (action === 'stages') return json({ stages:[{id:'stage-nuevo',name:'Nuevo contacto',order:1},{id:'stage-valoracion',name:'Valoración agendada',order:2},{id:'stage-tratamiento',name:'Tratamiento activo',order:3}] });
      if (action === 'quick_replies') return json({ quick_replies:[{id:'q1',shortcut:'valoracion',text:'Hola, con gusto te ayudamos a agendar tu valoración dental.'},{id:'q2',shortcut:'documentos',text:'Para continuar, por favor comparte los estudios indicados por tu especialista.'}] });
      if (action === 'search') return json({ query:'valoración',results:[messages[2],messages[1]],page:{has_more:false,before:null} });
      if (action === 'shared') return json({ items:demoFiles.length ? demoFiles : [{id:'share1',author_type:'patient',content:'Estudios previos https://ejemplo.invalid/estudios.pdf',created_at:new Date(Date.now()-2*86400000).toISOString(),media_type:null,media_url:null}],page:{has_more:false,before:null} });
      if (action === 'auto_patient_link') {
        if (previewParams.has('ambiguous-patient')) return json({ok:true,linked:false,reason:'ambiguous',needs_review:true});
        if (previewParams.has('unlinked-patient')) return json({ok:true,linked:false,reason:'needs_identity',needs_review:true});
        var createdPatient = previewParams.has('new-patient') && !autoLinkedPatient;
        autoLinkedPatient = true;
        return json({ok:true,linked:true,status:createdPatient?'created_contact':'already_linked',created_patient:createdPatient,patient:{id:'patient-preview',name:'Ana López'},case_id:null});
      }
      if (action === 'clinical_context') { if (!autoLinkedPatient) return json({linked:false,patient:null,case:null,clinical_images:[]}); return json({ linked:true, patient:{id:'patient-preview',name:'Ana López',phone:'+52 55 0000 1184',email:'ana@ejemplo.mx'}, case:previewParams.has('new-patient')?null:{score:86,lana_appointment_id:'apt-1',simulation_url:null,quote_total:18500,summary:'Valoración inicial pendiente de confirmación.'}, clinical_images:[] }); }
      if (action === 'scheduled') return json({ scheduled:[{id:'s1',type:'template',send_at:new Date(Date.now()+24*3600000).toISOString(),status:'retrying',content:'Recordatorio de valoración dental',attempt_count:1,max_attempts:3,next_attempt_at:new Date(Date.now()+5*60000).toISOString(),retry_safe:true},{id:'s2',type:'text',send_at:new Date(Date.now()-60*60000).toISOString(),status:'dead_letter',content:'Seguimiento de valoración',error:'Meta rechazó temporalmente el envío.',attempt_count:3,max_attempts:3,retry_safe:true}] });
      if (action === 'operations') return json({ actor:{id:'owner-preview',role:'owner',name:'Dra. Mariana'}, health:{status:'healthy',alerts:[]}, metrics:{conversations:146,needs_human:7,paused:12,messages_sent_24h:84,copilot_requests_24h:19,scheduled_retrying:0,dead_letters:0,failed_sends:0,unknown_deliveries:0,queue_overdue:0}, channels:[{channel:'whatsapp',connected:true},{channel:'messenger',connected:true},{channel:'instagram',connected:false}], ai:{used_tokens:1248000,limit_tokens:4840000,used_percent:25.8,reached:false}, pilot:{status:'active',readiness:'ready',activation_is_manual:true,all_scenarios_passed:false,started_at:new Date(Date.now()-2*86400000).toISOString(),checks:[{id:'channel_connected',label:'Al menos un canal conectado',passed:true},{id:'training_published',label:'Capacitación dental publicada',passed:true},{id:'delivery_confirmed',label:'Sin entregas ambiguas',passed:true},{id:'dead_letter_empty',label:'Cola de fallos revisada',passed:true},{id:'queue_current',label:'Worker sin retrasos',passed:true},{id:'ai_available',label:'IA dentro del límite mensual',passed:true}],scenarios:[{id:'live_traffic',label:'Tráfico real de entrada y salida',description:'Confirma una conversación real recibida y una respuesta aceptada por el proveedor.',passed:true,evidence:'Conversación de prueba validada en WhatsApp',checked_by:'Dra. Mariana'},{id:'concurrent_users',label:'Dos usuarios simultáneos',description:'Dos integrantes operan al mismo tiempo sin sobrescribir asignaciones ni mensajes.',passed:false},{id:'out_of_order',label:'Mensajes fuera de orden',description:'El hilo conserva el orden correcto después de sincronizar eventos retrasados.',passed:false},{id:'reconnect',label:'Pérdida de red y reconexión',description:'La bandeja se recupera sin duplicar envíos ni perder el borrador local.',passed:false},{id:'mobile',label:'Uso en dispositivo móvil',description:'La clínica completa lectura, respuesta y seguimiento desde un teléfono real.',passed:false}]} });
      if (action === 'pilot') return json({ ok:true, action:body.pilot_action });
      if (action === 'templates') return json({ templates:[{id:'t1',name:'recordatorio_valoracion',display_name:'Recordatorio de valoración',language:'es_MX',body:'Hola {{1}}, te recordamos tu valoración dental el {{2}}.',variable_count:2}] });
      if (action === 'sync') return json({ conversations:[],removed:[],synced_at:new Date().toISOString(),truncated:false });
      if (action === 'read') return json({ paused:true,needs_human:true,unread_count:0,assigned_actor_id:'owner-preview',assigned_actor_name:'Dra. Mariana' });
      if (action === 'availability_catalog') return json({ services:[{id:'service-valuation',name:'Valoracion dental integral',duration_minutes:60}],branches:[{id:'branch-centro',name:'Clínica Centro'},{id:'branch-providencia',name:'Sucursal Providencia'}],professionals:[{id:'professional-mariana',display_name:'Dra. Mariana Ruiz',specialty:'Odontologia integral'},{id:'professional-diego',display_name:'Dr. Diego Torres',specialty:'Ortodoncia'}],professional_services:[{professional_id:'professional-mariana',service_id:'service-valuation'},{professional_id:'professional-diego',service_id:'service-valuation'}] });
      if (action === 'availability') { if (new URLSearchParams(location.search).has('empty-agenda')) return json({slots:[],holds_created:false}); return json({ slots:[{starts_at:'2026-10-16T16:00:00.000Z',ends_at:'2026-10-16T17:00:00.000Z',service_id:'service-valuation',professional_id:'professional-mariana',professional_name:'Dra. Mariana Ruiz',specialty:'Odontologia integral',branch_id:'branch-centro',branch_name:'Clínica Centro',duration_minutes:60},{starts_at:'2026-10-16T18:00:00.000Z',ends_at:'2026-10-16T19:00:00.000Z',service_id:'service-valuation',professional_id:'professional-diego',professional_name:'Dr. Diego Torres',specialty:'Ortodoncia',branch_id:'branch-centro',branch_name:'Clínica Centro',duration_minutes:60},{starts_at:'2026-10-17T15:30:00.000Z',ends_at:'2026-10-17T16:30:00.000Z',service_id:'service-valuation',professional_id:'professional-mariana',professional_name:'Dra. Mariana Ruiz',specialty:'Odontologia integral',branch_id:'branch-centro',branch_name:'Clínica Centro',duration_minutes:60},{starts_at:'2026-10-17T18:30:00.000Z',ends_at:'2026-10-17T19:30:00.000Z',service_id:'service-valuation',professional_id:'professional-diego',professional_name:'Dr. Diego Torres',specialty:'Ortodoncia',branch_id:'branch-centro',branch_name:'Clínica Centro',duration_minutes:60},{starts_at:'2026-10-18T17:00:00.000Z',ends_at:'2026-10-18T18:00:00.000Z',service_id:'service-valuation',professional_id:'professional-mariana',professional_name:'Dra. Mariana Ruiz',specialty:'Odontologia integral',branch_id:'branch-centro',branch_name:'Clínica Centro',duration_minutes:60}],holds_created:false }); }
      if (action === 'appointment_requests') return json({ requests:[] });
      if (action === 'appointment_context') return json({ linked:true,patient_id:'patient-preview',items:[{id:'request-preview',service_id:'service-valuation',preferred_branch_id:'branch-centro',preferred_professional_id:'professional-mariana',requested_start:'2026-10-15T16:00:00.000Z',requested_end:'2026-10-15T17:00:00.000Z',status:'accepted',appointment_id:'appointment-preview',service:{id:'service-valuation',name:'Valoracion dental integral',duration_minutes:60},branch:{id:'branch-centro',name:'Clinica Centro',timezone:'America/Mexico_City'},professional:{id:'professional-mariana',display_name:'Dra. Mariana Ruiz',specialty:'Odontologia integral'},appointment:{id:'appointment-preview',status:'confirmed',starts_at:'2026-10-15T16:00:00.000Z',ends_at:'2026-10-15T17:00:00.000Z'}}] });
      if (action === 'appointment_request') return json({ request_id:'request-preview',status:'pending',appointment_created:false,message_sent:false });
      if (action === 'appointment_confirm') return json({ appointment_id:'appointment-preview',status:'confirmed',message_sent:false });
      return json({});
    };

  <script>
    window.addEventListener('load', function () {
      window.ir('inbox');
      setTimeout(function () {
        var row = document.querySelector('[data-conversation-id="c-preview"]');
        if (row && !pipelineDemo) row.click();
        setTimeout(function () {
          var preview = new URLSearchParams(location.search);
          if (preview.has('composer-draft')) {
            // Keep the thread unobstructed so browser QA can verify encrypted draft recovery.
          } else if (preview.has('composer-emoji')) {
            var emoji = document.querySelector('[data-compose-emoji]');
            if (emoji) emoji.click();
          } else if (preview.has('productivity-search')) {
            var profile = document.querySelector('[data-inbox-context]');
            if (profile.getAttribute('aria-expanded') !== 'true') profile.click();
            document.querySelector('[data-thread-settings]').click();
            var search = document.querySelector('[data-thread-search]');
            if (search) search.click();
          } else if (preview.has('productivity-quick')) {
            var quick = document.querySelector('[data-compose-quick]');
            if (quick) quick.click();
          } else if (preview.has('productivity-bulk')) {
            var bulk = document.querySelector('[data-inbox-bulk]');
            if (bulk) bulk.click();
          } else if (preview.has('focus') || preview.has('media-preview') || preview.has('chat-ux') || pipelineDemo) {
            // Conversation-first state: no dialog or context drawer obscures the thread.
          } else if (preview.has('inbox')) {
            var control = document.querySelector('[data-inbox-context]');
            if (control) control.click();
          } else if (preview.has('availability')) {
            var availability = Array.from(document.querySelectorAll('button')).find(function (button) { return button.textContent.trim() === 'Buscar horarios'; });
            if (availability) availability.click();
            setTimeout(function () {
              var form = document.querySelector('[data-availability-form]');
              if (form) form.dispatchEvent(new Event('submit', { bubbles:true, cancelable:true }));
            }, 120);
          } else {
            window.SmylInbox.openOperations();
          }
          document.documentElement.dataset.previewReady = 'true';
        }, 180);
      }, 180);
    });
  </script>
</body>
</html>
