<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMYL · Sistema de ventanas</title><link rel="stylesheet" href="../../smyl-design-system-v2.css?preview=1"><link rel="stylesheet" href="../../smyl-dialog-system.css?preview=2"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f7;color:#193842;font-family:Inter,system-ui,sans-serif}.shell{display:grid;grid-template-columns:218px 1fr;min-height:100vh}.side{padding:28px 18px;background:#0d2f35;color:#fff}.side h2{letter-spacing:.13em}.side span{display:block;margin:17px 0;color:#b7cbc9}.side .active{padding:11px;border-radius:9px;background:#28665f;color:#fff}.main{padding:32px}.main h1{font-size:34px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cards article{height:130px;border:1px solid #d9e3df;border-radius:16px;background:#fff}.btn{min-height:42px;border:1px solid #cad7d1;border-radius:10px;background:#fff;color:#415954;padding:0 16px;font-weight:700}.btn-primary{border-color:#176f69;background:#176f69;color:#fff}.inventory-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.inventory-form-grid label{display:grid;gap:7px}.inventory-form-grid .wide{grid-column:1/-1}.inventory-actions{display:flex}.inventory-form-grid input,.inventory-form-grid select,.inventory-form-grid textarea{width:100%}.inventory-form-grid textarea{min-height:90px}@media(max-width:700px){.shell{display:block}.side{display:none}.main{padding:18px}.cards{grid-template-columns:1fr}.inventory-form-grid{grid-template-columns:1fr}.inventory-form-grid .wide{grid-column:auto}}</style><script defer src="../../smyl-dialog-system.js"></script></head>
<body><main class="shell"><aside class="side"><h2>SMYL</h2><span>Inicio</span><span>Agenda</span><span>Pacientes</span><span class="active">Inventario</span><span>Finanzas</span></aside><section class="main"><span>CONTROL DE INSUMOS</span><h1>Inventario y compras</h1><div class="cards"><article></article><article></article><article></article></div></section></main>
<dialog open class="inventory-dialog"><form><h2>Nueva orden de compra</h2><p>Registra lo solicitado; los lotes y caducidades se capturan al recibir.</p><div class="inventory-form-grid"><label>Proveedor<select name="supplier" required><option value="">Selecciona</option><option>Dental Supply México</option></select></label><label>Destino<select name="destination" required><option value="">Selecciona</option><option>Almacén principal</option></select></label><label>Referencia<input name="reference" placeholder="OC-2026-001"></label><label>Entrega esperada<input name="expected" type="date"></label><label>Insumo<select name="item" required><option value="">Selecciona</option><option>Resina compuesta A2</option></select></label><label>Cantidad<input name="quantity" type="number" required></label><label>Costo unitario<input name="cost" type="number"></label><label class="wide">Notas<textarea name="notes"></textarea></label></div><div class="inventory-actions"><button type="button" class="btn" data-close>Cancelar</button><button class="btn btn-primary" type="submit">Crear pedido</button></div></form></dialog>
</body></html>
