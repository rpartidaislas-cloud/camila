<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SMYL · Inicio de jornada QA</title>
  <link rel="stylesheet" href="../../smyl-panel.css">
  <link rel="stylesheet" href="../../smyl-daily-home.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f4ef;font-family:Inter,Arial,sans-serif}.shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.sidebar-preview{padding:28px 18px;background:#fdfdf9;border-right:1px solid #dce2dd}.brand{padding:0 8px 30px;font-size:26px;font-weight:800;letter-spacing:-.06em}.brand small{display:block;margin-top:5px;color:#657777;font-size:10px;font-weight:500;letter-spacing:0}.sidebar-preview nav{display:grid;gap:4px}.sidebar-preview button{min-height:45px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:#526465;text-align:left}.sidebar-preview .active{background:#e8f1ef;color:#215d60;font-weight:700}.top{height:66px;display:flex;align-items:center;padding:0 32px;background:#fdfdf9;border-bottom:1px solid #dce2dd;color:#233c3d;font-weight:650}.contenido{max-width:1280px;width:100%;padding:32px;margin:0 auto}.pantalla{display:block}.pro-welcome,.pro-action-grid,.stats-grid,.pro-dashboard-columns{display:none}.btn{min-height:44px;padding:0 16px;border:1px solid #c9d7d1;border-radius:9px;background:#fff;font-weight:700}.btn-primary{background:#215d60;color:#fff;border-color:#215d60}.lana-attention-preview{margin-top:0;padding:21px;border:1px solid #dbe3de;border-radius:16px;background:#fdfdf9}.lana-attention-preview span{font-size:9px;font-weight:800;letter-spacing:1.2px;color:#4d7470}.lana-attention-preview h2{margin:6px 0 5px;font-size:17px;color:#263f3f}.lana-attention-preview p{margin:0;color:#6d7a78;font-size:10px}@media(max-width:760px){.shell{display:block}.sidebar-preview{display:none}.top{height:58px;padding:0 18px}.contenido{padding:19px 14px 70px}}
  </style>
</head>
<body class="smyl-professional">
  <div class="shell">
    <aside class="sidebar-preview"><div class="brand">smyl<small>Panel profesional</small></div><nav><button class="active">Inicio</button><button>Agenda</button><button>Mi clínica</button><button>Pacientes</button><button>Mensajes</button></nav></aside>
    <main><header class="top">Inicio</header><div class="contenido"><section class="pantalla" id="p-dashboard"><div class="pro-welcome"></div><div class="pro-action-grid"></div><div class="stats-grid"></div><div class="pro-dashboard-columns"></div><section class="lana-attention-preview"><span>ATENCIÓN OMNICANAL</span><h2>Conversaciones que necesitan a tu equipo</h2><p>2 conversaciones pendientes · 3 mensajes sin leer</p></section></section></div></main>
  </div>
  <script>
    window.tenantId='00000000-0000-0000-0000-000000000001';
    window.tenantData={nombre:'Clínica Sonrisa',config:{consultorio:'Clínica Sonrisa'}};
    window.TITULOS={};
    window.ir=function(route){document.body.dataset.route=route;};
    window.abrirModalPaciente=function(){};
    window.sbTimeout=function(value){return value;};
    const today=new Date(), at=(h,m)=>{const d=new Date(today);d.setHours(h,m,0,0);return d.toISOString();};
    const rows={
      smyl_appointments:[{id:'a1',patient_id:'p1',service_id:'s1',starts_at:at(9,30),ends_at:at(10,15),status:'arrived'},{id:'a2',patient_id:'p2',service_id:'s2',starts_at:at(13,0),ends_at:at(14,0),status:'confirmed'},{id:'a3',patient_id:'p3',service_id:'s1',starts_at:at(16,30),ends_at:at(17,15),status:'confirmed'}],
      smyl_appointment_requests:[{id:'r1',patient_id:'p4',requested_start:at(17,30),status:'pending'}],
      camila_pacientes:[{id:'p1',nombre:'Paciente',apellido:'Prueba'},{id:'p2',nombre:'Paciente',apellido:'Demo'},{id:'p3',nombre:'Paciente',apellido:'Ejemplo'},{id:'p4',nombre:'Paciente',apellido:'Muestra'}],
      smyl_services:[{id:'s1',name:'Valoración dental'},{id:'s2',name:'Limpieza preventiva'}]
    };
    function builder(table){const api={select(){return api},eq(){return api},gte(){return api},lt(){return api},order(){return api},then(resolve){resolve({data:rows[table]||[],error:null})}};return api;}
    window.sb={from:builder};
    window.SmylLanaAttention={getSummary:()=>({loaded:true,total:2,unread:3,linked:1})};
  </script>
  <script src="../../smyl-daily-home.js"></script>
</body>
</html>
