<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SMYL · Inicio de jornada QA</title>
  <link rel="stylesheet" href="../../smyl-panel.css">
  <link rel="stylesheet" href="../../smyl-design-system-v2.css">
  <link rel="stylesheet" href="../../smyl-daily-home.css">
  <link rel="stylesheet" href="../../smyl-professional-v3.css">
  <link rel="stylesheet" href="../../smyl-ui-template-v3.css">
  <link rel="stylesheet" href="../../smyl-dashboard-v2.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:Inter,Arial,sans-serif}.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.sidebar-preview{position:relative;padding:24px 14px;background:linear-gradient(180deg,#143550 0%,#091d31 100%);border-right:1px solid rgba(255,255,255,.08);box-shadow:12px 0 32px rgba(7,24,39,.08)}.brand{padding:4px 12px 28px;color:#fff;font-size:22px;font-weight:800;letter-spacing:-.06em}.brand small{display:block;margin-top:5px;color:#9fb3c3;font-size:12px;font-weight:500;letter-spacing:0}.sidebar-preview nav{display:grid;gap:5px}.sidebar-preview button{min-height:46px;padding:0 13px;border:0;border-radius:10px;background:transparent;color:#c4d1dc;font-size:13px;font-weight:600;text-align:left}.sidebar-preview button:hover{background:rgba(255,255,255,.06);color:#fff}.sidebar-preview .active{position:relative;background:rgba(255,255,255,.10);color:#fff;font-weight:700}.sidebar-preview .active::before{content:"";position:absolute;inset:8px auto 8px -14px;width:3px;border-radius:0 4px 4px 0;background:#62d1c2}.top{height:66px;display:flex;align-items:center;padding:0 32px;background:#fff;border-bottom:1px solid #dce5ec;color:#152c41;font-weight:700}.contenido{max-width:1280px;width:100%;padding:24px 30px 40px;margin:0 auto}.pantalla{display:block}.pro-welcome,.pro-action-grid,.stats-grid,.pro-dashboard-columns{display:none}.btn{min-height:44px;padding:0 16px;border:1px solid #c9d7d1;border-radius:9px;background:#fff;font-weight:700}.btn-primary{background:#215d60;color:#fff;border-color:#215d60}.lana-attention-preview{margin-top:0;padding:21px;border:1px solid #dbe3de;border-radius:16px;background:#fdfdf9}.lana-attention-preview span{font-size:12px;font-weight:800;letter-spacing:1.2px;color:#4d7470}.lana-attention-preview h2{margin:6px 0 5px;font-size:17px;color:#263f3f}.lana-attention-preview p{margin:0;color:#6d7a78;font-size:12px}@media(max-width:760px){.shell{display:block}.sidebar-preview{display:none}.top{height:58px;padding:0 18px}.contenido{padding:14px 10px 70px}}
  </style>
</head>
<body class="smyl-professional smyl-management-v3 smyl-ui-governed">
  <div class="shell">
    <aside class="sidebar-preview"><div class="brand">smyl<small>Panel profesional</small></div><nav><button class="active">Inicio</button><button>Agenda</button><button>Mi clínica</button><button>Pacientes</button><button>Mensajes</button></nav></aside>
    <main><header class="top">Inicio</header><div class="contenido"><section class="pantalla" id="p-dashboard"><div class="pro-welcome"></div><div class="pro-action-grid"></div><div class="stats-grid"></div><div class="pro-dashboard-columns"></div></section></div></main>
  </div>
  <script>
    window.tenantId='00000000-0000-0000-0000-000000000001';
    window.tenantData={nombre:'Clínica Sonrisa',config:{consultorio:'Clínica Sonrisa'}};
    window.TITULOS={};
    window.ir=function(route){document.body.dataset.route=route;};
    window.abrirModalPaciente=function(){};
    window.sbTimeout=function(value){return value;};
    const today=new Date(), at=(h,m)=>{const d=new Date(today);d.setHours(h,m,0,0);return d.toISOString();};
    const scenario=new URLSearchParams(location.search).get('scenario');
    const rows={
      smyl_appointments:[{id:'a1',patient_id:'p1',service_id:'s1',starts_at:at(9,30),ends_at:at(10,15),status:'arrived'},{id:'a2',patient_id:'p2',service_id:'s2',starts_at:at(13,0),ends_at:at(14,0),status:'confirmed'},{id:'a3',patient_id:'p3',service_id:'s1',starts_at:at(16,30),ends_at:at(17,15),status:'confirmed'}],
      smyl_appointment_requests:[{id:'r1',patient_id:'p4',requested_start:at(17,30),status:'pending'}],
      camila_pacientes:[{id:'p1',nombre:'Paciente',apellido:'Prueba'},{id:'p2',nombre:'Paciente',apellido:'Demo'},{id:'p3',nombre:'Paciente',apellido:'Ejemplo'},{id:'p4',nombre:'Paciente',apellido:'Muestra'}],
      smyl_services:[{id:'s1',name:'Valoración dental'},{id:'s2',name:'Limpieza preventiva'}]
    };
    if(scenario==='empty'){rows.smyl_appointments=[];rows.smyl_appointment_requests=[];}
    function builder(table){const api={select(){return api},eq(){return api},gte(){return api},lt(){return api},order(){return api},in(){return api},then(resolve){resolve({data:rows[table]||[],error:null})}};return api;}
    window.sb={from:builder};
    window.SmylLanaAttention={getSummary:()=>({loaded:true,total:2,unread:3,linked:1})};
    window.SmylTaskCenter={getTasks:()=>[
      {source:'agenda',title:'1 cita por confirmar',detail:'El paciente espera respuesta.',action:'Revisar',route:'agenda',rank:1},
      {source:'mensajes',title:'2 conversaciones requieren respuesta',detail:'Prioriza las que solicitaron atención.',action:'Responder',route:'inbox',open:'operations',rank:2}
    ]};
    window.SmylInbox={
      fetchRecent:async()=>scenario==='empty'?Promise.reject(new Error('Inbox temporalmente no disponible')):[
        {id:'c1',contact_name:'Paciente de ejemplo',channel:'whatsapp',last_message_at:new Date().toISOString(),needs_human:true,unread_count:2},
        {id:'c2',contact_name:'Paciente de muestra',channel:'instagram',last_message_at:new Date(Date.now()-3600000).toISOString(),needs_human:false,unread_count:1},
        {id:'c3',contact_name:'Conversación resuelta',channel:'whatsapp',last_message_at:new Date(Date.now()-7200000).toISOString(),needs_human:false,unread_count:0}
      ],
      buildAvatar:item=>{const avatar=document.createElement('span');avatar.className='smyl-inbox-avatar';avatar.textContent=item.contact_name.charAt(0);return avatar},
      timeLabel:()=> 'hoy',channelLabel:value=>value==='whatsapp'?'WhatsApp':'Instagram',open:id=>{document.body.dataset.chat=id}
    };
  </script>
  <script src="../../smyl-daily-home.js"></script>
</body>
</html>
