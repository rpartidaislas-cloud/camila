          .forEach((x) => x.classList.toggle("activa", x.id === "p-" + route));

      const data = {

      function chain(rows) {
        return {
          select() {
            return this;
          },
          eq() {
            return this;
          },
          order() {
            return this;
          },
          then(resolve) {
            resolve({ data: rows, error: null });
          },
        };
      }
      window.sb = {
        auth: {
          getSession: async () => ({
            data: { session: { user: { id: "u1" } } },
          }),
        },
        from: (name) => chain(data[name] || []),
        rpc: () => chain([]),
        storage: {
          from: () => ({
            getPublicUrl: () => ({ data: { publicUrl: "" } }),
            createSignedUrl: async () => ({ data: { signedUrl: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect width='400' height='300' fill='%23dbe9e3'/%3E%3Cpath d='M80 170 Q200 250 320 170' fill='none' stroke='white' stroke-width='30'/%3E%3C/svg%3E" } }),
