<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMYL · Navegación global QA</title><link rel="stylesheet" href="../../smyl-command-menu.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#233c3d;font-family:Inter,Arial,sans-serif}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff;border-bottom:1px solid #dce2dd}.topbar-right{display:flex;gap:9px}.btn-noti{width:38px;border:1px solid #dce2dd;border-radius:8px;background:#fff}.contenido{padding:34px}.pantalla{display:none}.pantalla.activa{display:block}.hero{max-width:800px;padding:40px;border:1px solid #dce2dd;border-radius:18px;background:#fdfdf9}.hero h1{font-size:38px;font-weight:520}.hero p{color:#637470}@media(max-width:700px){.topbar{padding:0 16px}.contenido{padding:18px}.hero{padding:24px}.hero h1{font-size:31px}}</style></head><body><header class="topbar"><div><strong>SMYL</strong></div><div class="topbar-right"><button class="btn-noti">○</button></div></header><main class="contenido"><section class="pantalla activa" id="p-dashboard"><div class="hero"><h1>Tu clínica está aquí.</h1><p>Usa el buscador global para llegar a cualquier tarea.</p></div></section></main><script>window.TITULOS={dashboard:'Inicio',agenda:'Agenda',pacientes:'Pacientes',inbox:'Mensajes',notificaciones:'Centro de alertas'};window.ir=function(route){document.querySelectorAll('.pantalla').forEach(x=>x.classList.remove('activa'));document.body.dataset.route=route;};</script><script src="../../smyl-command-menu.js"></script><script>addEventListener('load',()=>SmylCommandMenu.open());</script></body></html>
