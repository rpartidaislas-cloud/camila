<script>
(function(){
  var q=new URLSearchParams(location.search),caso=q.get('caso')||'normal';
  window.tenantId='11111111-1111-4111-8111-111111111111';
  window.miRolEquipo=q.get('rol')==='staff'?'asistente':'dueño';
  window.SMYL_QR_POLL_MS=150;window.__pac=null;
  window.TITULOS={};window.__log=[];window.__inserts=[];window.__updates=[];window.__rutas=[];
  window.ir=function(n){window.__rutas.push(n);document.querySelectorAll('.pantalla').forEach(function(p){p.classList.remove('activa');});var p=document.getElementById('p-'+n);if(p)p.classList.add('activa');};
  window.verPaciente=function(id){window.__log.push(['verPaciente',id]);
    // Expediente simulado: sus pestañas aparecen un instante después, como en el panel real.
    var old=document.getElementById('p-paciente-detalle');if(old)old.remove();
    setTimeout(function(){var d=document.createElement('div');d.id='p-paciente-detalle';d.className='pantalla';d.innerHTML='<details class="p360-more"><summary>Más del expediente</summary><div><button data-p360-domain="history">Historia clínica</button><button data-p360-domain="files">Estudios y archivos</button></div></details>';d.querySelectorAll('button').forEach(function(b){b.onclick=function(){window.__log.push(['tab',b.dataset.p360Domain,id]);};});document.querySelector('.contenido').append(d);window.ir('paciente-detalle');},60);
    return Promise.resolve(true);};
  window.abrirModalPaciente=function(id){window.__log.push(['abrirModal',id]);var m=document.getElementById('modal-paciente');if(!m){m=document.createElement('div');m.id='modal-paciente';document.body.append(m);}m.className='modal-bg visible';m.textContent='modal';window.__cerrarModal=function(){m.classList.remove('visible');};};
  window.enviarEnlaceRegistro=function(p){window.__log.push(['enlace',p.id,p.telefono]);};
  window.cerrarSesion=function(){window.__log.push(['cerrarSesion']);};
  window.SmylSchedule={bookFor:function(p){window.__log.push(['bookFor',p.id,p.nombre,p.telefono]);}};
  window.__portapapeles=[];try{Object.defineProperty(navigator,'clipboard',{value:{writeText:function(t){window.__portapapeles.push(t);return Promise.resolve();}},configurable:true});}catch(e){}
  window.open=function(u){window.__log.push(['open',u]);return null;};
  window.sbTimeout=function(x){return x;};
  var now=new Date();function at(h,m){var d=new Date(now);d.setHours(h,m,0,0);return d.toISOString();}
  var h=q.get('h')||'parcial',f=q.get('f')||'algunos';
  var pac=window.__pac={p5:{id:'p5',nombre:'Luis',apellido:'Gómez',telefono:'+52 3311112222',registro_estado:'por_verificar'},p1:{id:'p1',nombre:'Cristian',apellido:'Partida',telefono:'+52 3312345678'},p2:{id:'p2',nombre:'María',apellido:'Rodríguez de la Garza',telefono:''},p3:{id:'p3',nombre:'Juan',apellido:'Pérez',telefono:''},p4:{id:'p4',nombre:'Por registrar · +52 3398765432',apellido:'',telefono:'+52 3398765432'}};
  var citas={
    normal:[{id:'a1',patient_id:'p1',service_id:'s1',starts_at:at(10,0),status:'in_progress'},{id:'a2',patient_id:'p2',service_id:'s2',starts_at:at(11,30),status:'arrived'},{id:'a3',patient_id:'p3',service_id:'s1',starts_at:at(13,0),status:'confirmed'},{id:'a4',patient_id:'p4',service_id:'s3',starts_at:at(16,0),status:'confirmed'},{id:'a5',patient_id:'p1',service_id:'s1',starts_at:at(8,0),status:'completed'},{id:'a6',patient_id:'p3',service_id:'s1',starts_at:at(9,0),status:'cancelled'}],
    vacio:[],terminadas:[{id:'a1',patient_id:'p1',service_id:'s1',starts_at:at(8,0),status:'completed'},{id:'a2',patient_id:'p3',service_id:'s1',starts_at:at(9,0),status:'completed'}],error:[]}[caso]||[];
  var servicios=[{id:'s1',name:'Consulta y valoración inicial'},{id:'s2',name:'Blanqueamiento con férula personalizada'},{id:'s3',name:'Limpieza'}];
  function builder(table){
    var b={_t:table,_ins:null};
    ['select','gte','lt','in','order','limit','single'].forEach(function(m){b[m]=function(){return b;};});
    b.gt=function(){b._gt=true;return b;};
    b.eq=function(c,v){if(c==='id'||c==='patient_id')b._id=v;return b;};
    b.maybeSingle=function(){b._one=true;return b;};
    b.update=function(v){b._upd=v;window.__updates.push(Object.assign({table:table},v));return b;};
    b.insert=function(rows){b._ins=rows[0];window.__inserts.push(Object.assign({},rows[0]));return b;};
    b.then=function(ok,fail){
      var r;
      if(caso==='error'&&table==='smyl_appointments')r={data:null,error:{message:'Sin conexión con el servidor.'}};
      else if(table==='smyl_appointments'&&b._gt){var prox=q.get('prox')||'si';r=prox==='error'?{data:null,error:{message:'sin permiso'}}:{data:prox==='no'?[]:[{starts_at:new Date(Date.now()+3*86400000).toISOString()}],error:null};}
      else if(b._upd)r={data:{id:'x'},error:null};
      else if(table==='smyl_patient_histories'){if(h==='error')r={data:null,error:{message:'sin permiso'}};else r={data:h==='ninguna'?null:{revision:3,document:h==='completa'?{allergies_status:'no',conditions_status:'no',medications_status:'no',surgeries_status:'no',dental_status:'no',habits_status:'no'}:{allergies_status:'no'}},error:null};}
      else if(table==='smyl_patient_files'){if(f==='error')r={data:null,error:{message:'sin permiso'}};else r={data:f==='ninguno'?[]:[{category:'clinical_photo'},{category:'radiograph'},{category:'radiograph'}],error:null};}
      else if(table==='camila_tenants'&&b._one)r={data:{nombre:'Diseño de Sonrisas'},error:null};
      else if(table==='camila_pacientes'&&b._one){window.__log.push(['leePaciente',b._id]);r={data:pac[b._id]||null,error:null};}
      else if(b._ins){if(window.__fallaColumna&&b._ins.registro_estado)r={data:null,error:{code:'PGRST204',message:"Could not find the 'registro_estado' column in the schema cache"}};else{var nuevo=Object.assign({id:'nuevo-1',apellido:'',email:''},b._ins);pac['nuevo-1']=nuevo;r={data:nuevo,error:null};}}
      else if(table==='smyl_appointments')r={data:citas,error:null};
      else if(table==='smyl_services')r={data:servicios,error:null};
      else if(table==='camila_pacientes')r={data:Object.keys(pac).map(function(k){return pac[k];}),error:null};
      else if(table==='smyl_member_roles')r={data:[{role_id:'r1'}],error:null};
      else if(table==='smyl_role_permissions')r={data:window.miRolEquipo==='dueño'?[]:[{permission_key:'schedule.read'}],error:null};
      else r={data:[],error:null};
      return Promise.resolve(r).then(ok,fail);
    };
    return b;
  }
  window.sb={auth:{getUser:function(){return Promise.resolve({data:{user:{id:'u1'}}});}},from:builder,
    rpc:function(name,args){window.__log.push(['rpc',name,args]);
      if(name==='smyl_search_patients'){var t=String(args.p_query||'').toLowerCase();var rows=Object.keys(pac).map(function(k){return pac[k];}).filter(function(p){return (p.nombre+' '+p.apellido+' '+p.telefono).toLowerCase().indexOf(t)>=0;});return Promise.resolve({data:rows,error:null});}
      if(name==='smyl_patient_duplicates'){var d=String(args.p_telefono||'').replace(/\D/g,'');return Promise.resolve({data:d.slice(-10)==='3312345678'?[{id:'p1',name:'Cristian Partida',phone:'+52 3312345678',match:'telefono'}]:[],error:null});}
      if(name==='smyl_patient_consent_status'){var fm=q.get('firma')||'si';
        if(fm==='error')return Promise.resolve({data:null,error:{message:'sin permiso',code:'42501'}});
        return Promise.resolve({data:fm==='si'?{signed:true,id:'c1',signed_at:'2026-11-16T18:00:00Z',signer_name:'Ana López',signer_relation:'patient',notice_version:'modelo-provisional-1',provisional:true}:{signed:false},error:null});}
      if(name==='smyl_set_patient_privacy_choice'){window.__decisiones=(window.__decisiones||[]);window.__decisiones.push(JSON.parse(JSON.stringify(args)));return Promise.resolve({data:'e-nuevo',error:null});}
      if(name==='smyl_record_patient_consent'){window.__firmas=(window.__firmas||[]);window.__firmas.push(JSON.parse(JSON.stringify(args)));var fe=q.get('firmaerr');
        if(fe==='42501')return Promise.resolve({data:null,error:{code:'42501',message:'No tienes permiso para registrar firmas.'}});
        if(fe==='22023')return Promise.resolve({data:null,error:{code:'22023',message:'La firma no es válida. Vuelve a firmar.'}});
        if(fe==='falta')return Promise.resolve({data:null,error:{code:'PGRST202',message:'Could not find the function'}});
        return Promise.resolve({data:'c-nuevo',error:null});}
      if(name==='smyl_get_patient_consent'){window.__log.push(['verFirma',args.p_consent_id]);return Promise.resolve({data:{id:'c1',signed_at:'2026-11-16T18:00:00Z',notice_version:'modelo-provisional-1',provisional:true,notice_text:'Párrafo uno del aviso.\n\nPárrafo dos.',notice_sha256:'ab'.repeat(32),signer_name:'Ana López',signer_relation:'patient',signature_png:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='},error:null});}
      if(name==='smyl_create_registration_link'){window.__enlaces=(window.__enlaces||[]);window.__enlaces.push(args.p_patient_id);var qrm=q.get('qr')||'ok';
        if(qrm==='42501')return Promise.resolve({data:null,error:{code:'42501',message:'sin permiso'}});
        if(qrm==='falta')return Promise.resolve({data:null,error:{code:'PGRST202',message:'Could not find the function'}});
        return Promise.resolve({data:'ab'.repeat(32),error:null});}
      if(name==='smyl_save_patient_history'){window.__guardados=(window.__guardados||[]);window.__guardados.push(JSON.parse(JSON.stringify(args)));
        if(window.__falla40001)return Promise.resolve({data:null,error:{code:'40001',message:'Los antecedentes cambiaron en otra sesión.'}});
        if(window.__falla42501)return Promise.resolve({data:null,error:{code:'42501',message:'No tienes permiso.'}});
        return Promise.resolve({data:{revision:4},error:null});}
      return Promise.resolve({data:[],error:null});}};
})();
