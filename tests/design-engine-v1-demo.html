<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMYL Design Engine v1.2 — regresión visual</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a10;color:#fff;font:14px Inter,system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.head h1{font-size:22px;margin:0 0 5px}.head p{margin:0;color:#9ca3af}.badge{padding:7px 10px;border:1px solid #334155;border-radius:99px;color:#cbd5e1;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{overflow:hidden;border:1px solid #242938;border-radius:16px;background:#11131b}.card h2{font-size:12px;margin:0;padding:12px 14px;border-bottom:1px solid #242938;color:#cbd5e1}.stage{aspect-ratio:8/5;background:#05060a}.stage canvas,.stage img{display:block;width:100%;height:100%;object-fit:contain}.report{margin-top:16px;padding:14px;border:1px solid #242938;border-radius:14px;background:#11131b;white-space:pre-wrap;color:#a7f3d0;font:12px ui-monospace,monospace}.error{color:#fca5a5}@media(max-width:720px){.shell{padding:16px}.grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<main class="shell">
  <div class="head"><div><h1>SMYL Design Engine v1.2</h1><p>Anatomía individual · textura fuente · estratificación cervical e incisal · ninguna llamada de IA</p></div><span class="badge">REGRESIÓN VISUAL LOCAL</span></div>
  <section class="grid">
    <article class="card"><h2>ORIGINAL SINTÉTICO</h2><div class="stage"><canvas id="before" width="960" height="600"></canvas></div></article>
    <article class="card"><h2>RECTANGULAR SUAVE · ESMALTE NATURAL</h2><div class="stage"><img id="after-rect" alt="Seis coronas anatómicas con textura y translucidez natural"></div></article>
    <article class="card"><h2>OVAL</h2><div class="stage"><img id="after-oval" alt="Seis coronas completas de familia oval"></div></article>
    <article class="card"><h2>TRIANGULAR</h2><div class="stage"><img id="after-tri" alt="Seis coronas completas de familia triangular"></div></article>
  </section>
  <pre id="report" class="report">Preparando motor…</pre>
</main>
<iframe id="engine" src="../simulacion.html?deviceDiag=1" hidden></iframe>
<script>
const canvas=document.getElementById('before'),ctx=canvas.getContext('2d');
const skin=ctx.createRadialGradient(480,240,80,480,300,600);skin.addColorStop(0,'#c98f72');skin.addColorStop(1,'#865845');ctx.fillStyle=skin;ctx.fillRect(0,0,960,600);
ctx.fillStyle='#8b3f4a';ctx.beginPath();ctx.ellipse(480,352,328,104,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#281416';ctx.beginPath();ctx.ellipse(480,348,286,67,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#ba756e';ctx.beginPath();ctx.ellipse(480,300,298,55,0,Math.PI,Math.PI*2);ctx.fill();
const originals=[];const widths=[62,58,76,76,58,62];let x=292;
widths.forEach((w,index)=>{const h=index===2||index===3?105:94;const y=302+(index===0||index===5?8:index===1||index===4?5:0);originals.push({x,y,w,h,fdi:['13','12','11','21','22','23'][index]});const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#d7b78d');g.addColorStop(.65,'#e2c9a4');g.addColorStop(1,'#c9a780');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,w,h,[20,20,13,13]);ctx.fill();ctx.strokeStyle='rgba(75,45,34,.25)';ctx.lineWidth=2;ctx.stroke();x+=w+4;});
ctx.fillStyle='#b05a61';ctx.beginPath();ctx.ellipse(480,437,305,45,0,0,Math.PI);ctx.fill();

document.getElementById('engine').addEventListener('load',async()=>{
  const report=document.getElementById('report');
  try{
    const w=document.getElementById('engine').contentWindow;
    const localMap=w.construirMapaDentalLocalV1(canvas,'frontal');
    const cases=[
      {family:'rectangular-soft',target:'after-rect'},
      {family:'oval',target:'after-oval'},
      {family:'triangular',target:'after-tri'},
    ];
    const results=await Promise.all(cases.map(async item=>{
      const plan=w.construirPlanoGeometricoDental(localMap.pieces,960,600,{family:item.family,sizeFactor:1.02});
      const result=await w.renderizarSimulacionBibliotecaV1(canvas.toDataURL('image/png'),plan,{code:'A1',screenRgb:[236,234,233]},{vitaMode:'vita',finish:'natural',intensity:'balanced'});
      document.getElementById(item.target).src=result.url;
      return result.metrics;
    }));
    report.textContent=JSON.stringify({locator:localMap.locator,locatorConfidence:localMap.locatorConfidence,geometry:localMap.pieces,results},null,2);
    report.classList.toggle('error',results.some(item=>!item.continuousCrowns));
  }catch(error){report.textContent=error&&error.stack||String(error);report.classList.add('error');}
});
</script>
</body>
</html>
