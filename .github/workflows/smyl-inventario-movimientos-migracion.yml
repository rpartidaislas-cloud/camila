name: SMYL Inventario - último movimiento por insumo (migración)

# Aplica en producción la migración 20261114150000_smyl_inventory_last_movements.sql:
#   - smyl_inventory_last_movements: fecha del último movimiento por insumo y ubicación (alerta «sin movimiento»).
# Solo lectura: no cambia tablas ni datos. Manual (workflow_dispatch). Requiere SUPABASE_ACCESS_TOKEN. Es idempotente.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-inventario-movimientos-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      COSTOS_VERSION: "20261114150000"
      COSTOS_FILE: supabase/migrations/20261114150000_smyl_inventory_last_movements.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar la migración
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const proc = nombre => `exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = '${nombre}')`;
          const prerequisitos = async () => (await consultar(`select
            ${proc('smyl_post_inventory_movement')} as movimientos_fn_ok,
            ${proc('smyl_inventory_historical_unit_cost')} as costo_historico_fn_ok,
            ${proc('smyl_current_tenant')} as tenant_fn_ok,
            ${proc('smyl_has_permission')} as permiso_fn_ok,
            to_regclass('public.smyl_inventory_items') is not null as insumos_ok,
            to_regclass('public.smyl_inventory_suppliers') is not null as proveedores_ok`))?.[0] || {};

          const estado = async () => (await consultar(`select
            ${proc('smyl_inventory_last_movements')} as funcion_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.COSTOS_VERSION}') as historial_costos`))?.[0] || {};

          const completo = e => e.funcion_ok;

          const req = await prerequisitos();
          console.log('Prerrequisitos:', JSON.stringify(req));
          if (!Object.values(req).every(Boolean)) throw new Error(`Faltan piezas de SMYL; no se aplicó nada: ${JSON.stringify(req)}`);

          const antes = await estado();
          console.log('Antes:', JSON.stringify(antes));
          if (!completo(antes)) {
            await consultar(fs.readFileSync(process.env.COSTOS_FILE, 'utf8'));
            console.log('Migración de costos de inventario aplicada.');
          } else {
            console.log('La migración de costos de inventario ya estaba aplicada.');
          }

          const despues = await estado();
          console.log('Después:', JSON.stringify(despues));
          if (!completo(despues)) throw new Error(`Verificacion incompleta: ${JSON.stringify(despues)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_costos=${!despues.historial_costos}\n`);
          NODE

      - name: Registrar versión aplicada
        if: steps.esquema.outputs.reparar_costos == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # La CLI nueva apunta por omisión al stack local (--remote para el proyecto enlazado) y exige --yes sin terminal; la anterior usaba --linked.
          REPAIR_FLAG=--linked
          if supabase migration repair --help 2>&1 | grep -q -- '--remote'; then REPAIR_FLAG="--remote --yes"; fi
          supabase migration repair $REPAIR_FLAG --status applied "$COSTOS_VERSION"
