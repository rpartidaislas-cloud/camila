name: SMYL Ficha 360 - cronología segura (migración)

# Aplica manualmente la cronología longitudinal de la Ficha 360 y endurece
# las lecturas directas por permiso + alcance del paciente. No transforma datos.
# Requiere SUPABASE_ACCESS_TOKEN con acceso al proyecto de producción.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-ficha-360-timeline-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      MIGRATION_VERSION: "20261027130000"
      MIGRATION_FILE: supabase/migrations/20261027130000_smyl_patient_timeline_v2.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta SUPABASE_ACCESS_TOKEN en los secretos del repositorio."
            exit 1
          fi

      - name: Aplicar y verificar la cronología de la ficha
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const TABLES = [
            'camila_pacientes','smyl_appointments','smyl_clinical_notes','smyl_patient_files',
            'smyl_dental_records','smyl_dental_versions','smyl_photo_reviews','smyl_photo_review_versions',
            'smyl_radiograph_reviews','smyl_radiograph_review_versions','smyl_patient_case_archive',
            'smyl_clinical_plans','smyl_clinical_versions','smyl_proposals','smyl_proposal_versions',
            'smyl_proposal_events','smyl_finance_charges','smyl_finance_payments','smyl_finance_refunds',
            'smyl_finance_receipts','smyl_cfdi_drafts','camila_lana_handoffs','camila_lana_clinical_links'
          ];
          const FUNCTIONS = [
            'smyl_current_tenant','smyl_has_permission','smyl_can_access_patient',
            'smyl_can_access_schedule_row','smyl_can_access_finance_patient'
          ];

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };
          const lista = values => values.map(value => `'${value}'`).join(',');

          const prerequisitos = async () => {
            const tables = (await consultar(`select table_name as name from information_schema.tables where table_schema='public' and table_name in (${lista(TABLES)})`)).map(row => row.name);
            const functions = (await consultar(`select distinct proname as name from pg_proc where pronamespace='public'::regnamespace and proname in (${lista(FUNCTIONS)})`)).map(row => row.name);
            return {
              missingTables: TABLES.filter(name => !tables.includes(name)),
              missingFunctions: FUNCTIONS.filter(name => !functions.includes(name)),
            };
          };

          const inspeccionar = async () => (await consultar(`with target as (
              select p.oid,p.prosecdef,p.proacl,p.proowner,pg_get_functiondef(p.oid) as definition,
                array_to_string(p.proconfig,',') as config
              from pg_proc p
              where p.oid=to_regprocedure('public.smyl_patient_timeline(uuid,integer)')
            ) select
              exists(select 1 from target) as function_ok,
              coalesce((select prosecdef from target),false) as security_definer_ok,
              coalesce((select config like '%search_path=pg_catalog, public%' or config like '%search_path=pg_catalog,public%' from target),false) as search_path_ok,
              coalesce((select has_function_privilege('authenticated',oid,'execute') from target),false) as authenticated_ok,
              coalesce((select not has_function_privilege('anon',oid,'execute') from target),false) as anon_blocked,
              coalesce((select not exists(
                select 1 from aclexplode(coalesce(target.proacl,acldefault('f',target.proowner))) acl
                where acl.grantee=0 and acl.privilege_type='EXECUTE'
              ) from target),false) as public_blocked,
              coalesce((select definition like '%smyl_can_access_patient%' and definition like '%smyl_can_access_schedule_row%'
                and definition like '%smyl_can_access_finance_patient%' and definition like '%conversation_link%'
                and definition like '%dental_record%' and definition like '%clinical_plan%'
                and definition like '%proposal_event%' and definition like '%timeline.metadata::text%' from target),false) as gates_ok,
              (select count(*)=8 from pg_indexes where schemaname='public' and indexname in (
                'smyl_dental_versions_patient_timeline_idx','smyl_clinical_versions_patient_timeline_idx',
                'smyl_photo_reviews_patient_timeline_idx','smyl_radiograph_reviews_patient_timeline_idx',
                'smyl_proposals_patient_timeline_idx','smyl_cfdi_drafts_patient_timeline_idx',
                'smyl_finance_refunds_payment_timeline_idx','camila_lana_clinical_links_patient_timeline_idx'
              )) as indexes_ok,
              (select count(*)=13 from pg_policies where schemaname='public' and policyname in (
                'smyl_dental_records_scoped_read','smyl_dental_versions_scoped_read',
                'smyl_photo_reviews_scoped_read','smyl_photo_review_versions_scoped_read',
                'smyl_radiograph_reviews_scoped_read','smyl_radiograph_review_versions_scoped_read',
                'smyl_patient_case_archive_scoped_read','smyl_clinical_plans_scoped_read',
                'smyl_clinical_versions_scoped_read','smyl_proposals_scoped_read',
                'smyl_proposal_versions_scoped_read','smyl_proposal_events_scoped_read',
                'camila_lana_handoffs_scoped_read'
              ) and qual like '%smyl_can_access_patient%') as policies_ok,
              exists(select 1 from pg_policies where schemaname='public' and policyname='camila_lana_clinical_links_scoped_read'
                and qual like '%smyl_can_access_patient%') as clinical_links_policy_ok,
              exists(select 1 from supabase_migrations.schema_migrations where version='${process.env.MIGRATION_VERSION}') as history_ok`))?.[0] || {};

          const complete = state => state.function_ok && state.security_definer_ok && state.search_path_ok
            && state.authenticated_ok && state.anon_blocked && state.public_blocked && state.gates_ok
            && state.indexes_ok && state.policies_ok && state.clinical_links_policy_ok;

          const required = await prerequisitos();
          console.log('Prerrequisitos faltantes:', JSON.stringify(required));
          if (required.missingTables.length || required.missingFunctions.length) {
            throw new Error(`Faltan dependencias previas; no se aplicó nada: ${JSON.stringify(required)}`);
          }

          const before = await inspeccionar();
          console.log('Estado previo:', JSON.stringify(before));
          if (!complete(before)) {
            await consultar(fs.readFileSync(process.env.MIGRATION_FILE,'utf8'));
            console.log('Cronología segura aplicada.');
          } else {
            console.log('La cronología segura ya estaba completa.');
          }

          const after = await inspeccionar();
          console.log('Estado final:', JSON.stringify(after));
          if (!complete(after)) throw new Error(`Verificación incompleta: ${JSON.stringify(after)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `repair=${!after.history_ok}\n`);
          NODE

      - name: Registrar versión aplicada
        if: steps.esquema.outputs.repair == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase migration repair --status applied "$MIGRATION_VERSION"
