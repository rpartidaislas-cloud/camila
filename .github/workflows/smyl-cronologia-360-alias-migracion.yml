name: SMYL Cronologia 360 - correccion de alias (migracion 20261028090000)

# Aplica SOLA la migracion 20261028090000_smyl_patient_timeline_alias_fix.sql: re-crea
# smyl_patient_timeline con los alias que le faltaban al primer UNION (en PostgreSQL 16 la version de
# 20261027130000 falla). No agrega eventos radiograficos ni toca ninguna tabla. Cambia la cronologia de la
# Ficha 360 de TODAS las clinicas. La verificacion y la prueba de humo corren contra la base, no hay pruebas locales. Requiere SUPABASE_ACCESS_TOKEN. Se dispara a mano; nunca en push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-cronologia-360-alias-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta SUPABASE_ACCESS_TOKEN en los secretos del repositorio."
            exit 1
          fi

      - name: Aplicar y verificar la correccion de la cronologia
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          // Orden obligatorio; cada una se aplica sólo si su objeto centinela no existe todavía.
          const MIGRATIONS = [
            { version: '20261028090000', file: 'supabase/migrations/20261028090000_smyl_patient_timeline_alias_fix.sql', definition: ['smyl_patient_timeline(uuid,integer)', 'as event_at'] },
          ];
          // Prerrequisitos: helpers de autorización + lo que consulta la cronología (20261027130000 y la Ficha 360).
          const TABLES = ['camila_pacientes','camila_tenants','smyl_appointments','smyl_clinical_notes','smyl_patient_files','smyl_dental_versions','smyl_photo_reviews','smyl_radiograph_reviews',
            'smyl_clinical_versions','smyl_proposals','smyl_proposal_events','smyl_finance_charges','smyl_finance_payments','smyl_finance_refunds',
            'smyl_finance_receipts','smyl_cfdi_drafts','camila_lana_handoffs','camila_lana_clinical_links'];
          const FUNCTIONS = ['smyl_current_tenant','smyl_has_permission','smyl_can_access_patient','smyl_can_access_schedule_row','smyl_can_access_finance_patient','smyl_patient_timeline'];

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };
          const lista = values => values.map(value => `'${value}'`).join(',');

          const tables = (await consultar(`select table_name as name from information_schema.tables where table_schema='public' and table_name in (${lista(TABLES)})`)).map(r => r.name);
          const functions = (await consultar(`select distinct proname as name from pg_proc where pronamespace='public'::regnamespace and proname in (${lista(FUNCTIONS)})`)).map(r => r.name);
          const missing = { tables: TABLES.filter(t => !tables.includes(t)), functions: FUNCTIONS.filter(f => !functions.includes(f)) };
          console.log('Prerrequisitos faltantes:', JSON.stringify(missing));
          if (missing.tables.length || missing.functions.length) throw new Error(`Faltan dependencias previas; no se aplicó nada: ${JSON.stringify(missing)}`);

          const existe = async name => (await consultar(`select to_regclass('public.${name}') is not null as ok`))[0].ok === true;
          const repair = [];
          for (const m of MIGRATIONS) {
            let presente;
            if (m.definition) presente = (await consultar(`select coalesce(pg_get_functiondef(to_regprocedure('public.${m.definition[0]}')) like '%${m.definition[1]}%', false) as ok`))[0].ok === true;
            if (presente) { console.log(`${m.version}: ya estaba aplicada.`); }
            else { await consultar(fs.readFileSync(m.file, 'utf8')); console.log(`${m.version}: aplicada.`) }
            const registrada = (await consultar(`select exists(select 1 from supabase_migrations.schema_migrations where version='${m.version}') as ok`))[0].ok;
            if (!registrada) repair.push(m.version);
          }

          // Prueba de humo de la cronología: se ejecuta como una dueña real de clínica con un paciente (sólo lectura,
          // dentro de un DO que no escribe). Si la clínica no tiene pacientes todavía, se omite con aviso.
          const humo = (await consultar(`do $$
            declare v_t uuid; v_p uuid;
            begin
              select p.tenant_id, p.id into v_t, v_p from public.camila_pacientes p join public.camila_tenants t on t.id = p.tenant_id limit 1;
              if v_p is null then raise notice 'sin pacientes: humo omitido'; return; end if;
              perform set_config('request.jwt.claim.sub', v_t::text, true);
              perform set_config('request.jwt.claims', json_build_object('sub', v_t, 'role', 'authenticated')::text, true);
              perform set_config('role', 'authenticated', true);
              perform * from public.smyl_patient_timeline(v_p, 5);
            end $$;
            select true as ok`))[0];
          console.log('Cronología (humo):', JSON.stringify(humo));

          const estado = (await consultar(`select
            coalesce(pg_get_functiondef(to_regprocedure('public.smyl_patient_timeline(uuid,integer)')) like '%as event_at%', false) as aliases_ok,
            not exists (select 1 from pg_proc where oid = to_regprocedure('public.smyl_patient_timeline(uuid,integer)') and pg_get_functiondef(oid) like '%radiograph_source%') as sin_eventos_radiograficos,
            has_function_privilege('authenticated','public.smyl_patient_timeline(uuid,integer)','execute') as authenticated_ok,
            not has_function_privilege('anon','public.smyl_patient_timeline(uuid,integer)','execute') as anon_blocked`))[0];
          console.log('Estado final:', JSON.stringify(estado));
          if (!Object.values(estado).every(v => v === true)) throw new Error(`Verificación incompleta: ${JSON.stringify(estado)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `repair=${repair.join(' ')}\n`);
          NODE

      - name: Registrar versiones aplicadas
        if: steps.esquema.outputs.repair != ''
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          for v in ${{ steps.esquema.outputs.repair }}; do supabase migration repair --status applied "$v"; done
