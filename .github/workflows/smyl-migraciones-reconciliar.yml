name: SMYL - Reconciliar migraciones (solo lectura)

# Compara supabase/migrations del repo con supabase_migrations.schema_migrations de producción y lo imprime:
#   - migraciones del repo que NO están aplicadas,
#   - versiones aplicadas que no tienen archivo en el repo,
#   - esquema base sin versión (camila_*.sql, stripe_billing.sql) que no se puede comparar.
# NO modifica nada. Manual (workflow_dispatch). Requiere el secreto SUPABASE_ACCESS_TOKEN.
# Falla (rojo) si hay diferencias, para que se note; el detalle queda en el registro y en el resumen del job.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-migraciones-reconciliar
  cancel-in-progress: false

jobs:
  reconciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Leer versiones aplicadas y comparar
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';
          import { reconciliar, resumen } from './scripts/compare-migrations.mjs';
          const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
            method: 'POST',
            headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
            body: JSON.stringify({ query: 'select version from supabase_migrations.schema_migrations order by version' }),
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
          const aplicadas = JSON.parse(body).map((r) => r.version);
          const r = reconciliar(fs.readdirSync('supabase/migrations'), aplicadas);
          const texto = resumen(r);
          console.log(texto);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```\n' + texto + '\n```\n');
          if (r.faltanEnProduccion.length || r.soloEnProduccion.length) {
            console.log('::error::Hay diferencias entre el repo y producción (ver arriba).');
            process.exit(1);
          }
          NODE
