name: SMYL Pacientes - búsqueda en el servidor (migración)

# Aplica supabase/migrations/20261021120000_smyl_search_patients.sql en el proyecto de
# producción de SMYL: la función smyl_search_patients, que la Agenda usa para buscar
# pacientes sin descargarlos todos. Manual a propósito (sólo workflow_dispatch).
# Requiere el secreto de repositorio SUPABASE_ACCESS_TOKEN. La migración es idempotente
# y, antes de aplicar, se comprueba que existan las piezas de las que depende.
# Mientras no se aplique, la Agenda sigue funcionando con una búsqueda de respaldo.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-buscar-pacientes-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      MIGRATION_VERSION: "20261021120000"
      MIGRATION_FILE: supabase/migrations/20261021120000_smyl_search_patients.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar la búsqueda de pacientes
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const prerequisitos = async () => {
            const row = (await consultar(`select
              exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_current_tenant') as tenant_ok,
              exists(select 1 from information_schema.tables where table_schema = 'public' and table_name = 'camila_pacientes') as pacientes_ok`))?.[0] || {};
            return { faltanFunciones: row.tenant_ok ? [] : ['smyl_current_tenant'], faltanTablas: row.pacientes_ok ? [] : ['camila_pacientes'] };
          };

          const inspeccionar = async () => (await consultar(`select
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_search_patients') as funcion_ok,
            coalesce((select not p.prosecdef from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_search_patients' limit 1), false) as invoker_ok,
            coalesce((select has_function_privilege('authenticated', p.oid, 'execute') and not has_function_privilege('anon', p.oid, 'execute')
              from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_search_patients' limit 1), false) as permisos_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.MIGRATION_VERSION}') as historial_ok`))?.[0] || {};

          const completo = estado => estado.funcion_ok && estado.invoker_ok && estado.permisos_ok;

          const requisitos = await prerequisitos();
          console.log('Prerrequisitos faltantes:', JSON.stringify(requisitos));
          if (requisitos.faltanFunciones.length || requisitos.faltanTablas.length) {
            throw new Error(`Faltan migraciones previas de SMYL en este proyecto; no se aplicó nada: ${JSON.stringify(requisitos)}`);
          }
          const antes = await inspeccionar();
          console.log('Antes:', JSON.stringify(antes));
          if (!completo(antes)) {
            await consultar(fs.readFileSync(process.env.MIGRATION_FILE, 'utf8'));
            console.log('Búsqueda de pacientes aplicada.');
          } else {
            console.log('La búsqueda de pacientes ya estaba completa.');
          }
          const despues = await inspeccionar();
          console.log('Después:', JSON.stringify(despues));
          if (!completo(despues)) throw new Error(`Verificacion incompleta: ${JSON.stringify(despues)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar=${!despues.historial_ok}\n`);
          NODE

      - name: Registrar versión aplicada
        if: steps.esquema.outputs.reparar == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase migration repair --status applied "$MIGRATION_VERSION"
