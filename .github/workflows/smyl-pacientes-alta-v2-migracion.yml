name: SMYL Pacientes - alta v2 (migración)

# Aplica supabase/migrations/20261020150000_smyl_patient_intake_v2.sql en el
# proyecto de producción de SMYL: origen, sucursal, profesional, alertas médicas
# y consentimiento de WhatsApp en camila_pacientes, más la búsqueda de
# duplicados smyl_patient_duplicates.
#
# Manual a propósito (sólo workflow_dispatch). Requiere el secreto de
# repositorio SUPABASE_ACCESS_TOKEN con acceso al proyecto. La migración es
# idempotente; antes de aplicar se comprueba que existan las tablas y funciones
# de las que depende, y si falta alguna el flujo se detiene sin cambiar nada.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-pacientes-alta-v2-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      MIGRATION_VERSION: "20261020150000"
      MIGRATION_FILE: supabase/migrations/20261020150000_smyl_patient_intake_v2.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar el alta de pacientes v2
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const COLUMNAS = ['origen', 'branch_id', 'professional_id', 'alertas_medicas', 'consentimiento_whatsapp', 'consentimiento_whatsapp_at'];
          const PREREQUISITOS_FUNCIONES = ['smyl_current_tenant', 'smyl_has_permission', 'smyl_can_access_patient', 'smyl_normalize_contact_phone'];
          const PREREQUISITOS_TABLAS = ['camila_pacientes', 'smyl_branches', 'smyl_professionals'];

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };
          const lista = valores => valores.map(valor => `'${valor}'`).join(',');

          const prerequisitos = async () => {
            const funciones = (await consultar(`select p.proname as nombre from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname in (${lista(PREREQUISITOS_FUNCIONES)})`)).map(row => row.nombre);
            const tablas = (await consultar(`select table_name as nombre from information_schema.tables where table_schema = 'public' and table_name in (${lista(PREREQUISITOS_TABLAS)})`)).map(row => row.nombre);
            return {
              faltanFunciones: PREREQUISITOS_FUNCIONES.filter(nombre => !funciones.includes(nombre)),
              faltanTablas: PREREQUISITOS_TABLAS.filter(nombre => !tablas.includes(nombre)),
            };
          };

          const inspeccionar = async () => {
            const columnas = (await consultar(`select column_name as nombre from information_schema.columns where table_schema = 'public' and table_name = 'camila_pacientes' and column_name in (${lista(COLUMNAS)})`)).map(row => row.nombre);
            const resto = (await consultar(`select
              (select count(*) from pg_constraint where conname in ('camila_pacientes_branch_fk', 'camila_pacientes_professional_fk')) = 2 as llaves_ok,
              exists(select 1 from pg_trigger t where t.tgname = 'smyl_patient_consent_stamp' and t.tgrelid = 'public.camila_pacientes'::regclass and not t.tgisinternal) as trigger_ok,
              exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_patient_duplicates') as funcion_ok,
              coalesce((select has_function_privilege('authenticated', p.oid, 'execute') and not has_function_privilege('anon', p.oid, 'execute')
                from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_patient_duplicates' limit 1), false) as permisos_ok,
              exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.MIGRATION_VERSION}') as historial_ok`))?.[0] || {};
            return { faltanColumnas: COLUMNAS.filter(nombre => !columnas.includes(nombre)), ...resto };
          };

          const completo = estado => !estado.faltanColumnas.length && estado.llaves_ok && estado.trigger_ok && estado.funcion_ok && estado.permisos_ok;

          const requisitos = await prerequisitos();
          console.log('Prerrequisitos faltantes:', JSON.stringify(requisitos));
          if (requisitos.faltanFunciones.length || requisitos.faltanTablas.length) {
            throw new Error(`Faltan migraciones previas de SMYL en este proyecto; no se aplicó nada: ${JSON.stringify(requisitos)}`);
          }

          const antes = await inspeccionar();
          console.log('Antes:', JSON.stringify(antes));
          if (!completo(antes)) {
            await consultar(fs.readFileSync(process.env.MIGRATION_FILE, 'utf8'));
            console.log('Alta de pacientes v2 aplicada.');
          } else {
            console.log('El esquema del alta v2 ya estaba completo.');
          }
          const despues = await inspeccionar();
          console.log('Después:', JSON.stringify(despues));
          if (!completo(despues)) throw new Error(`Verificacion incompleta: ${JSON.stringify(despues)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar=${!despues.historial_ok}\n`);
          NODE

      - name: Registrar versión aplicada
        if: steps.esquema.outputs.reparar == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase migration repair --status applied "$MIGRATION_VERSION"
