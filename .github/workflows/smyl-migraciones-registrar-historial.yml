name: SMYL - Registrar historial de migraciones ya aplicadas

# La reconciliación (smyl-migraciones-reconciliar.yml) mostró migraciones del repo que no figuran en el historial de
# producción porque se aplicaron con el SQL Editor o con un workflow cuyo paso final de registro falló.
# Este workflow, para cada una de ESAS migraciones pendientes:
#   - si su efecto ya está en la base (sentinela), sólo la registra en el historial;
#   - si sólo redefine funciones con CREATE OR REPLACE (o es idempotente por diseño), la vuelve a aplicar y la registra;
#   - si su efecto NO está en la base, NO la registra y lo avisa (hay que aplicarla con su workflow).
# No toca nada más. Manual (workflow_dispatch). Requiere SUPABASE_ACCESS_TOKEN.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-migraciones-registrar-historial
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Verificar y reaplicar lo necesario
        id: plan
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';
          import { reconciliar } from './scripts/compare-migrations.mjs';
          import { SENTINELAS, planificar } from './scripts/migration-sentinels.mjs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const aplicadas = (await consultar('select version from supabase_migrations.schema_migrations order by version')).map(r => r.version);
          const archivos = fs.readdirSync('supabase/migrations');
          const r = reconciliar(archivos, aplicadas);
          const pendientes = r.faltanEnProduccion.map(x => x.version);
          console.log('Pendientes de registro:', JSON.stringify(pendientes));

          const resultados = {};
          for (const v of pendientes) {
            const regla = SENTINELAS[v];
            if (regla?.sentinel) resultados[v] = Boolean((await consultar(regla.sentinel))?.[0]?.ok);
          }
          const plan = planificar(pendientes, v => resultados[v]);
          console.log('Plan:', JSON.stringify(plan));

          const aRegistrar = [];
          for (const a of plan) {
            const archivo = r.faltanEnProduccion.find(x => x.version === a.version).archivo;
            if (a.accion === 'reaplicar_y_registrar') {
              await consultar(fs.readFileSync(`supabase/migrations/${archivo}`, 'utf8'));
              console.log(`Reaplicada: ${archivo}`);
              aRegistrar.push(a.version);
            } else if (a.accion === 'registrar') {
              aRegistrar.push(a.version);
            } else if (a.accion === 'no_aplicada') {
              console.log(`::warning::${archivo}: su efecto NO está en producción; no se registra. Aplícala con su workflow.`);
            } else {
              console.log(`::warning::${archivo}: no hay forma conocida de verificarla; no se registra.`);
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `versiones=${aRegistrar.join(' ')}\n`);
          NODE

      - name: Registrar en el historial
        if: steps.plan.outputs.versiones != ''
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # La CLI nueva apunta por omisión al stack local (--remote para el proyecto enlazado) y exige --yes sin terminal; la anterior usaba --linked.
          REPAIR_FLAG=--linked
          if supabase migration repair --help 2>&1 | grep -q -- '--remote'; then REPAIR_FLAG="--remote --yes"; fi
          supabase migration repair $REPAIR_FLAG --status applied ${{ steps.plan.outputs.versiones }}
