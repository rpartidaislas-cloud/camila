name: SMYL Chat - resumen guardado (migración)

# Aplica supabase/migrations/20261117013000_smyl_conversation_summaries.sql en el
# proyecto de producción de SMYL: tabla smyl_conversation_summaries para guardar
# el resumen de conversación de la Ficha 360 del chat.
#
# Manual a propósito (sólo workflow_dispatch). Requiere el secreto de
# repositorio SUPABASE_ACCESS_TOKEN con acceso al proyecto. La migración es
# idempotente; antes de aplicar se comprueba que exista camila_tenants y, al
# final, que la tabla tenga RLS activo y ningún permiso para anon/authenticated.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-resumen-chat-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      MIGRATION_VERSION: "20261117013000"
      MIGRATION_FILE: supabase/migrations/20261117013000_smyl_conversation_summaries.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar el resumen guardado del chat
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const inspeccionar = async () => (await consultar(`select
            exists(select 1 from information_schema.tables where table_schema = 'public' and table_name = 'camila_tenants') as tenants_ok,
            exists(select 1 from information_schema.tables where table_schema = 'public' and table_name = 'smyl_conversation_summaries') as tabla_ok,
            coalesce((select c.relrowsecurity from pg_class c where c.oid = to_regclass('public.smyl_conversation_summaries')), false) as rls_ok,
            not exists(select 1 from information_schema.role_table_grants where table_schema = 'public' and table_name = 'smyl_conversation_summaries' and grantee in ('anon', 'authenticated')) as sin_permisos_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.MIGRATION_VERSION}') as historial_ok`))?.[0] || {};

          const completo = estado => estado.tabla_ok && estado.rls_ok && estado.sin_permisos_ok;

          const antes = await inspeccionar();
          console.log('Antes:', JSON.stringify(antes));
          if (!antes.tenants_ok) throw new Error('Falta camila_tenants en este proyecto; no se aplicó nada.');
          if (!completo(antes)) {
            await consultar(fs.readFileSync(process.env.MIGRATION_FILE, 'utf8'));
            console.log('Resumen guardado del chat aplicado.');
          } else {
            console.log('La tabla del resumen ya estaba completa.');
          }
          const despues = await inspeccionar();
          console.log('Después:', JSON.stringify(despues));
          if (!completo(despues)) throw new Error(`Verificación incompleta: ${JSON.stringify(despues)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar=${!despues.historial_ok}\n`);
          NODE

      - name: Registrar versión aplicada
        if: steps.esquema.outputs.reparar == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # La CLI nueva apunta por omisión al stack local (--remote para el proyecto enlazado) y exige --yes sin terminal; la anterior usaba --linked.
          REPAIR_FLAG=--linked
          if supabase migration repair --help 2>&1 | grep -q -- '--remote'; then REPAIR_FLAG="--remote --yes"; fi
          supabase migration repair $REPAIR_FLAG --status applied "$MIGRATION_VERSION"
