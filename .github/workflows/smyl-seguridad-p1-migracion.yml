name: SMYL Seguridad P1 - lecturas por permiso y purgas de retención (migración)

# Aplica en el proyecto de producción de SMYL las migraciones P1 de la auditoría del 2026-10-26:
#   1) 20261030100000_smyl_retention_purge_schedule.sql
#      Programa con pg_cron las purgas diarias de retención (captaciones públicas de citas y conversaciones del
#      asistente público). Si pg_cron NO está habilitado no falla: avisa y no programa nada (actívalo en
#      Database > Extensions y vuelve a ejecutar este workflow).
#   2) 20261030110000_smyl_membership_reads_to_permissions.sql
#      Las lecturas de chat (messages.read) y de MILA (clinical.read) dejan de depender de "ser miembro":
#      exigen el permiso del dominio. Recepción conserva el chat y pierde MILA; finanzas/inventario ya no leen ninguno.
# Manual a propósito (sólo workflow_dispatch). Requiere el secreto SUPABASE_ACCESS_TOKEN.
# Ambas migraciones son idempotentes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-seguridad-p1-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      PURGAS_VERSION: "20261030100000"
      PURGAS_FILE: supabase/migrations/20261030100000_smyl_retention_purge_schedule.sql
      PERMISOS_VERSION: "20261030110000"
      PERMISOS_FILE: supabase/migrations/20261030110000_smyl_membership_reads_to_permissions.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar las migraciones P1
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          // Prerrequisitos: el modelo de permisos y las tablas de la agenda/clínica ya deben existir.
          const prerequisitos = async () => (await consultar(`select
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_has_permission') as permisos_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_purge_expired_public_appointment_intakes') as purga_intakes_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_purge_expired_assistant_conversations') as purga_asistente_ok`))?.[0] || {};

          const estado = async () => (await consultar(`select
            exists(select 1 from pg_extension where extname = 'pg_cron') as cron_disponible,
            (select count(*)::int from pg_policies where schemaname = 'public'
               and policyname in ('camila_conv_select_miembros','camila_conv_update_miembros','camila_msg_select_miembros',
                                  'camila_lana_handoffs_read','camila_lana_clinical_links_read',
                                  'mila_sessions_select_miembros','mila_recordings_select_miembros','mila_transcripts_select_miembros',
                                  'mila_notes_select_miembros','mila_confirmations_select_miembros','mila_tool_calls_select_miembros')
               and (coalesce(qual, '') like '%camila_es_miembro%')) as politicas_por_membresia,
            (select count(*)::int from pg_policies where schemaname = 'public'
               and policyname in ('camila_conv_select_miembros','camila_lana_handoffs_read','mila_transcripts_select_miembros')
               and (coalesce(qual, '') like '%smyl_has_permission%')) as politicas_por_permiso,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.PURGAS_VERSION}') as historial_purgas,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.PERMISOS_VERSION}') as historial_permisos`))?.[0] || {};

          const jobsCron = async () => {
            try {
              return (await consultar(`select jobname from cron.job where jobname in ('smyl-purga-intakes-publicos','smyl-purga-asistente-publico') order by jobname`)).map(r => r.jobname);
            } catch { return []; }
          };

          const req = await prerequisitos();
          console.log('Prerrequisitos:', JSON.stringify(req));
          if (!Object.values(req).every(Boolean)) {
            throw new Error(`Faltan piezas de SMYL en este proyecto; no se aplicó nada: ${JSON.stringify(req)}`);
          }

          const antes = await estado();
          console.log('Antes:', JSON.stringify(antes), 'jobs cron:', JSON.stringify(await jobsCron()));

          // 1) Purgas programadas (siempre se aplica: es idempotente y reprograma sin duplicar)
          await consultar(fs.readFileSync(process.env.PURGAS_FILE, 'utf8'));
          const jobs = await jobsCron();
          if (antes.cron_disponible) {
            if (jobs.length !== 2) throw new Error(`Las purgas no quedaron programadas: ${JSON.stringify(jobs)}`);
            console.log('Purgas programadas:', JSON.stringify(jobs));
          } else {
            console.log('::warning::pg_cron no está habilitado: las purgas de retención NO quedaron programadas. Actívalo en Database > Extensions y vuelve a ejecutar este workflow.');
          }

          // 2) Lecturas por permiso
          if (antes.politicas_por_membresia > 0) {
            await consultar(fs.readFileSync(process.env.PERMISOS_FILE, 'utf8'));
            console.log('Lecturas por permiso aplicadas.');
          } else {
            console.log('Las lecturas ya dependían de permisos.');
          }

          const despues = await estado();
          console.log('Después:', JSON.stringify(despues));
          if (despues.politicas_por_membresia > 0) throw new Error(`Quedan políticas por membresía: ${JSON.stringify(despues)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_purgas=${!despues.historial_purgas}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_permisos=${!despues.historial_permisos}\n`);
          NODE

      - name: Registrar versiones aplicadas
        if: steps.esquema.outputs.reparar_purgas == 'true' || steps.esquema.outputs.reparar_permisos == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          if [ "${{ steps.esquema.outputs.reparar_purgas }}" = "true" ]; then
            supabase migration repair --status applied "$PURGAS_VERSION"
          fi
          if [ "${{ steps.esquema.outputs.reparar_permisos }}" = "true" ]; then
            supabase migration repair --status applied "$PERMISOS_VERSION"
          fi
