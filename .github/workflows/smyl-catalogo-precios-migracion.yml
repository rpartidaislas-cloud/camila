name: SMYL Roles - quién cambia precios del catálogo (migración)

# Aplica supabase/migrations/20261109090000_smyl_catalog_price_permission.sql en el proyecto de
# producción de SMYL: las funciones de rol «Gestionar servicios» (catalog.manage) y «Cambiar precios»
# (catalog.prices), la regla que impide cambiar un precio sin esa función y el reparto inicial
# (todo rol que hoy tiene settings.manage recibe ambas, así que nadie pierde acceso).
# Manual a propósito (sólo workflow_dispatch). Requiere el secreto de repositorio SUPABASE_ACCESS_TOKEN.
# La migración es idempotente y, antes de aplicar, se comprueba que existan las piezas de las que depende.
# Mientras no se aplique, la pantalla de Servicios y tarifas sigue funcionando con settings.manage.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-catalogo-precios-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      MIGRATION_VERSION: "20261109090000"
      MIGRATION_FILE: supabase/migrations/20261109090000_smyl_catalog_price_permission.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar los permisos del catálogo
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const prerequisitos = async () => (await consultar(`select
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_has_permission') as permiso_fn_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_current_tenant') as tenant_fn_ok,
            to_regclass('public.smyl_role_permissions') is not null as permisos_ok,
            to_regclass('public.smyl_roles') is not null as roles_ok,
            to_regclass('public.smyl_services') is not null as servicios_ok`))?.[0] || {};

          const inspeccionar = async () => (await consultar(`select
            exists(select 1 from pg_constraint c where c.conrelid = 'public.smyl_role_permissions'::regclass
              and c.conname = 'smyl_role_permissions_permission_key_check' and pg_get_constraintdef(c.oid) like '%catalog.prices%') as clave_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_services_price_guard') as guardian_ok,
            exists(select 1 from pg_trigger t where t.tgrelid = 'public.smyl_services'::regclass and t.tgname = 'smyl_services_price_guard' and not t.tgisinternal) as disparador_ok,
            exists(select 1 from pg_trigger t where t.tgrelid = 'public.smyl_roles'::regclass and t.tgname = 'smyl_roles_seed_catalog_permissions' and not t.tgisinternal) as siembra_ok,
            exists(select 1 from pg_policies p where p.schemaname = 'public' and p.tablename = 'smyl_services' and p.policyname = 'smyl_services_manage' and p.qual like '%catalog.manage%') as politica_ok,
            not exists(
              select 1 from public.smyl_role_permissions rp
              where rp.permission_key = 'settings.manage'
                and not exists(select 1 from public.smyl_role_permissions x where x.tenant_id = rp.tenant_id and x.role_id = rp.role_id and x.permission_key = 'catalog.manage')
            ) as reparto_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.MIGRATION_VERSION}') as historial_ok`))?.[0] || {};

          // «reparto_ok» solo se exige al aplicar: después, la clínica puede quitar las funciones a un rol sin que esto la revierta.
          const completo = e => e.clave_ok && e.guardian_ok && e.disparador_ok && e.siembra_ok && e.politica_ok;

          const req = await prerequisitos();
          console.log('Prerrequisitos:', JSON.stringify(req));
          if (!Object.values(req).every(Boolean)) throw new Error(`Faltan piezas de SMYL; no se aplicó nada: ${JSON.stringify(req)}`);

          const antes = await inspeccionar();
          console.log('Antes:', JSON.stringify(antes));
          if (!completo(antes)) {
            await consultar(fs.readFileSync(process.env.MIGRATION_FILE, 'utf8'));
            console.log('Permisos del catálogo aplicados.');
          } else {
            console.log('Los permisos del catálogo ya estaban aplicados.');
          }

          const despues = await inspeccionar();
          console.log('Después:', JSON.stringify(despues));
          if (!completo(despues)) throw new Error(`Verificacion incompleta: ${JSON.stringify(despues)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar=${!despues.historial_ok}\n`);
          NODE

      - name: Registrar versión aplicada
        if: steps.esquema.outputs.reparar == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # La CLI nueva apunta por omisión al stack local (--remote para el proyecto enlazado) y exige --yes sin terminal; la anterior usaba --linked.
          REPAIR_FLAG=--linked
          if supabase migration repair --help 2>&1 | grep -q -- '--remote'; then REPAIR_FLAG="--remote --yes"; fi
          supabase migration repair $REPAIR_FLAG --status applied "$MIGRATION_VERSION"
