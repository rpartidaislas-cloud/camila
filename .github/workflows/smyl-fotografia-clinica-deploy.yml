name: SMYL Fotografía clínica - migración y Edge Function

# Publicación manual y ordenada del análisis de fotografías clínicas.
# Primero aplica/verifica el esquema y sólo después despliega la función compartida `claude`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-fotografia-clinica-produccion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar credenciales
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta SUPABASE_ACCESS_TOKEN en los secretos del repositorio."
            exit 1
          fi

      - name: Aplicar y verificar la migración clínica
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const version = '20261110120000';
          const file = 'supabase/migrations/20261110120000_smyl_clinical_photo_analysis.sql';
          const query = async sql => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ query: sql }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const dependencies = await query(`select
            to_regclass('public.smyl_ai_usage_log') is not null as usage_log,
            to_regclass('public.smyl_patient_files') is not null as patient_files,
            to_regclass('public.smyl_clinical_evidence_studies') is not null as evidence,
            to_regclass('public.smyl_professionals') is not null as professionals,
            to_regprocedure('public.smyl_evidence_guard(uuid,text)') is not null as evidence_guard,
            to_regprocedure('public.smyl_current_professional_id(uuid)') is not null as professional_helper`);
          if (!dependencies[0] || !Object.values(dependencies[0]).every(Boolean)) {
            throw new Error(`Faltan prerrequisitos clínicos; no se aplicó nada: ${JSON.stringify(dependencies[0] || {})}`);
          }

          const before = await query(`select
            to_regclass('public.smyl_clinical_photo_analysis_runs') is not null as runs,
            to_regclass('public.smyl_clinical_photo_analysis_requests') is not null as requests,
            to_regclass('public.smyl_clinical_photo_study_reviews') is not null as reviews`);
          const existing = before[0] || {};
          const present = Object.values(existing).filter(Boolean).length;
          if (present > 0 && present < 3) {
            throw new Error(`Esquema parcial detectado; se requiere revisión manual: ${JSON.stringify(existing)}`);
          }
          if (present === 0) {
            await query(fs.readFileSync(file, 'utf8'));
            console.log(`${version}: migración aplicada.`);
          } else {
            console.log(`${version}: el esquema ya estaba aplicado.`);
          }

          const verified = await query(`select
            to_regclass('public.smyl_clinical_photo_analysis_runs') is not null as runs,
            to_regclass('public.smyl_clinical_photo_analysis_requests') is not null as requests,
            to_regclass('public.smyl_clinical_photo_study_reviews') is not null as reviews,
            to_regprocedure('public.smyl_evidence_set_photo_disposition(uuid,integer,text,text,text)') is not null as disposition,
            to_regprocedure('public.smyl_evidence_register_photo_file(uuid,uuid,uuid,uuid,text,text,timestamp with time zone,jsonb,jsonb)') is not null as register_photo,
            (select relrowsecurity from pg_class where oid='public.smyl_clinical_photo_analysis_runs'::regclass) as runs_rls,
            (select relrowsecurity from pg_class where oid='public.smyl_clinical_photo_study_reviews'::regclass) as reviews_rls,
            not has_table_privilege('authenticated','public.smyl_clinical_photo_analysis_requests','select') as leases_private`);
          if (!verified[0] || !Object.values(verified[0]).every(Boolean)) {
            throw new Error(`Verificación incompleta: ${JSON.stringify(verified[0] || {})}`);
          }
          console.log('Esquema verificado:', JSON.stringify(verified[0]));

          const registered = (await query(`select exists(
            select 1 from supabase_migrations.schema_migrations where version='${version}'
          ) as ok`))[0]?.ok === true;
          appendFileSync(process.env.GITHUB_OUTPUT, `repair=${registered ? 'false' : 'true'}\n`);
          NODE

      - name: Registrar la versión en el historial de migraciones
        if: steps.esquema.outputs.repair == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          REPAIR_FLAG=--linked
          if supabase migration repair --help 2>&1 | grep -q -- '--remote'; then REPAIR_FLAG="--remote --yes"; fi
          supabase migration repair $REPAIR_FLAG --status applied 20261110120000

      - name: Desplegar la función de análisis
        shell: bash
        run: supabase functions deploy claude --project-ref "$PROJECT_REF" --use-api

      - name: Verificar el despliegue
        shell: bash
        run: |
          supabase functions list --project-ref "$PROJECT_REF" | tee /tmp/functions.txt
          grep -q "claude" /tmp/functions.txt
