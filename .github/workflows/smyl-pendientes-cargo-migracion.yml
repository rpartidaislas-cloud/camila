name: SMYL Cobros - pendientes de cargo, etiqueta en la Agenda y cobro por inasistencia (migración)

# Aplica en el proyecto de producción de SMYL la migración 20261108140000_smyl_appointment_no_charge.sql:
#   - smyl_appointment_no_charge: decisión «sin cargo» (revisión, garantía, cortesía u otro) de una cita en la que el paciente ya llegó.
#   - Funciones smyl_mark_appointment_no_charge y smyl_reopen_appointment_charge (única vía de escritura, permiso finance.manage, con auditoría).
# y la migración 20261108150000_smyl_appointment_billing_status.sql:
#   - Función smyl_appointment_billing (sólo lectura, permiso finance.read): estado de cobro de cada cita para la etiqueta de la Agenda.
# y la migración 20261108160000_smyl_no_show_fee.sql:
#   - smyl_finance_settings (monto fijo del cobro por «No vino», apagado por omisión) y smyl_set_no_show_fee (finance.manage, con auditoría).
#   - «Perdonar» una inasistencia (motivo waived) y estado no_show_pending en smyl_appointment_billing.
# La lista de pendientes se calcula en Cobros; no se crea ningún cargo y no se toca ninguna cita, cargo ni pago existente.
# Manual a propósito (sólo workflow_dispatch). Requiere el secreto SUPABASE_ACCESS_TOKEN. Es idempotente.
# Requiere las migraciones de agenda, finanzas y 20261106110000 (smyl_tenants_with_permission).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-pendientes-cargo-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      PENDIENTES_VERSION: "20261108140000"
      PENDIENTES_FILE: supabase/migrations/20261108140000_smyl_appointment_no_charge.sql
      ETIQUETA_VERSION: "20261108150000"
      ETIQUETA_FILE: supabase/migrations/20261108150000_smyl_appointment_billing_status.sql
      INASISTENCIA_VERSION: "20261108160000"
      INASISTENCIA_FILE: supabase/migrations/20261108160000_smyl_no_show_fee.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar la migración de pendientes de cargo
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const prerequisitos = async () => (await consultar(`select
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_tenants_with_permission') as permisos_conjunto_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_current_tenant') as tenant_fn_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_has_permission') as permiso_fn_ok,
            to_regclass('public.smyl_appointments') is not null as citas_ok,
            to_regclass('public.smyl_finance_charges') is not null as cargos_ok,
            to_regclass('public.smyl_audit_events') is not null as auditoria_ok`))?.[0] || {};

          const estado = async () => (await consultar(`select
            to_regclass('public.smyl_appointment_no_charge') is not null as tabla_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_mark_appointment_no_charge') as marcar_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_reopen_appointment_charge') as reabrir_ok,
            coalesce((select c.relrowsecurity from pg_class c where c.oid = to_regclass('public.smyl_appointment_no_charge')), false) as rls_ok,
            coalesce(to_regclass('public.smyl_appointment_no_charge') is not null
              and not has_table_privilege('anon', 'public.smyl_appointment_no_charge', 'select')
              and not has_table_privilege('authenticated', 'public.smyl_appointment_no_charge', 'insert')
              and not has_table_privilege('authenticated', 'public.smyl_appointment_no_charge', 'delete'), false) as permisos_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_appointment_billing') as etiqueta_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_set_no_show_fee')
              and to_regclass('public.smyl_finance_settings') is not null
              and exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_appointment_billing' and p.prosrc like '%no_show_pending%') as inasistencia_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.PENDIENTES_VERSION}') as historial_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.ETIQUETA_VERSION}') as historial_etiqueta,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.INASISTENCIA_VERSION}') as historial_inasistencia`))?.[0] || {};

          const completo = e => e.tabla_ok && e.marcar_ok && e.reabrir_ok && e.rls_ok && e.permisos_ok;

          const req = await prerequisitos();
          console.log('Prerrequisitos:', JSON.stringify(req));
          if (!Object.values(req).every(Boolean)) throw new Error(`Faltan piezas de SMYL; no se aplicó nada: ${JSON.stringify(req)}`);

          const antes = await estado();
          console.log('Antes:', JSON.stringify(antes));
          if (!completo(antes)) {
            await consultar(fs.readFileSync(process.env.PENDIENTES_FILE, 'utf8'));
            console.log('Migración de pendientes de cargo aplicada.');
          } else {
            console.log('La migración de pendientes de cargo ya estaba aplicada.');
          }

          if (!antes.etiqueta_ok) {
            await consultar(fs.readFileSync(process.env.ETIQUETA_FILE, 'utf8'));
            console.log('Etiqueta de cobro de la Agenda aplicada.');
          } else {
            console.log('La etiqueta de cobro de la Agenda ya estaba aplicada.');
          }

          const despuesEtiqueta = await estado();
          if (!despuesEtiqueta.inasistencia_ok) {
            await consultar(fs.readFileSync(process.env.INASISTENCIA_FILE, 'utf8'));
            console.log('Cobro por inasistencia aplicado.');
          } else {
            console.log('El cobro por inasistencia ya estaba aplicado.');
          }

          const despues = await estado();
          console.log('Después:', JSON.stringify(despues));
          if (!completo(despues) || !despues.etiqueta_ok || !despues.inasistencia_ok) throw new Error(`Verificacion incompleta: ${JSON.stringify(despues)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar=${!despues.historial_ok}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_etiqueta=${!despues.historial_etiqueta}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_inasistencia=${!despues.historial_inasistencia}\n`);
          NODE

      - name: Registrar versión aplicada
        if: steps.esquema.outputs.reparar == 'true' || steps.esquema.outputs.reparar_etiqueta == 'true' || steps.esquema.outputs.reparar_inasistencia == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # La CLI nueva apunta por omisión al stack local (--remote para el proyecto enlazado) y exige --yes sin terminal; la anterior usaba --linked.
          REPAIR_FLAG=--linked
          if supabase migration repair --help 2>&1 | grep -q -- '--remote'; then REPAIR_FLAG="--remote --yes"; fi
          if [ "${{ steps.esquema.outputs.reparar }}" = "true" ]; then
            supabase migration repair $REPAIR_FLAG --status applied "$PENDIENTES_VERSION"
          fi
          if [ "${{ steps.esquema.outputs.reparar_etiqueta }}" = "true" ]; then
            supabase migration repair $REPAIR_FLAG --status applied "$ETIQUETA_VERSION"
          fi
          if [ "${{ steps.esquema.outputs.reparar_inasistencia }}" = "true" ]; then
            supabase migration repair $REPAIR_FLAG --status applied "$INASISTENCIA_VERSION"
          fi
