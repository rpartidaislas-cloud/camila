name: SMYL Cotizaciones - seguimiento de cotizaciones (migración)

# Aplica en el proyecto de producción de SMYL la migración 20261108120000_smyl_proposal_followups.sql:
#   - smyl_proposal_followups: registro de cada seguimiento dado a una cotización presentada (3, 7 y 15 días).
#   - Función smyl_log_proposal_followup (única vía de escritura; permiso proposal.followup, versión aprobada vigente).
# Manual a propósito (sólo workflow_dispatch). Requiere el secreto SUPABASE_ACCESS_TOKEN. Es idempotente.
# Requiere que ya esté aplicada la migración 20261106110000 (smyl_tenants_with_permission).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-cotizaciones-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      SEGUIMIENTO_VERSION: "20261108120000"
      SEGUIMIENTO_FILE: supabase/migrations/20261108120000_smyl_proposal_followups.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar la migración de seguimiento
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const prerequisitos = async () => (await consultar(`select
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_tenants_with_permission') as permisos_conjunto_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_current_tenant') as tenant_fn_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_has_permission') as permiso_fn_ok,
            to_regclass('public.smyl_proposals') is not null as cotizaciones_ok`))?.[0] || {};

          const estado = async () => (await consultar(`select
            to_regclass('public.smyl_proposal_followups') is not null as tabla_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_log_proposal_followup') as funcion_ok,
            coalesce((select c.relrowsecurity from pg_class c where c.oid = to_regclass('public.smyl_proposal_followups')), false) as rls_ok,
            coalesce(to_regclass('public.smyl_proposal_followups') is not null
              and not has_table_privilege('anon', 'public.smyl_proposal_followups', 'select')
              and not has_table_privilege('authenticated', 'public.smyl_proposal_followups', 'insert'), false) as permisos_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.SEGUIMIENTO_VERSION}') as historial_seguimiento`))?.[0] || {};

          const completo = e => e.tabla_ok && e.funcion_ok && e.rls_ok && e.permisos_ok;

          const req = await prerequisitos();
          console.log('Prerrequisitos:', JSON.stringify(req));
          if (!Object.values(req).every(Boolean)) throw new Error(`Faltan piezas de SMYL; no se aplicó nada: ${JSON.stringify(req)}`);

          const antes = await estado();
          console.log('Antes:', JSON.stringify(antes));
          if (!completo(antes)) {
            await consultar(fs.readFileSync(process.env.SEGUIMIENTO_FILE, 'utf8'));
            console.log('Migración de seguimiento aplicada.');
          } else {
            console.log('La migración de seguimiento ya estaba aplicada.');
          }

          const despues = await estado();
          console.log('Después:', JSON.stringify(despues));
          if (!completo(despues)) throw new Error(`Verificacion incompleta: ${JSON.stringify(despues)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_seguimiento=${!despues.historial_seguimiento}\n`);
          NODE

      - name: Registrar versión aplicada
        if: steps.esquema.outputs.reparar_seguimiento == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # La CLI nueva apunta por omisión al stack local (--remote para el proyecto enlazado) y exige --yes sin terminal; la anterior usaba --linked.
          REPAIR_FLAG=--linked
          if supabase migration repair --help 2>&1 | grep -q -- '--remote'; then REPAIR_FLAG="--remote --yes"; fi
          supabase migration repair $REPAIR_FLAG --status applied "$SEGUIMIENTO_VERSION"
