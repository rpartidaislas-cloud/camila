name: SMYL Radiografía IA - Etapas 0 y 1 (migración)

# Aplica manualmente las cuatro migraciones del flujo radiográfico asistido (banderas apagadas,
# fuentes v2, ejecuciones IA, informes). Es aditivo e idempotente: no transforma datos, no toca el
# flujo v1 y deja todas las banderas en false. Requiere SUPABASE_ACCESS_TOKEN con acceso al
# proyecto de producción. Se dispara a mano; nunca se ejecuta en push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-radiografia-ia-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta SUPABASE_ACCESS_TOKEN en los secretos del repositorio."
            exit 1
          fi

      - name: Pruebas del contrato antes de tocar producción
        shell: bash
        run: node --test tests/radiograph-contracts-v2.test.mjs tests/radiograph-migrations-stage1.test.mjs

      - name: Aplicar y verificar las migraciones radiográficas
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          // Orden obligatorio; cada una se aplica sólo si su objeto centinela no existe todavía.
          const MIGRATIONS = [
            { version: '20261028100000', file: 'supabase/migrations/20261028100000_smyl_radiograph_ai_flags.sql', sentinel: 'smyl_radiograph_engines' },
            { version: '20261028110000', file: 'supabase/migrations/20261028110000_smyl_radiograph_sources_v2.sql', sentinel: 'smyl_radiograph_access_events' },
            { version: '20261028120000', file: 'supabase/migrations/20261028120000_smyl_radiograph_ai_runs.sql', sentinel: 'smyl_radiograph_decision_versions' },
            { version: '20261028130000', file: 'supabase/migrations/20261028130000_smyl_radiograph_reports.sql', sentinel: 'smyl_radiograph_report_addenda' },
          ];
          const TABLES = ['camila_tenants','camila_usuarios','camila_pacientes','smyl_professionals','smyl_dental_records','smyl_audit_events'];
          const FUNCTIONS = ['smyl_current_tenant','smyl_has_permission','smyl_can_access_patient','smyl_current_professional_id','smyl_audit_row'];

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };
          const lista = values => values.map(value => `'${value}'`).join(',');

          const tables = (await consultar(`select table_name as name from information_schema.tables where table_schema='public' and table_name in (${lista(TABLES)})`)).map(r => r.name);
          const functions = (await consultar(`select distinct proname as name from pg_proc where pronamespace='public'::regnamespace and proname in (${lista(FUNCTIONS)})`)).map(r => r.name);
          const missing = { tables: TABLES.filter(t => !tables.includes(t)), functions: FUNCTIONS.filter(f => !functions.includes(f)) };
          console.log('Prerrequisitos faltantes:', JSON.stringify(missing));
          if (missing.tables.length || missing.functions.length) throw new Error(`Faltan dependencias previas; no se aplicó nada: ${JSON.stringify(missing)}`);

          const existe = async name => (await consultar(`select to_regclass('public.${name}') is not null as ok`))[0].ok === true;
          const repair = [];
          for (const m of MIGRATIONS) {
            if (await existe(m.sentinel)) { console.log(`${m.version}: ya estaba aplicada.`); }
            else { await consultar(fs.readFileSync(m.file, 'utf8')); console.log(`${m.version}: aplicada.`); }
            const registrada = (await consultar(`select exists(select 1 from supabase_migrations.schema_migrations where version='${m.version}') as ok`))[0].ok;
            if (!registrada) repair.push(m.version);
          }

          // Verificación: banderas apagadas, sin motores, ACL cerrada y cierre del motor sólo de servidor.
          const estado = (await consultar(`select
            (select count(*)=5 and bool_and(not enabled) from public.smyl_radiograph_feature_flags) as flags_off,
            (select count(*)=0 from public.smyl_radiograph_engines) as no_engines,
            not has_table_privilege('authenticated','public.smyl_radiograph_feature_flags','select') as flags_hidden,
            not has_table_privilege('authenticated','public.smyl_radiograph_engines','select') as engines_hidden,
            not has_function_privilege('authenticated','public.smyl_radiograph_complete_ai_run(uuid,text,jsonb,text,jsonb)','execute') as complete_server_only,
            not has_function_privilege('authenticated','public.smyl_radiograph_flag_enabled(text,uuid)','execute') as flag_fn_hidden,
            has_function_privilege('authenticated','public.smyl_radiograph_ai_capabilities()','execute') as capabilities_ok,
            (select count(*)=12 from pg_policies where schemaname='public' and policyname like 'smyl_radiograph_%' and policyname not in ('smyl_radiograph_reviews_scoped_read','smyl_radiograph_review_versions_scoped_read')) as policies_ok,
            (select bool_and(relrowsecurity) from pg_class where relnamespace='public'::regnamespace and relname like 'smyl_radiograph_%' and relkind='r') as rls_ok`))[0];
          console.log('Estado final:', JSON.stringify(estado));
          if (!Object.values(estado).every(v => v === true)) throw new Error(`Verificación incompleta: ${JSON.stringify(estado)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `repair=${repair.join(' ')}\n`);
          NODE

      - name: Registrar versiones aplicadas
        if: steps.esquema.outputs.repair != ''
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          for v in ${{ steps.esquema.outputs.repair }}; do supabase migration repair --status applied "$v"; done
