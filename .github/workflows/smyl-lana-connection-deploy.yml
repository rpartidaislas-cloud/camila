name: SMYL lana-connection (despliegue)

# Despliega la Edge Function lana-connection en el proyecto SMYL (verifica que la API key
# pertenezca a un tenant de producto SMYL antes de vincular). Se dispara a mano; nunca en push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-lana-connection-deploy
  cancel-in-progress: false

jobs:
  despliegue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Falta SUPABASE_ACCESS_TOKEN."; exit 1; fi
      - name: Desplegar
        shell: bash
        run: supabase functions deploy lana-connection --project-ref "$PROJECT_REF" --use-api --yes
      - name: Verificar
        shell: bash
        run: |
          supabase functions list --project-ref "$PROJECT_REF" | tee /tmp/fn.txt
          grep -q "lana-connection" /tmp/fn.txt
