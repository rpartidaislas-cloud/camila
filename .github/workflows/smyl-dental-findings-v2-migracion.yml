name: SMYL Hallazgos dentales v2 - migracion

# Publica exclusivamente el contrato append-only del odontograma. La interfaz
# se distribuye en un segundo paso, una vez que esta verificacion queda en verde.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/camila-claude-clinical-analysis-sywxjv
    paths:
      - supabase/migrations/20261113120000_smyl_dental_findings_v2.sql
      - .github/workflows/smyl-dental-findings-v2-migracion.yml

permissions:
  contents: read

concurrency:
  group: smyl-dental-findings-v2-produccion
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      MIGRATION_VERSION: "20261113120000"
      MIGRATION_FILE: supabase/migrations/20261113120000_smyl_dental_findings_v2.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar credenciales
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta SUPABASE_ACCESS_TOKEN en los secretos del repositorio."
            exit 1
          fi

      - name: Aplicar y verificar el contrato clinico
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const query = async sql => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ query: sql }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const dependencies = (await query(`select
            to_regclass('public.smyl_dental_records') is not null as records,
            to_regclass('public.smyl_dental_versions') is not null as versions,
            to_regclass('public.smyl_clinical_evidence_findings') is not null as evidence_findings,
            to_regprocedure('public.smyl_current_tenant()') is not null as tenant_helper,
            to_regprocedure('public.smyl_has_permission(uuid,text)') is not null as permission_helper,
            to_regprocedure('public.smyl_can_access_patient(uuid,uuid,text)') is not null as patient_guard,
            to_regprocedure('public.smyl_save_dental_record(uuid,integer,jsonb)') is not null as save_rpc`))[0] || {};
          if (!Object.values(dependencies).every(Boolean)) {
            throw new Error(`Faltan prerrequisitos clinicos; no se aplico nada: ${JSON.stringify(dependencies)}`);
          }

          const registered = (await query(`select exists(
            select 1 from supabase_migrations.schema_migrations
            where version='${process.env.MIGRATION_VERSION}'
          ) as ok`))[0]?.ok === true;

          if (!registered) {
            await query(fs.readFileSync(process.env.MIGRATION_FILE, 'utf8'));
            console.log(`${process.env.MIGRATION_VERSION}: migracion aplicada.`);
          } else {
            console.log(`${process.env.MIGRATION_VERSION}: ya estaba registrada; se verificara el contrato.`);
          }

          const verified = (await query(`select
            p.prosecdef as security_definer,
            has_function_privilege('authenticated', p.oid, 'execute') as authenticated_execute,
            not has_function_privilege('anon', p.oid, 'execute') as anon_blocked,
            position('Dental findings are append only' in pg_get_functiondef(p.oid)) > 0 as append_only,
            position('Foreign dental finding source' in pg_get_functiondef(p.oid)) > 0 as source_guard,
            position('prior_finding->''sourceRef'' is distinct from finding_event->''sourceRef''' in pg_get_functiondef(p.oid)) > 0 as source_inherited
          from pg_proc p
          where p.oid='public.smyl_save_dental_record(uuid,integer,jsonb)'::regprocedure`))[0] || {};
          if (!Object.values(verified).every(Boolean)) {
            throw new Error(`Contrato clinico incompleto: ${JSON.stringify(verified)}`);
          }
          console.log('Contrato verificado:', JSON.stringify(verified));
          appendFileSync(process.env.GITHUB_OUTPUT, `repair=${registered ? 'false' : 'true'}\n`);
          NODE

      - name: Registrar la version en el historial
        if: steps.esquema.outputs.repair == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          REPAIR_FLAG=--linked
          if supabase migration repair --help 2>&1 | grep -q -- '--remote'; then REPAIR_FLAG="--remote --yes"; fi
          supabase migration repair $REPAIR_FLAG --status applied "$MIGRATION_VERSION"

      - name: Confirmar registro final
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              query: `select exists(select 1 from supabase_migrations.schema_migrations where version='${process.env.MIGRATION_VERSION}') as ok`,
            }),
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Verificacion rechazada (${response.status}): ${body}`);
          const ok = JSON.parse(body)[0]?.ok === true;
          if (!ok) throw new Error('La migracion no quedo registrada.');
          console.log('Migracion aplicada, verificada y registrada.');
          NODE
