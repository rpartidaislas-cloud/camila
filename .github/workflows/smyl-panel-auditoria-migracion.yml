name: SMYL Panel - alcances de rol para clínicas nuevas y RLS por conjuntos (migración)

# Aplica en el proyecto de producción de SMYL las migraciones de la auditoría del panel admin (2026-11-06):
#   1) 20261106100000_smyl_role_scopes_seed_new_clinics.sql
#      Siembra los alcances de datos por rol (smyl_role_scopes) de los roles del sistema que no los tengan y deja un
#      trigger para los roles nuevos. OJO: en clínicas creadas después de 2026-10-15 recepción/administrador/finanzas
#      pasan de alcance «own» (sin ficha de profesional veían 0 pacientes) a «clinic», que es el diseño original.
#   2) 20261106110000_smyl_rls_read_policies_set_based.sql
#      Reescribe las políticas de lectura de pacientes y citas calculando los conjuntos una sola vez (mismo acceso,
#      10-50 veces menos costo con miles de pacientes).
#   3) 20261106120000_smyl_audit_events_compaction.sql
#      Compacta (no borra) los eventos de auditoría de más de 24 meses: vacía before_data/after_data y conserva quién,
#      cuándo, tabla, registro y acción. Se programa a diario con pg_cron si la extensión está habilitada.
#   4) 20261106130000_smyl_appointments_no_overlap.sql
#      Restricción de exclusión: un profesional (o un sillón) no puede tener dos citas activas empalmadas, aunque dos
#      reservas simultáneas pasen la validación. Si ya hay empalmes en los datos NO falla: avisa y no la crea.
#   5) 20261106140000_smyl_client_errors.sql
#      Registro mínimo de errores de JavaScript del panel (sin datos de pacientes; tope 30/hora por usuario; solo lo lee
#      el equipo de SMYL) y purga a 90 días. Reemplaza el alert() con pila técnica por un aviso discreto.
# Manual a propósito (sólo workflow_dispatch). Requiere el secreto SUPABASE_ACCESS_TOKEN. Ambas son idempotentes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-panel-auditoria-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      ALCANCES_VERSION: "20261106100000"
      ALCANCES_FILE: supabase/migrations/20261106100000_smyl_role_scopes_seed_new_clinics.sql
      RLS_VERSION: "20261106110000"
      RLS_FILE: supabase/migrations/20261106110000_smyl_rls_read_policies_set_based.sql
      ERRORES_VERSION: "20261106140000"
      ERRORES_FILE: supabase/migrations/20261106140000_smyl_client_errors.sql
      EMPALMES_VERSION: "20261106130000"
      EMPALMES_FILE: supabase/migrations/20261106130000_smyl_appointments_no_overlap.sql
      AUDITORIA_VERSION: "20261106120000"
      AUDITORIA_FILE: supabase/migrations/20261106120000_smyl_audit_events_compaction.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar las migraciones
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const prerequisitos = async () => (await consultar(`select
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_effective_scope') as alcance_fn_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_can_access_schedule_row') as agenda_fn_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_current_professional_id') as profesional_fn_ok,
            to_regclass('public.smyl_role_scopes') is not null as scopes_tabla_ok,
            to_regclass('public.smyl_patient_care_team') is not null as equipo_tabla_ok`))?.[0] || {};

          const estado = async () => (await consultar(`select
            exists(select 1 from pg_trigger t where t.tgrelid = 'public.smyl_roles'::regclass and t.tgname = 'smyl_seed_role_scopes_after_role' and not t.tgisinternal) as trigger_ok,
            (select count(*)::int from public.smyl_roles r where r.system_role
               and exists(select 1 from (values ('patients'),('schedule'),('clinical'),('messages'),('finance')) d(domain)
                          where not exists(select 1 from public.smyl_role_scopes rs where rs.tenant_id = r.tenant_id and rs.role_id = r.id and rs.domain = d.domain))) as roles_sin_alcance,
            exists(select 1 from pg_policies where schemaname = 'public' and tablename = 'camila_pacientes' and policyname = 'pacientes_read' and qual like '%smyl_tenants_with_permission%') as pacientes_ok,
            exists(select 1 from pg_policies where schemaname = 'public' and tablename = 'smyl_appointments' and policyname = 'smyl_appointments_read' and qual like '%smyl_tenants_with_permission%') as citas_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_compact_audit_events') as compactacion_ok,
            exists(select 1 from pg_extension where extname = 'pg_cron') as cron_disponible,
            exists(select 1 from pg_constraint where conname = 'smyl_appointments_no_professional_overlap') as empalme_prof_ok,
            exists(select 1 from pg_constraint where conname = 'smyl_appointments_no_room_overlap') as empalme_sillon_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_report_client_error') as errores_fn_ok,
            to_regclass('public.smyl_client_errors') is not null as errores_tabla_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.ERRORES_VERSION}') as historial_errores,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.EMPALMES_VERSION}') as historial_empalmes,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.AUDITORIA_VERSION}') as historial_auditoria,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.ALCANCES_VERSION}') as historial_alcances,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.RLS_VERSION}') as historial_rls`))?.[0] || {};

          const req = await prerequisitos();
          console.log('Prerrequisitos:', JSON.stringify(req));
          if (!Object.values(req).every(Boolean)) throw new Error(`Faltan piezas de SMYL; no se aplicó nada: ${JSON.stringify(req)}`);

          const antes = await estado();
          console.log('Antes:', JSON.stringify(antes));

          if (!antes.trigger_ok || antes.roles_sin_alcance > 0) {
            await consultar(fs.readFileSync(process.env.ALCANCES_FILE, 'utf8'));
            console.log('Alcances de rol sembrados.');
          } else {
            console.log('Los alcances de rol ya estaban sembrados.');
          }
          if (!antes.pacientes_ok || !antes.citas_ok) {
            await consultar(fs.readFileSync(process.env.RLS_FILE, 'utf8'));
            console.log('Políticas de lectura por conjuntos aplicadas.');
          } else {
            console.log('Las políticas por conjuntos ya estaban aplicadas.');
          }

          const jobCompactacion = async () => {
            try { return (await consultar(`select jobname from cron.job where jobname = 'smyl-compactar-auditoria'`)).length; } catch { return 0; }
          };
          // Se reaplica siempre que falte la función o, con pg_cron habilitado, el job (es idempotente y no duplica).
          if (!antes.compactacion_ok || (antes.cron_disponible && !(await jobCompactacion()))) {
            await consultar(fs.readFileSync(process.env.AUDITORIA_FILE, 'utf8'));
            console.log('Compactación de auditoría aplicada.');
          } else {
            console.log('La compactación de auditoría ya estaba aplicada.');
          }
          if (!antes.cron_disponible) console.log('::warning::pg_cron no está habilitado: la compactación de auditoría NO quedó programada. Actívalo en Database > Extensions y vuelve a ejecutar este workflow.');

          if (!antes.errores_fn_ok || !antes.errores_tabla_ok) {
            await consultar(fs.readFileSync(process.env.ERRORES_FILE, 'utf8'));
            console.log('Registro de errores del cliente aplicado.');
          } else {
            console.log('El registro de errores del cliente ya estaba aplicado.');
          }

          // Idempotente: se reaplica mientras falte alguna restricción (si hay empalmes en los datos, sólo avisa).
          if (!antes.empalme_prof_ok || !antes.empalme_sillon_ok) {
            await consultar(fs.readFileSync(process.env.EMPALMES_FILE, 'utf8'));
            console.log('Restricción anti-empalme aplicada.');
          } else {
            console.log('La restricción anti-empalme ya estaba aplicada.');
          }

          const despues = await estado();
          if (!despues.empalme_prof_ok || !despues.empalme_sillon_ok) {
            console.log('::warning::La restricción anti-empalme no quedó completa: hay citas activas empalmadas en los datos. Revísalas (ver el aviso de la migración) y vuelve a ejecutar este workflow.');
          }
          console.log('Después:', JSON.stringify(despues));
          if (!despues.trigger_ok || despues.roles_sin_alcance > 0 || !despues.pacientes_ok || !despues.citas_ok || !despues.compactacion_ok || !despues.errores_fn_ok || !despues.errores_tabla_ok) {
            throw new Error(`Verificacion incompleta: ${JSON.stringify(despues)}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_alcances=${!despues.historial_alcances}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_rls=${!despues.historial_rls}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_auditoria=${!despues.historial_auditoria}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_errores=${!despues.historial_errores}\n`);
          // La versión sólo se registra si la restricción quedó completa; si no, se reaplicará en la próxima ejecución.
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_empalmes=${!despues.historial_empalmes && despues.empalme_prof_ok && despues.empalme_sillon_ok}\n`);
          NODE

      - name: Registrar versiones aplicadas
        if: steps.esquema.outputs.reparar_alcances == 'true' || steps.esquema.outputs.reparar_rls == 'true' || steps.esquema.outputs.reparar_auditoria == 'true' || steps.esquema.outputs.reparar_empalmes == 'true' || steps.esquema.outputs.reparar_errores == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          if [ "${{ steps.esquema.outputs.reparar_alcances }}" = "true" ]; then
            supabase migration repair --status applied "$ALCANCES_VERSION"
          fi
          if [ "${{ steps.esquema.outputs.reparar_rls }}" = "true" ]; then
            supabase migration repair --status applied "$RLS_VERSION"
          fi
          if [ "${{ steps.esquema.outputs.reparar_auditoria }}" = "true" ]; then
            supabase migration repair --status applied "$AUDITORIA_VERSION"
          fi
          if [ "${{ steps.esquema.outputs.reparar_empalmes }}" = "true" ]; then
            supabase migration repair --status applied "$EMPALMES_VERSION"
          fi
          if [ "${{ steps.esquema.outputs.reparar_errores }}" = "true" ]; then
            supabase migration repair --status applied "$ERRORES_VERSION"
          fi
