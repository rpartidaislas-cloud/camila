name: SMYL Panel - alcances de rol para clínicas nuevas y RLS por conjuntos (migración)

# Aplica en el proyecto de producción de SMYL las migraciones de la auditoría del panel admin (2026-11-06):
#   1) 20261106100000_smyl_role_scopes_seed_new_clinics.sql
#      Siembra los alcances de datos por rol (smyl_role_scopes) de los roles del sistema que no los tengan y deja un
#      trigger para los roles nuevos. OJO: en clínicas creadas después de 2026-10-15 recepción/administrador/finanzas
#      pasan de alcance «own» (sin ficha de profesional veían 0 pacientes) a «clinic», que es el diseño original.
#   2) 20261106110000_smyl_rls_read_policies_set_based.sql
#      Reescribe las políticas de lectura de pacientes y citas calculando los conjuntos una sola vez (mismo acceso,
#      10-50 veces menos costo con miles de pacientes).
# Manual a propósito (sólo workflow_dispatch). Requiere el secreto SUPABASE_ACCESS_TOKEN. Ambas son idempotentes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-panel-auditoria-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      ALCANCES_VERSION: "20261106100000"
      ALCANCES_FILE: supabase/migrations/20261106100000_smyl_role_scopes_seed_new_clinics.sql
      RLS_VERSION: "20261106110000"
      RLS_FILE: supabase/migrations/20261106110000_smyl_rls_read_policies_set_based.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar las migraciones
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const prerequisitos = async () => (await consultar(`select
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_effective_scope') as alcance_fn_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_can_access_schedule_row') as agenda_fn_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_current_professional_id') as profesional_fn_ok,
            to_regclass('public.smyl_role_scopes') is not null as scopes_tabla_ok,
            to_regclass('public.smyl_patient_care_team') is not null as equipo_tabla_ok`))?.[0] || {};

          const estado = async () => (await consultar(`select
            exists(select 1 from pg_trigger t where t.tgrelid = 'public.smyl_roles'::regclass and t.tgname = 'smyl_seed_role_scopes_after_role' and not t.tgisinternal) as trigger_ok,
            (select count(*)::int from public.smyl_roles r where r.system_role
               and exists(select 1 from (values ('patients'),('schedule'),('clinical'),('messages'),('finance')) d(domain)
                          where not exists(select 1 from public.smyl_role_scopes rs where rs.tenant_id = r.tenant_id and rs.role_id = r.id and rs.domain = d.domain))) as roles_sin_alcance,
            exists(select 1 from pg_policies where schemaname = 'public' and tablename = 'camila_pacientes' and policyname = 'pacientes_read' and qual like '%smyl_tenants_with_permission%') as pacientes_ok,
            exists(select 1 from pg_policies where schemaname = 'public' and tablename = 'smyl_appointments' and policyname = 'smyl_appointments_read' and qual like '%smyl_tenants_with_permission%') as citas_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.ALCANCES_VERSION}') as historial_alcances,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.RLS_VERSION}') as historial_rls`))?.[0] || {};

          const req = await prerequisitos();
          console.log('Prerrequisitos:', JSON.stringify(req));
          if (!Object.values(req).every(Boolean)) throw new Error(`Faltan piezas de SMYL; no se aplicó nada: ${JSON.stringify(req)}`);

          const antes = await estado();
          console.log('Antes:', JSON.stringify(antes));

          if (!antes.trigger_ok || antes.roles_sin_alcance > 0) {
            await consultar(fs.readFileSync(process.env.ALCANCES_FILE, 'utf8'));
            console.log('Alcances de rol sembrados.');
          } else {
            console.log('Los alcances de rol ya estaban sembrados.');
          }
          if (!antes.pacientes_ok || !antes.citas_ok) {
            await consultar(fs.readFileSync(process.env.RLS_FILE, 'utf8'));
            console.log('Políticas de lectura por conjuntos aplicadas.');
          } else {
            console.log('Las políticas por conjuntos ya estaban aplicadas.');
          }

          const despues = await estado();
          console.log('Después:', JSON.stringify(despues));
          if (!despues.trigger_ok || despues.roles_sin_alcance > 0 || !despues.pacientes_ok || !despues.citas_ok) {
            throw new Error(`Verificacion incompleta: ${JSON.stringify(despues)}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_alcances=${!despues.historial_alcances}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_rls=${!despues.historial_rls}\n`);
          NODE

      - name: Registrar versiones aplicadas
        if: steps.esquema.outputs.reparar_alcances == 'true' || steps.esquema.outputs.reparar_rls == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          if [ "${{ steps.esquema.outputs.reparar_alcances }}" = "true" ]; then
            supabase migration repair --status applied "$ALCANCES_VERSION"
          fi
          if [ "${{ steps.esquema.outputs.reparar_rls }}" = "true" ]; then
            supabase migration repair --status applied "$RLS_VERSION"
          fi
