name: SMYL Agenda - tiempo extra por cita (migración)

# Aplica supabase/migrations/20261022120000_smyl_appointment_extra_time.sql en el proyecto de
# producción de SMYL: columnas extra_minutes/extra_reason, el validador de horarios con tiempo
# extra, smyl_create_appointment, smyl_reschedule_appointment y smyl_set_appointment_extra.
# Manual a propósito (sólo workflow_dispatch). Requiere el secreto SUPABASE_ACCESS_TOKEN.
# La migración es idempotente; antes de aplicar se comprueba que la agenda ya esté instalada.
# Mientras no se aplique, la Agenda funciona igual; sólo fallan "Tiempo extra" y +15/+30/+60.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-agenda-tiempo-extra-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      MIGRATION_VERSION: "20261022120000"
      MIGRATION_FILE: supabase/migrations/20261022120000_smyl_appointment_extra_time.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar el tiempo extra de la agenda
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const prerequisitos = async () => (await consultar(`select
            exists(select 1 from information_schema.tables where table_schema = 'public' and table_name = 'smyl_appointments') as citas_ok,
            exists(select 1 from information_schema.tables where table_schema = 'public' and table_name = 'smyl_appointment_events') as eventos_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_validate_service_appointment_slot') as validador_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_create_appointment') as crear_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_reschedule_appointment') as reprogramar_ok`))?.[0] || {};

          const inspeccionar = async () => (await consultar(`select
            exists(select 1 from information_schema.columns where table_schema = 'public' and table_name = 'smyl_appointments' and column_name = 'extra_minutes') as columna_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_validate_service_appointment_slot' and p.pronargs = 10) as validador_ok,
            coalesce((select has_function_privilege('authenticated', p.oid, 'execute') and not has_function_privilege('anon', p.oid, 'execute')
              from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_set_appointment_extra' limit 1), false) as permisos_ok,
            coalesce((select not has_function_privilege('authenticated', p.oid, 'execute')
              from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_validate_service_appointment_slot' and p.pronargs = 10 limit 1), false) as validador_privado_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.MIGRATION_VERSION}') as historial_ok`))?.[0] || {};

          const completo = e => e.columna_ok && e.validador_ok && e.permisos_ok && e.validador_privado_ok;

          const req = await prerequisitos();
          console.log('Prerrequisitos:', JSON.stringify(req));
          if (!Object.values(req).every(Boolean)) {
            throw new Error(`La Agenda de SMYL no está instalada completa en este proyecto; no se aplicó nada: ${JSON.stringify(req)}`);
          }
          const antes = await inspeccionar();
          console.log('Antes:', JSON.stringify(antes));
          if (!completo(antes)) {
            await consultar(fs.readFileSync(process.env.MIGRATION_FILE, 'utf8'));
            console.log('Tiempo extra aplicado.');
          } else {
            console.log('El tiempo extra ya estaba completo.');
          }
          const despues = await inspeccionar();
          console.log('Después:', JSON.stringify(despues));
          if (!completo(despues)) throw new Error(`Verificacion incompleta: ${JSON.stringify(despues)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar=${!despues.historial_ok}\n`);
          NODE

      - name: Registrar versión aplicada
        if: steps.esquema.outputs.reparar == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase migration repair --status applied "$MIGRATION_VERSION"
