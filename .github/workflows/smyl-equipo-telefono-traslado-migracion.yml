name: SMYL Equipo - teléfono interno y traslado entre sedes (migración)

# Aplica en el proyecto de producción de SMYL dos migraciones:
#   20261118120000_smyl_professional_internal_phone.sql
#     - smyl_professionals.phone: teléfono interno del doctor para el equipo (no se publica; sólo dígitos y signos de teléfono).
#   20261118130000_smyl_professional_travel_margin.sql
#     - smyl_schedule_rules (margen de traslado entre sedes, 45 min por omisión) y smyl_set_professional_travel_margin (clinic.manage, auditada).
#     - Trigger que impide guardar horarios de un doctor en dos sedes a menos del margen, y smyl_professional_travel_conflicts (sólo lectura).
# No modifica ni borra ningún horario, doctor ni cita existente: la regla sólo revisa lo que se guarde desde ahora.
# El registro informa cuántos choques entre sedes ya existen (sólo el número) para que el administrador los corrija.
# Manual a propósito (sólo workflow_dispatch). Requiere el secreto SUPABASE_ACCESS_TOKEN. Es idempotente.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-equipo-telefono-traslado-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      TELEFONO_VERSION: "20261118120000"
      TELEFONO_FILE: supabase/migrations/20261118120000_smyl_professional_internal_phone.sql
      TRASLADO_VERSION: "20261118130000"
      TRASLADO_FILE: supabase/migrations/20261118130000_smyl_professional_travel_margin.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aplicar las migraciones
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const prerequisitos = async () => (await consultar(`select
            to_regclass('public.smyl_professionals') is not null as doctores_ok,
            to_regclass('public.smyl_professional_hours') is not null as horarios_ok,
            to_regclass('public.smyl_audit_events') is not null as auditoria_ok,
            to_regclass('public.camila_tenants') is not null as clinicas_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_current_tenant') as tenant_fn_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_has_permission') as permiso_fn_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'camila_es_miembro') as miembro_fn_ok`))?.[0] || {};

          const estado = async () => (await consultar(`select
            exists(select 1 from information_schema.columns where table_schema = 'public' and table_name = 'smyl_professionals' and column_name = 'phone')
              and exists(select 1 from pg_constraint where conrelid = 'public.smyl_professionals'::regclass and conname = 'smyl_professionals_phone_check') as telefono_ok,
            to_regclass('public.smyl_schedule_rules') is not null as reglas_ok,
            coalesce((select c.relrowsecurity from pg_class c where c.oid = to_regclass('public.smyl_schedule_rules')), false) as rls_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_set_professional_travel_margin') as ajuste_ok,
            exists(select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname = 'smyl_professional_travel_conflicts') as choques_ok,
            exists(select 1 from pg_trigger t where t.tgrelid = to_regclass('public.smyl_professional_hours') and t.tgname = 'smyl_professional_hours_travel_margin' and not t.tgisinternal) as trigger_ok,
            coalesce(to_regclass('public.smyl_schedule_rules') is not null
              and not has_table_privilege('anon', 'public.smyl_schedule_rules', 'select')
              and not has_table_privilege('authenticated', 'public.smyl_schedule_rules', 'insert')
              and not has_table_privilege('authenticated', 'public.smyl_schedule_rules', 'update'), false) as permisos_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.TELEFONO_VERSION}') as historial_telefono,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.TRASLADO_VERSION}') as historial_traslado`))?.[0] || {};

          const traslado = e => e.reglas_ok && e.rls_ok && e.ajuste_ok && e.choques_ok && e.trigger_ok && e.permisos_ok;

          const req = await prerequisitos();
          console.log('Prerrequisitos:', JSON.stringify(req));
          if (!Object.values(req).every(Boolean)) throw new Error(`Faltan piezas de SMYL; no se aplicó nada: ${JSON.stringify(req)}`);

          const antes = await estado();
          console.log('Antes:', JSON.stringify(antes));
          if (!antes.telefono_ok) {
            await consultar(fs.readFileSync(process.env.TELEFONO_FILE, 'utf8'));
            console.log('Teléfono interno aplicado.');
          } else {
            console.log('El teléfono interno ya estaba aplicado.');
          }

          // Sólo el número de choques que ya existen con el margen de 45 min (no se lista ningún doctor ni clínica).
          const choques = (await consultar(`select count(*)::int as total from public.smyl_professional_hours a
            join public.smyl_professional_hours b on b.tenant_id = a.tenant_id and b.professional_id = a.professional_id
              and b.weekday = a.weekday and b.active and b.branch_id <> a.branch_id and a.id < b.id
            where a.active
              and (extract(epoch from a.starts_at) / 60)::int < (extract(epoch from b.ends_at) / 60)::int + 45
              and (extract(epoch from a.ends_at) / 60)::int + 45 > (extract(epoch from b.starts_at) / 60)::int`))?.[0]?.total;
          console.log(`Choques de traslado que ya existen (con 45 min): ${choques}. No se modifican; el administrador los verá en Equipo.`);

          if (!traslado(antes)) {
            await consultar(fs.readFileSync(process.env.TRASLADO_FILE, 'utf8'));
            console.log('Regla de traslado aplicada.');
          } else {
            console.log('La regla de traslado ya estaba aplicada.');
          }

          const despues = await estado();
          console.log('Después:', JSON.stringify(despues));
          if (!despues.telefono_ok || !traslado(despues)) throw new Error(`Verificacion incompleta: ${JSON.stringify(despues)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_telefono=${!despues.historial_telefono}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar_traslado=${!despues.historial_traslado}\n`);
          NODE

      - name: Registrar versión aplicada
        if: steps.esquema.outputs.reparar_telefono == 'true' || steps.esquema.outputs.reparar_traslado == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # La CLI nueva apunta por omisión al stack local (--remote para el proyecto enlazado) y exige --yes sin terminal; la anterior usaba --linked.
          REPAIR_FLAG=--linked
          if supabase migration repair --help 2>&1 | grep -q -- '--remote'; then REPAIR_FLAG="--remote --yes"; fi
          if [ "${{ steps.esquema.outputs.reparar_telefono }}" = "true" ]; then
            supabase migration repair $REPAIR_FLAG --status applied "$TELEFONO_VERSION"
          fi
          if [ "${{ steps.esquema.outputs.reparar_traslado }}" = "true" ]; then
            supabase migration repair $REPAIR_FLAG --status applied "$TRASLADO_VERSION"
          fi
