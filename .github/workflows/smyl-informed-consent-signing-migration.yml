name: SMYL - Firma de consentimiento del paciente (migración)

# Aplica únicamente la migración de firma presencial del consentimiento informado.
# Es manual a propósito: el frontend se publica sólo después de verificar esta ejecución.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-informed-consent-signing-production
  cancel-in-progress: false

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      MIGRATION_VERSION: "20261129130000"
      MIGRATION_FILE: supabase/migrations/20261129130000_smyl_informed_consent_signing.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          fi

      - name: Apply and verify informed-consent signing
        id: schema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const query = async sql => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ query: sql }),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`Database query rejected (${response.status}): ${text}`);
            return JSON.parse(text);
          };

          const prerequisites = async () => (await query(`select
            to_regclass('public.smyl_informed_consents') is not null as consents_ok,
            to_regclass('public.smyl_audit_events') is not null as audit_ok,
            to_regprocedure('public.smyl_recent_auth_method(integer)') is not null as reauth_ok`))?.[0] || {};

          const inspect = async () => (await query(`select
            to_regclass('public.smyl_informed_consent_signature_links') is not null as links_ok,
            to_regprocedure('public.smyl_create_informed_consent_signature_link(uuid,text,text,text,text,text)') is not null as create_ok,
            to_regprocedure('public.smyl_informed_consent_signature_link_info(text)') is not null as info_ok,
            to_regprocedure('public.smyl_submit_informed_consent_signature(text,text,boolean)') is not null as submit_ok,
            to_regprocedure('public.smyl_informed_consent_signature_link_status(text)') is not null as status_ok,
            to_regprocedure('public.smyl_cancel_informed_consent_signature_link(text)') is not null as cancel_ok,
            to_regprocedure('public.smyl_finalize_informed_consent_signature(uuid,text,text,text,text,text,text,text,uuid,boolean,boolean)') is not null as finalize_ok,
            coalesce(has_function_privilege('anon', to_regprocedure('public.smyl_informed_consent_signature_link_info(text)'), 'execute'), false) as anon_info_ok,
            coalesce(has_function_privilege('anon', to_regprocedure('public.smyl_submit_informed_consent_signature(text,text,boolean)'), 'execute'), false) as anon_submit_ok,
            coalesce(not has_function_privilege('anon', to_regprocedure('public.smyl_create_informed_consent_signature_link(uuid,text,text,text,text,text)'), 'execute'), false) as anon_create_denied,
            coalesce(not has_table_privilege('anon', to_regclass('public.smyl_informed_consent_signature_links'), 'select'), false) as anon_links_denied,
            coalesce(not has_table_privilege('authenticated', to_regclass('public.smyl_informed_consent_signature_links'), 'select'), false) as authenticated_links_denied,
            exists(select 1 from supabase_migrations.schema_migrations where version = '${process.env.MIGRATION_VERSION}') as history_ok`))?.[0] || {};

          const complete = value => [
            'links_ok', 'create_ok', 'info_ok', 'submit_ok', 'status_ok', 'cancel_ok', 'finalize_ok',
            'anon_info_ok', 'anon_submit_ok', 'anon_create_denied', 'anon_links_denied', 'authenticated_links_denied',
          ].every(key => value[key] === true);

          const required = await prerequisites();
          console.log('Prerequisites:', JSON.stringify(required));
          if (!required.consents_ok || !required.audit_ok || !required.reauth_ok) {
            throw new Error(`Missing required SMYL schema; nothing was applied: ${JSON.stringify(required)}`);
          }

          const before = await inspect();
          console.log('Before:', JSON.stringify(before));
          if (!complete(before)) {
            await query(fs.readFileSync(process.env.MIGRATION_FILE, 'utf8'));
            console.log('Informed-consent signing migration applied.');
          } else {
            console.log('Informed-consent signing schema was already complete.');
          }

          await query("notify pgrst, 'reload schema'");
          const after = await inspect();
          console.log('After:', JSON.stringify(after));
          if (!complete(after)) throw new Error(`Incomplete post-deploy verification: ${JSON.stringify(after)}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `repair=${!after.history_ok}\n`);
          NODE

      - name: Record migration version
        if: steps.schema.outputs.repair == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          REPAIR_FLAG=--linked
          if supabase migration repair --help 2>&1 | grep -q -- '--remote'; then REPAIR_FLAG="--remote --yes"; fi
          supabase migration repair $REPAIR_FLAG --status applied "$MIGRATION_VERSION"
