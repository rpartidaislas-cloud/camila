name: SMYL - Alerta diaria de errores del panel

# Cada día (08:00 hora de la Ciudad de México) resume los errores de JavaScript que el panel registró en las últimas 24 h
# (tabla smyl_client_errors, ver migración 20261106140000). Si hay errores, el job termina en ROJO y GitHub te avisa por
# correo/notificación (las ejecuciones programadas fallidas notifican a quien las configuró). El resumen queda en la
# página de la ejecución. Opcionalmente también lo envía a un webhook de Slack/Discord si existe el secreto
# ALERTA_WEBHOOK_URL (Settings > Secrets and variables > Actions). Sólo lectura. Requiere SUPABASE_ACCESS_TOKEN.
# Umbral: variable de repositorio ALERTA_ERRORES_MINIMO (por omisión 1 error en 24 h).

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-alertas-errores-cliente
  cancel-in-progress: false

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ALERTA_WEBHOOK_URL: ${{ secrets.ALERTA_WEBHOOK_URL }}
      ALERTA_ERRORES_MINIMO: ${{ vars.ALERTA_ERRORES_MINIMO }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Resumir errores de las últimas 24 h
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { CONSULTA_ERRORES_24H, resumirErrores } from './scripts/client-error-digest.mjs';

          const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
            method: 'POST',
            headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
            body: JSON.stringify({ query: CONSULTA_ERRORES_24H }),
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
          const r = resumirErrores(JSON.parse(body), process.env.ALERTA_ERRORES_MINIMO);
          console.log(r.texto);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```\n' + r.texto + '\n```\n');

          if (r.alerta && process.env.ALERTA_WEBHOOK_URL) {
            try {
              const res = await fetch(process.env.ALERTA_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ text: r.texto, content: r.texto.slice(0, 1900) }),
              });
              console.log(res.ok ? 'Aviso enviado al webhook.' : `::warning::El webhook respondió ${res.status}.`);
            } catch (e) {
              console.log(`::warning::No se pudo enviar al webhook: ${e.message}`);
            }
          }
          if (r.alerta) {
            console.log(`::error::Hay ${r.total} error(es) de JavaScript del panel en las últimas 24 h (${r.grupos} grupo(s)).`);
            process.exit(1);
          }
          NODE
