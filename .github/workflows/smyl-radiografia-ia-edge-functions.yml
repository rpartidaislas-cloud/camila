name: SMYL Radiografía IA - Edge Functions (despliegue)

# Despliega radiograph-qc y radiograph-analyze. Sin secretos RADIOGRAPH_* configurados las funciones
# responden 503 "disabled" y, además, las banderas de la base están apagadas: no procesan nada.
# Se dispara a mano; nunca en push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-radiografia-ia-edge-functions
  cancel-in-progress: false

jobs:
  despliegue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Falta SUPABASE_ACCESS_TOKEN."; exit 1; fi
      - name: Comprobar que el esquema radiográfico ya está aplicado
        shell: bash
        run: |
          out=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' \
            -d '{"query":"select to_regprocedure('"'"'public.smyl_radiograph_claim_ai_run(uuid)'"'"') is not null as ok"}')
          echo "$out"
          echo "$out" | grep -q '"ok":true' || { echo "::error::Faltan las migraciones radiográficas; no se despliega."; exit 1; }
      - name: Desplegar
        shell: bash
        run: |
          supabase functions deploy radiograph-qc --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy radiograph-analyze --project-ref "$PROJECT_REF" --use-api
      - name: Verificar
        shell: bash
        run: |
          supabase functions list --project-ref "$PROJECT_REF" | tee /tmp/fn.txt
          grep -q "radiograph-qc" /tmp/fn.txt && grep -q "radiograph-analyze" /tmp/fn.txt
