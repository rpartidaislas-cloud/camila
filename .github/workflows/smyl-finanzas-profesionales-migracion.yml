name: SMYL Finanzas profesionales (migración)

# Activa en producción los permisos separados para operar caja, supervisar cajas y preparar facturas.
# Manual a propósito: verifica dependencias y estado antes y después de aplicar la migración.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smyl-finanzas-profesionales-produccion
  cancel-in-progress: false

jobs:
  migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rpxshsiwoxdbuevjjpfw
      MIGRATION_VERSION: "20261113123000"
      MIGRATION_FILE: supabase/migrations/20261113123000_smyl_professional_finance_roles.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar el secreto
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - name: Aplicar y verificar permisos financieros
        id: esquema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const consultar = async query => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`, {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Consulta rechazada (${response.status}): ${body}`);
            return JSON.parse(body);
          };

          const prerequisitos = async () => (await consultar(`select
            exists(select 1 from pg_proc p where p.pronamespace='public'::regnamespace and p.proname='smyl_has_permission') as permiso_fn_ok,
            to_regclass('public.smyl_role_permissions') is not null as permisos_ok,
            to_regclass('public.smyl_cash_sessions') is not null as cajas_ok,
            to_regclass('public.smyl_cash_adjustments') is not null as ajustes_ok,
            to_regclass('public.smyl_finance_payments') is not null as pagos_ok,
            to_regclass('public.smyl_cfdi_drafts') is not null as cfdi_ok`))?.[0] || {};

          const inspeccionar = async () => (await consultar(`select
            exists(select 1 from pg_constraint c where c.conrelid='public.smyl_role_permissions'::regclass
              and c.conname='smyl_role_permissions_permission_key_check'
              and pg_get_constraintdef(c.oid) like '%finance.cash%'
              and pg_get_constraintdef(c.oid) like '%finance.cash.supervise%'
              and pg_get_constraintdef(c.oid) like '%finance.invoice%') as claves_ok,
            exists(select 1 from pg_trigger where tgrelid='public.smyl_cash_sessions'::regclass and tgname='smyl_cash_role_guard' and not tgisinternal) as caja_ok,
            exists(select 1 from pg_trigger where tgrelid='public.smyl_cash_adjustments'::regclass and tgname='smyl_cash_adjustment_role_guard' and not tgisinternal) as ajustes_ok,
            exists(select 1 from pg_trigger where tgrelid='public.smyl_finance_payments'::regclass and tgname='smyl_cash_payment_role_guard' and not tgisinternal) as efectivo_ok,
            exists(select 1 from pg_trigger where tgrelid='public.smyl_cfdi_drafts'::regclass and tgname='smyl_cfdi_drafts_invoice_guard' and not tgisinternal) as factura_ok,
            exists(select 1 from pg_proc p where p.pronamespace='public'::regnamespace and p.proname='smyl_seed_catalog_permissions'
              and p.prosrc like '%finance.cash.supervise%' and p.prosrc like '%finance.invoice%') as siembra_ok,
            not exists(
              select 1 from public.smyl_role_permissions rp
              where rp.permission_key='finance.manage' and exists (
                select 1 from (values ('finance.cash'),('finance.cash.supervise'),('finance.invoice')) required(permission_key)
                where not exists(select 1 from public.smyl_role_permissions x where x.tenant_id=rp.tenant_id and x.role_id=rp.role_id and x.permission_key=required.permission_key)
              )
            ) as reparto_ok,
            exists(select 1 from supabase_migrations.schema_migrations where version='${process.env.MIGRATION_VERSION}') as historial_ok`))?.[0] || {};

          const completo = value => value.claves_ok && value.caja_ok && value.ajustes_ok && value.efectivo_ok && value.factura_ok && value.siembra_ok;
          const req = await prerequisitos();
          console.log('Prerrequisitos:', JSON.stringify(req));
          if (!Object.values(req).every(Boolean)) throw new Error(`Faltan dependencias; no se aplicó nada: ${JSON.stringify(req)}`);

          const antes = await inspeccionar();
          console.log('Antes:', JSON.stringify(antes));
          if (!completo(antes)) {
            await consultar(fs.readFileSync(process.env.MIGRATION_FILE, 'utf8'));
            console.log('Migración aplicada.');
          } else {
            console.log('La estructura profesional ya estaba aplicada.');
          }

          const despues = await inspeccionar();
          console.log('Después:', JSON.stringify(despues));
          if (!completo(despues)) throw new Error(`Verificación incompleta: ${JSON.stringify(despues)}`);
          if (!antes.claves_ok && !despues.reparto_ok) throw new Error('El reparto inicial de permisos quedó incompleto.');
          appendFileSync(process.env.GITHUB_OUTPUT, `reparar=${!despues.historial_ok}\n`);
          NODE

      - name: Registrar versión aplicada
        if: steps.esquema.outputs.reparar == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_REF"
          REPAIR_FLAG=--linked
          if supabase migration repair --help 2>&1 | grep -q -- '--remote'; then REPAIR_FLAG="--remote --yes"; fi
          supabase migration repair $REPAIR_FLAG --status applied "$MIGRATION_VERSION"
