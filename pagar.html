     Paynet con cadenas. Los pagos los procesa Openpay mediante la pasarela de LANA; SMYL registra el pago y emite el recibo. -->
<style>
:root{--ui-bg:#F4F7FA;--ui-surface:#FFFFFF;--ui-subtle:#F8FAFC;--ui-border:#D7E0E8;--ui-border-strong:#B7C4D1;--ui-text:#102239;--ui-text-2:#526173;--ui-muted:#667586;--ui-brand:#194391;--ui-brand-hover:#12366F;--ui-brand-soft:#EDF3FC;--ui-accent:#0F766E;--ui-accent-soft:#EAF7F5;--ui-info:#194391;--ui-info-soft:#EDF3FC;--ui-info-border:#C9D8F0;--ui-ok:#0F766E;--ui-ok-soft:#EAF7F5;--ui-ok-border:#B5E2DA;--ui-bad:#B42318;--ui-bad-soft:#FEF3F2;--ui-bad-border:#FECDCA;--spei:#194391}
*{box-sizing:border-box}
html{background:var(--ui-bg)}
body{margin:0;background:var(--ui-bg);color:var(--ui-text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid rgba(25,67,145,.22);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:18px 16px 48px}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0 16px;color:var(--ui-muted);font-size:13px}
.brand img{height:22px}
.card{background:var(--ui-surface);border:1px solid var(--ui-border);border-radius:16px;box-shadow:0 18px 48px rgba(16,24,40,.08);padding:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ui-brand);text-transform:uppercase}
h1{font-size:22px;line-height:1.25;margin:4px 0 2px}
.sub{color:var(--ui-muted);font-size:14px;margin:0 0 14px}
.lines{border-top:1px solid var(--ui-border);margin:12px 0}
.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ui-border);font-size:14px}
.line span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:20px;margin:10px 0 18px}
.total span:last-child{color:var(--ui-brand)}
.msg{border-radius:10px;padding:12px 14px;font-size:14px;margin:12px 0}
.msg.err{background:var(--ui-bad-soft);color:var(--ui-bad);border:1px solid var(--ui-bad-border)}
.msg.ok{background:var(--ui-ok-soft);color:var(--ui-ok)}
.msg.info{background:var(--ui-info-soft);color:var(--ui-info);border:1px solid var(--ui-info-border)}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:14px;border:0;border-radius:10px;background:var(--ui-brand);color:#fff;font-weight:700;padding:12px 16px;cursor:pointer}
.btn:hover{background:var(--ui-brand-hover)}
.btn:disabled{opacity:.5;cursor:default}
.done{text-align:center;padding:10px 0}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--ui-ok-soft);color:var(--ui-ok);display:grid;place-items:center;font-size:30px;margin:0 auto 10px}
[hidden]{display:none!important}
/* Tarjetas de método */
.pago-metodos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 10px}
.pago-btn{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;padding:14px 8px;border:1px solid var(--ui-border);border-radius:12px;background:var(--ui-surface);color:var(--ui-text);text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.pago-btn:hover{border-color:var(--ui-brand)}
.pago-btn[aria-selected="true"]{border-color:var(--ui-brand);background:var(--ui-brand-soft)}
.pago-ico{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--ui-border);border-radius:9px;background:var(--ui-subtle);color:var(--ui-text-2)}
.pago-btn[aria-selected="true"] .pago-ico{border-color:var(--ui-brand);background:var(--ui-brand);color:#fff}
.pago-ico svg{width:18px;height:18px}
.pago-txt{display:flex;flex-direction:column;align-items:center;gap:2px}
.pago-lbl{font-size:15px;font-weight:700}
.pago-desc{font-size:12px;color:var(--ui-muted)}
.pago-detalle{margin-top:6px;padding:16px;border:1px solid var(--ui-border);border-radius:12px;background:var(--ui-surface)}
.pago-detalle-tit{margin:0 0 10px;color:var(--ui-brand);font-size:12px;font-weight:700}
/* SPEI */
.spei-recibo{font-size:13px;color:var(--ui-text)}
.spei-rh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px;padding-bottom:10px;border-bottom:2px solid var(--ui-border);margin-bottom:14px}
.spei-rh-comercio{font-size:17px;font-weight:800}
.spei-rh-tipo{font-size:12px;color:var(--ui-muted)}
.spei-info-row,.spei-pasos-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.spei-sq{display:inline-block;width:8px;height:8px;background:var(--spei);margin-right:6px;flex-shrink:0}
.spei-sec-label{font-size:12px;font-weight:700;display:flex;align-items:center;margin-bottom:4px}
.spei-info-val{font-size:14px;font-weight:700}
.spei-monto-box{background:var(--spei);color:#fff;border-radius:8px;padding:12px 14px}
.spei-monto-lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;opacity:.9;margin-bottom:4px}
.spei-monto-val{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.spei-sec-hd{font-size:14px;font-weight:800;display:flex;align-items:center;margin:14px 0 8px}
.spei-tabla{width:100%;border-collapse:collapse}
.spei-td-k{background:var(--ui-subtle);padding:6px 8px;font-size:12px;color:var(--ui-text-2);width:38%;border:1px solid var(--ui-border);vertical-align:top}
.spei-td-v{padding:6px 8px;font-size:12px;border:1px solid var(--ui-border);word-break:break-all}
.spei-td-v.spei-clabe{word-break:normal;overflow-wrap:anywhere}
.spei-clabe{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:800;color:var(--ui-brand);letter-spacing:.03em}
.spei-importe{font-weight:800;color:var(--ui-brand)}
.spei-pasos-subtit{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ui-muted);margin-bottom:6px}
.spei-ol{margin:0 0 8px;padding-left:18px;font-size:12px;color:var(--ui-text-2);line-height:1.6}
.spei-footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--ui-border)}
.spei-btn-imprimir{min-height:40px;font-size:13px;font-weight:700;padding:8px 14px;background:var(--spei);color:#fff;border:0;border-radius:8px;cursor:pointer}
.op-brand{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ui-muted)}
/* Tarjeta (Openpay) */
.openpay-card-form{display:flex;flex-direction:column;gap:16px}
.openpay-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:16px;border-bottom:1px solid var(--ui-border)}
.openpay-card-kicker{display:block;margin-bottom:4px;color:var(--ui-brand);font-size:12px;font-weight:700}
.openpay-card-head h4{margin:0;font-size:18px;line-height:1.3}
.openpay-card-head p{max-width:420px;margin:5px 0 0;color:var(--ui-text-2);font-size:13px;line-height:1.5}
.openpay-card-amount{flex:0 0 auto;text-align:right}
.openpay-card-amount span{display:block;margin-bottom:3px;color:var(--ui-muted);font-size:12px;font-weight:600}
.openpay-card-amount strong{font-size:18px;white-space:nowrap}
.openpay-acceptance{display:flex;min-height:48px;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--ui-border);border-radius:10px;background:var(--ui-subtle)}
.openpay-acceptance>span{color:var(--ui-text-2);font-size:12px;font-weight:600;white-space:nowrap}
.openpay-acceptance img{display:block;width:auto;max-width:176px;height:18px;object-fit:contain}
.openpay-acceptance-kind{margin-left:auto;padding-left:12px;border-left:1px solid var(--ui-border);color:var(--ui-muted)!important;font-weight:500!important}
.openpay-card-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.openpay-card-field{display:flex;min-width:0;flex-direction:column;gap:6px}
.openpay-card-field label{color:var(--ui-text-2);font-size:13px;font-weight:600}
.openpay-card-field input{min-height:46px;width:100%;padding:11px 13px;border:1px solid var(--ui-border-strong);border-radius:8px;background:var(--ui-surface);color:var(--ui-text);font-size:16px}
.openpay-card-field input:focus-visible{outline:0;border-color:var(--ui-brand);box-shadow:0 0 0 3px var(--ui-brand-soft)}
.openpay-expiry-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.openpay-cvv-input{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.openpay-cvv-guide{display:flex;align-items:center;gap:6px;color:var(--ui-muted);font-size:12px;line-height:1.25}
.openpay-cvv-guide img{width:62px;height:28px;object-fit:contain}
.openpay-payment-meta{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--ui-border);border-radius:10px;background:var(--ui-subtle)}
.openpay-processor{display:flex;flex:0 0 auto;align-items:center;padding-right:12px;border-right:1px solid var(--ui-border)}
.openpay-processor img{display:block;width:82px;height:auto}
.openpay-secure{display:flex;min-width:0;align-items:center;gap:9px;color:var(--ui-text-2);font-size:12px;line-height:1.4}
.openpay-secure img{flex:0 0 auto;width:22px;height:26px;object-fit:contain}
.openpay-secure strong{display:block;color:var(--ui-text);font-size:12px}
.openpay-required-legend{margin:-8px 0 0;color:var(--ui-muted);font-size:12px}
.openpay-terms-check{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ui-text-2);line-height:1.5;cursor:pointer}
.openpay-terms-check input{flex:0 0 auto;width:18px;height:18px;margin-top:2px}
.openpay-terms-check a{color:var(--ui-text-2);text-underline-offset:2px}
/* Paynet */
.paynet-receipt{display:flex;flex-direction:column;gap:16px}
.paynet-receipt-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--ui-border)}
.paynet-wordmark{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800}
.paynet-wordmark small{font-size:12px;font-weight:600;color:var(--ui-muted)}
.paynet-wordmark-mark{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:9px;background:var(--ui-brand);color:#fff}
.paynet-wordmark-mark svg{width:20px;height:20px}
.paynet-receipt-kicker{margin:5px 0 0;color:var(--ui-muted);font-size:12px}
.paynet-amount{text-align:right}
.paynet-amount span{display:block;color:var(--ui-muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.paynet-amount strong{display:block;margin-top:3px;font-size:20px;font-weight:800}
.paynet-code-card{padding:18px;border:1px solid var(--ui-border);border-radius:12px;background:var(--ui-surface);text-align:center}
.paynet-code-label{margin:0 0 10px;color:var(--ui-text-2);font-size:13px;font-weight:600}
.paynet-barcode{display:block;width:min(100%,520px);max-height:150px;object-fit:contain;margin:0 auto 14px;padding:10px;border-radius:8px;background:#fff}
.paynet-reference-label{margin:0;color:var(--ui-muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.paynet-reference{margin:6px 0 12px;font:800 clamp(22px,5vw,32px)/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;overflow-wrap:anywhere}
.paynet-copy-status{min-height:16px;margin:7px 0 0;color:var(--ui-ok);font-size:12px}
.paynet-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.paynet-action{display:inline-flex;min-height:40px;align-items:center;justify-content:center;gap:7px;padding:0 14px;border:1px solid var(--ui-border-strong);border-radius:8px;background:var(--ui-surface);color:var(--ui-text);font-size:13px;font-weight:600;cursor:pointer}
.paynet-action:hover{border-color:var(--ui-brand);color:var(--ui-brand);background:var(--ui-brand-soft)}
.paynet-action svg{width:16px;height:16px}
.paynet-share-whatsapp{display:none}
.paynet-expiry{margin:0;color:var(--ui-text-2);font-size:13px;text-align:center}
.paynet-instructions{margin:0;padding:14px 14px 14px 32px;border:1px solid var(--ui-info-border);border-radius:10px;background:var(--ui-info-soft);color:var(--ui-text-2);font-size:13px;line-height:1.55}
.paynet-instructions li+li{margin-top:5px}
.paynet-stores{border:1px solid var(--ui-border);border-radius:10px;background:var(--ui-surface);overflow:hidden}
.paynet-stores summary{padding:13px 14px;font-size:13px;font-weight:700;cursor:pointer;list-style:none}
.paynet-stores summary::-webkit-details-marker{display:none}
.paynet-stores summary::after{content:"+";float:right;color:var(--ui-brand);font-size:16px}
.paynet-stores[open] summary::after{content:"−"}
.paynet-store-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 12px 12px}
.paynet-store-card{min-width:0;padding:9px;border:1px solid var(--ui-border);border-radius:9px;background:var(--ui-subtle)}
.paynet-store-logo{display:flex;height:38px;align-items:center;justify-content:center;margin-bottom:7px;padding:4px 6px;border-radius:6px;background:#fff}
.paynet-store-logo img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.paynet-store-name{overflow:hidden;font-size:12px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.paynet-store-fee{margin-top:4px;color:var(--ui-text-2);font-size:12px;line-height:1.35}
.paynet-store-limit{color:var(--ui-muted);font-size:12px;line-height:1.35}
.paynet-source{margin:0;color:var(--ui-muted);font-size:12px;line-height:1.45}
.paynet-source a{color:var(--ui-brand);font-weight:600}
.legal{margin-top:16px;color:var(--ui-muted);font-size:12px;line-height:1.55;text-align:center}
.legal a{color:var(--ui-text-2)}
@media(max-width:600px){
  .card{padding:16px}
  .pago-metodos{grid-template-columns:1fr}
  .pago-btn{flex-direction:row;min-height:60px;justify-content:flex-start;text-align:left;gap:12px;padding:10px 12px}
  .pago-btn .pago-txt{align-items:flex-start}
  .spei-info-row,.spei-pasos-row{grid-template-columns:1fr}
  .openpay-card-head,.paynet-receipt-head{align-items:stretch;flex-direction:column;gap:10px}
  .openpay-card-amount,.paynet-amount{text-align:left}
  .openpay-acceptance{flex-wrap:wrap}
  .openpay-acceptance-kind{width:100%;margin-left:0;padding:7px 0 0;border-top:1px solid var(--ui-border);border-left:0}
  .openpay-card-row{grid-template-columns:1fr}
  .openpay-payment-meta{align-items:flex-start}
  .paynet-code-card{padding:14px 10px}
  .paynet-store-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .paynet-action,.spei-btn-imprimir{width:100%}
  .paynet-share-whatsapp{display:inline-flex}
}
</style>

    var styles = '@page{size:A4;margin:10mm}*{box-sizing:border-box}body{margin:0;color:#172033;font:12px/1.5 Arial,sans-serif}.sheet{max-width:190mm;margin:auto}.hd{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:2px solid #172033;margin-bottom:14px}.hd b{font-size:17px}.muted{color:#64748b}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}.monto{background:#194391;color:#fff;border-radius:8px;padding:12px 14px}.monto div:last-child{font-size:20px;font-weight:800}h3{font-size:13px;margin:14px 0 8px}table{width:100%;border-collapse:collapse}td{border:1px solid #e2e8f0;padding:5px 8px}td.k{background:#f1f5f9;color:#475569;width:38%}.v{font-family:monospace;font-weight:800;color:#194391}ol{margin:0 0 8px;padding-left:16px}.sub{font-size:11px;font-weight:700;text-transform:uppercase;color:#64748b;margin-bottom:6px}.foot{margin-top:14px;color:#64748b;font-size:11px}button{margin-top:14px;padding:8px 14px}@media print{button{display:none}}';
    function tr(k, v, cls) { return '<tr><td class="k">' + esc(k) + '</td><td' + (cls ? ' class="v"' : '') + '>' + esc(v) + '</td></tr>'; }
    var cie = d.convenio ? '<div><div class="sub">Desde BBVA Bancomer (CIE)</div><ol><li>Accede a Bancomer Móvil o BBVA en línea.</li><li>Ve a Pagos → Pago de servicios / CIE.</li><li>Ingresa el convenio y referencia de abajo.</li><li>Tu pago se confirmará automáticamente.</li></ol><table>' + tr('Convenio CIE', d.convenio, 1) + tr('Referencia', ref, 1) + tr('Importe', amount, 1) + '</table></div>' : '';
    var html = '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Ficha SPEI · ' + esc(c) + '</title><style>' + styles + '</style></head><body><div class="sheet">'
      + '<div class="hd"><b>' + esc(c) + '</b><span class="muted">Transferencia interbancaria (SPEI)</span></div>'
      + '<div class="row"><div><div class="sub">Beneficiario</div><b>' + esc(c) + '</b></div><div class="monto"><div>TOTAL A PAGAR / MXN</div><div>' + esc(amount) + '</div></div></div>'
      + '<h3>Detalles de la compra</h3><table>' + tr('Descripción', concept()) + tr('Fecha y hora', fecha) + '</table>'
      + '<h3>Pasos para realizar el pago</h3><div class="row">' + cie
      + '<div><div class="sub">' + (d.convenio ? 'Desde cualquier otro banco (SPEI)' : 'Desde cualquier banco (SPEI)') + '</div><ol><li>Accede a tu banca en línea o app.</li><li>Selecciona transferencia SPEI.</li><li>Ingresa la CLABE y los datos de abajo.</li><li>Tu pago se confirmará automáticamente.</li></ol><table>' + tr('Beneficiario', c) + tr('Banco destino', banco) + tr('CLABE', d.clabe, 1) + tr('Concepto', ref) + tr('Importe', amount, 1) + '</table></div></div>'

  // ───────── Paynet: efectivo en tiendas (ficha como la de LANA) ─────────
  function paynetPanel() {
    var box = el('div');
    box.appendChild(el('p', { 'class': 'pago-detalle-tit', text: 'Pago en efectivo con Paynet' }));
    box.appendChild(el('p', { 'class': 'sub', text: 'Genera una referencia y paga en efectivo en tiendas afiliadas a Paynet (7-Eleven, Walmart, Farmacias del Ahorro y más). La tienda cobra una comisión adicional.' }));
    var err = el('div', { 'class': 'msg err', hidden: 'hidden' });
    var btn = el('button', { 'class': 'btn', type: 'button', text: 'Generar referencia para pagar en tienda' });
    btn.onclick = function () {
      btn.disabled = true; err.hidden = true; btn.textContent = 'Generando…';
      post(LANA_PAY, { accion: 'paynet', token: token }).then(function (d) {
        if (d.status === 'paynet') return showPaynet(box, d);
        if (d.status === 'pagada') return waiting();
        btn.disabled = false; btn.textContent = 'Generar referencia para pagar en tienda'; err.textContent = d.error || 'No se pudo generar la referencia.'; err.hidden = false;
      }).catch(function () { btn.disabled = false; btn.textContent = 'Generar referencia para pagar en tienda'; err.textContent = 'No pudimos conectar. Inténtalo de nuevo.'; err.hidden = false; });
    };
    box.appendChild(err); box.appendChild(btn);
    return box;
  }
  function safeBarcode(url) { return url && /^https:\/\/([a-z0-9-]+\.)*openpay\.mx\//.test(url) ? url : ''; }
  function storeCards(absolute) {
    return PAYNET_STORES.map(function (s) {
      var src = absolute ? new URL('assets/paynet/' + s.logo, document.baseURI).href : 'assets/paynet/' + s.logo;
      return el('article', { 'class': 'paynet-store-card' }, [
        el('div', { 'class': 'paynet-store-logo' }, [el('img', { src: src, alt: s.name, loading: 'lazy' })]),
        el('div', { 'class': 'paynet-store-name', text: s.name }),
        el('div', { 'class': 'paynet-store-fee' }, ['Comisión: ', el('strong', { text: '$' + s.commission.toFixed(2) })]),
        el('div', { 'class': 'paynet-store-limit', text: 'Máximo: $' + s.limit.toLocaleString('es-MX') + ' · ' + s.coverage })
      ]);
    });
  }
  function showPaynet(box, d) {
    var barcode = safeBarcode(d.barcode_url);
    box.textContent = '';
    box.appendChild(el('p', { 'class': 'pago-detalle-tit', text: 'Pago en efectivo con Paynet' }));
    var rec = el('section', { 'class': 'paynet-receipt', 'aria-label': 'Ficha de pago Paynet' });
    rec.appendChild(el('header', { 'class': 'paynet-receipt-head' }, [
      el('div', {}, [el('div', { 'class': 'paynet-wordmark' }, [el('span', { 'class': 'paynet-wordmark-mark' }, [icon('store')]), el('span', {}, ['Paynet ', el('small', { text: 'por Openpay' })])]), el('p', { 'class': 'paynet-receipt-kicker', text: 'Referencia para pagar en efectivo' })]),
      el('div', { 'class': 'paynet-amount' }, [el('span', { text: 'Total a pagar' }), el('strong', { text: mxn(d.monto) })])
    ]));
    var status = el('p', { 'class': 'paynet-copy-status', role: 'status', 'aria-live': 'polite' });
    var copy = el('button', { type: 'button', 'class': 'paynet-action' }, [icon('copy'), 'Copiar referencia']);
    copy.onclick = function () { copyText(String(d.referencia || '').replace(/\s+/g, ''), status); };
    var share = el('button', { type: 'button', 'class': 'paynet-action paynet-share-whatsapp' }, [icon('share'), 'Compartir por WhatsApp']);
    share.onclick = function () {
      var text = ['Referencia de pago Paynet — ' + clinicName(), 'Referencia: ' + groups(d.referencia), 'Monto: ' + mxn(d.monto), d.vence ? 'Fecha límite: ' + dateTime(d.vence) + ' (hora de Ciudad de México)' : ''].filter(Boolean).join('\n');
      var w = window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener,noreferrer'); if (!w) location.assign('https://wa.me/?text=' + encodeURIComponent(text));
    };
    var print = el('button', { type: 'button', 'class': 'paynet-action' }, [icon('print'), 'Imprimir o guardar PDF']);
    print.onclick = function () { printPaynet(d); };
    rec.appendChild(el('div', { 'class': 'paynet-code-card' }, [
      el('p', { 'class': 'paynet-code-label', text: 'Muestra este código desde tu celular o impreso' }),
      barcode ? el('img', { 'class': 'paynet-barcode', src: barcode, alt: 'Código de barras de la referencia de pago' }) : null,
      el('p', { 'class': 'paynet-reference-label', text: 'O dicta este número de referencia' }),
      el('div', { 'class': 'paynet-reference', text: groups(d.referencia) }),
      el('div', { 'class': 'paynet-actions' }, [copy, share, print]),
      status
    ]));
    if (d.vence) rec.appendChild(el('p', { 'class': 'paynet-expiry' }, [el('strong', { text: 'Fecha límite: ' }), dateTime(d.vence) + ' (hora de Ciudad de México)']));
    rec.appendChild(el('ol', { 'class': 'paynet-instructions' }, [
      el('li', { text: 'Acude a una cadena afiliada dentro de la fecha límite.' }),
      el('li', { text: 'Indica en caja que realizarás un pago en efectivo Paynet y muestra el código o dicta la referencia.' }),
      el('li', { text: 'Verifica el monto, paga en efectivo y conserva el comprobante. ' + clinicName() + ' recibirá la confirmación automáticamente.' })
    ]));
    rec.appendChild(el('details', { 'class': 'paynet-stores' }, [el('summary', { text: 'Dónde pagar: ' + PAYNET_STORES.length + ' cadenas, comisiones y límites' }), el('div', { 'class': 'paynet-store-grid' }, storeCards(false))]));
    rec.appendChild(el('p', { 'class': 'paynet-source' }, ['Las comisiones son adicionales al monto de la referencia, las cobra cada cadena al usuario final y pueden cambiar. Información consultada en el directorio oficial de ', el('a', { href: 'https://www.paynet.com.mx/', target: '_blank', rel: 'noopener noreferrer', text: 'Paynet' }), '.']));
    box.appendChild(rec);
    startPoll();
  }
  function printPaynet(d) {
    var popup = window.open('', '_blank', 'width=900,height=850');
    if (!popup) { alert('Permite ventanas emergentes para imprimir o guardar el PDF.'); return; }
    try { popup.opener = null; } catch (e) {}
    var barcode = safeBarcode(d.barcode_url), c = clinicName();
    var styles = '@page{size:A4;margin:8mm}*{box-sizing:border-box}body{margin:0;color:#172033;font:11.5px/1.4 Arial,sans-serif}.sheet{max-width:194mm;margin:auto}.head{display:flex;justify-content:space-between;gap:16px;padding-bottom:11px;border-bottom:2px solid #194391}.brand{font-size:22px;font-weight:800}.muted{color:#64748b}.amount{text-align:right}.amount strong{display:block;font-size:22px}.code{margin:14px 0;padding:14px;border:1px solid #d0d5dd;border-radius:10px;text-align:center}.barcode{max-width:100%;max-height:120px}.ref{font:800 26px monospace;letter-spacing:.06em}ol{background:#f2f4f7;border-radius:8px;padding:10px 10px 10px 28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.store{border:1px solid #e4e7ec;border-radius:6px;padding:6px}.store img{display:block;height:24px;max-width:100%;object-fit:contain;margin:0 auto 4px}.store b{display:block;font-size:10px}.store span{display:block;font-size:9px;color:#475467}.source{font-size:9px;color:#64748b}button{margin-top:12px;padding:8px 14px}@media print{button{display:none}}';
    var stores = PAYNET_STORES.map(function (s) { return '<div class="store"><img src="' + esc(new URL('assets/paynet/' + s.logo, document.baseURI).href) + '" alt="' + esc(s.name) + '"><b>' + esc(s.name) + '</b><span>Comisión: $' + s.commission.toFixed(2) + '</span><span>Máximo: $' + s.limit.toLocaleString('es-MX') + ' · ' + esc(s.coverage) + '</span></div>'; }).join('');
    var html = '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Referencia Paynet ' + esc(d.referencia) + '</title><style>' + styles + '</style></head><body><main class="sheet">'
      + '<header class="head"><div><div class="brand">Paynet <span class="muted" style="font-size:12px">por Openpay</span></div><div class="muted">Referencia de pago en efectivo</div></div><div class="amount"><span class="muted">TOTAL A PAGAR</span><strong>' + esc(mxn(d.monto)) + '</strong></div></header>'
      + '<h2 style="font-size:14px">Detalles de la compra</h2><table style="width:100%"><tr><td class="muted" style="width:38%">Descripción</td><td>' + esc(concept() + ' — ' + c) + '</td></tr><tr><td class="muted">Fecha</td><td>' + esc(longNow()) + '</td></tr></table>'
      + '<section class="code"><p class="muted">Muestra este código impreso o desde tu celular</p>' + (barcode ? '<img class="barcode" src="' + esc(barcode) + '" alt="Código de barras Paynet">' : '') + '<p class="muted">O dicta este número de referencia</p><div class="ref">' + esc(groups(d.referencia)) + '</div>' + (d.vence ? '<p><strong>Fecha límite:</strong> ' + esc(dateTime(d.vence)) + ' (hora de Ciudad de México)</p>' : '') + '</section>'
      + '<h2 style="font-size:14px">Instrucciones de pago</h2><ol><li>Acude a una cadena afiliada y solicita un pago en efectivo Paynet.</li><li>Muestra el código o dicta la referencia y verifica que el monto coincida.</li><li>Paga en efectivo y conserva tu comprobante. ' + esc(c) + ' recibirá la confirmación automáticamente.</li></ol>'
      + '<h2 style="font-size:14px">Puedes realizar el pago en estas cadenas</h2><div class="grid">' + stores + '</div>'
      + '<p class="source">Comisiones para usuario final y montos máximos consultados en paynet.com.mx. Pueden cambiar sin previo aviso y la disponibilidad depende de la ubicación. La comisión se paga directamente a la cadena y es adicional al monto de esta referencia.</p>'
      + '<button onclick="window.print()">Imprimir o guardar como PDF</button></main></body></html>';
    popup.document.open(); popup.document.write(html); popup.document.close(); popup.focus();
    popup.addEventListener('load', function () { setTimeout(function () { popup.print(); }, 450); });
  }

  function init() {
    if (!/^[a-f0-9]{64}$/.test(token)) return showMessage('Enlace no válido', 'Abre el enlace completo que te envió tu clínica.', 'err');
    post(SMYL_PAY, { action: 'view', token: token }).then(function (v) {
      if (v._status === 404) return showMessage('Enlace no disponible', 'Este enlace no existe o ya no está disponible. Pide uno nuevo a tu clínica.', 'err');
      if (v._status !== 200) return showMessage('Servicio ocupado', 'No pudimos cargar tu recibo en este momento. Inténtalo de nuevo en unos minutos.', 'err');
      view = v;
      if (v.status === 'paid') return showPaid(v);
      if (v.status === 'expired') return showMessage('Enlace vencido', 'Este enlace de pago venció. Pide uno nuevo a tu clínica.', 'err');
      if (v.status === 'cancelled') return showMessage('Enlace cancelado', 'Tu clínica canceló este enlace. Pide uno nuevo si aún tienes saldo.', 'err');
      var returned = /[?&]pago=retorno/.test(location.search);
      return post(LANA_PAY, { accion: 'config', token: token }).then(function (c) {
        if (!c.openpay) return showMessage('Pago no disponible', c.error || 'El pago en línea no está disponible por ahora.', 'err');
        cfg = c;
        try { OpenPay.setId(c.openpay.merchant_id); OpenPay.setApiKey(c.openpay.public_key); OpenPay.setSandboxMode(c.openpay.sandbox !== false); } catch (e) {}
        if (returned) return waiting();
        renderForm(v);
      });
    }).catch(function () { showMessage('Sin conexión', 'No pudimos cargar tu recibo. Revisa tu conexión y vuelve a intentarlo.', 'err'); });
  }
  init();
})();
