<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Perfil profesional · SMYL</title>
    <meta
      name="description"
      content="Conoce el perfil profesional de tu dentista y solicita una cita de forma segura."
    />
    <meta name="theme-color" content="#194391" />
    <meta property="og:site_name" content="SMYL" />
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:title" content="Perfil profesional dental · SMYL" />
    <meta property="og:description" content="Conoce al profesional y solicita una valoración dental." />
    <meta property="og:image" content="" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./smyl-design-system-v2.css?v=2" />
    <link rel="stylesheet" href="./smyl-public-profile.css?v=1" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
    <style id="smyl-public-profile-legacy" media="not all">
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: #f4f3ee;
        color: #173a38;
        font-family: "DM Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      .shell {
        min-height: 100vh;
      }
      .top {
        height: 66px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 max(22px, calc((100vw - 1160px) / 2));
        background: rgba(250, 250, 247, 0.88);
        border-bottom: 1px solid #dce2dd;
        backdrop-filter: blur(14px);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .brand {
        font-family: "Playfair Display", serif;
        font-size: 24px;
        letter-spacing: 0.08em;
      }
      .top button {
        border: 1px solid #cdd9d4;
        background: #fff;
        color: #234b48;
        border-radius: 9px;
        padding: 9px 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .hero {
        background: linear-gradient(145deg, #173f3d, #2c625b 66%, #73968a);
        color: #fff;
        padding: 62px 24px 110px;
      }
      .hero-inner {
        max-width: 1160px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 58px;
        align-items: center;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.15em;
        color: #bdd7cf;
      }
      .hero h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(42px, 6vw, 70px);
        line-height: 1.02;
        margin: 14px 0 12px;
        font-weight: 500;
        max-width: 760px;
      }
      .hero .specialty {
        font-size: 17px;
        color: #d6e6e1;
        font-weight: 600;
      }
      .hero .headline {
        font-size: 18px;
        line-height: 1.6;
        max-width: 680px;
        color: #e4eeea;
        margin: 24px 0;
      }
      .trust {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }
      .trust span {
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.09);
        padding: 8px 11px;
        border-radius: 99px;
        font-size: 12px;
      }
      .trust span[data-verified="false"] {
        border-style: dashed;
        color: #d9e5e1;
      }
      .portrait {
        width: 310px;
        height: 360px;
        border-radius: 150px 150px 22px 22px;
        background: linear-gradient(160deg, #aac6bd, #e4e9e2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 28px 70px rgba(3, 24, 22, 0.28);
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .portrait span {
        font-family: "Playfair Display", serif;
        font-size: 72px;
        color: #275a55;
      }
      .content {
        max-width: 1160px;
        margin: -64px auto 0;
        padding: 0 24px 80px;
        position: relative;
      }
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 370px;
        gap: 24px;
        align-items: start;
      }
      .card {
        background: #fff;
        border: 1px solid #dde4df;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 14px 44px rgba(28, 58, 55, 0.06);
      }
      .card + .card {
        margin-top: 18px;
      }
      .card h2 {
        font-family: "Playfair Display", serif;
        font-size: 29px;
        font-weight: 500;
        margin: 0 0 16px;
      }
      .card p {
        color: #5c706c;
        line-height: 1.75;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 22px 0;
      }
      .fact {
        background: #f4f7f4;
        border-radius: 12px;
        padding: 14px;
      }
      .fact span {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #788985;
      }
      .fact strong {
        display: block;
        margin-top: 6px;
        font-size: 14px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chips span {
        padding: 8px 11px;
        border-radius: 99px;
        background: #edf4f1;
        color: #35645f;
        font-size: 12px;
      }
      .timeline {
        display: grid;
        gap: 13px;
      }
      .timeline div {
        border-left: 2px solid #b8d2c9;
        padding-left: 14px;
      }
      .timeline strong {
        display: block;
        font-size: 14px;
      }
      .timeline span {
        display: block;
        color: #778783;
        font-size: 12px;
        margin-top: 4px;
      }
      .location {
        padding: 14px 0;
        border-top: 1px solid #e5e9e6;
      }
      .location:first-of-type {
        border-top: 0;
      }
      .location strong,
      .location span {
        display: block;
      }
      .location span {
        font-size: 12px;
        color: #71817e;
        margin-top: 5px;
      }
      .appointment {
        position: sticky;
        top: 86px;
      }
      .cases-card > p {
        color: var(--muted);
        line-height: 1.65;
        margin: -6px 0 20px;
      }
      .case-gallery { display: grid; gap: 18px; }
      .public-case { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
      .public-case-images { display: grid; grid-template-columns: 1fr 1fr; background: #edf1ee; }
      .public-case-images figure { margin: 0; min-width: 0; position: relative; }
      .public-case-images figure:first-child { border-right: 2px solid white; }
      .public-case-images img { width: 100%; aspect-ratio: 4 / 3; display: block; object-fit: cover; }
      .public-case-images figcaption { position: absolute; left: 12px; bottom: 12px; background: rgba(18,42,39,.82); color: white; border-radius: 99px; padding: 6px 10px; font-size: 11px; }
      .public-case-copy { padding: 18px; }
      .public-case-copy span { color: var(--green); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
      .public-case-copy h3 { margin: 6px 0; font-size: 20px; }
      .public-case-copy p { margin: 0; color: var(--muted); line-height: 1.6; }
      .cases-disclaimer { margin-top: 16px!important; font-size: 12px; background: #f6f7f4; border-radius: 10px; padding: 11px 13px; }
      .reviews-summary { display: flex; gap: 14px; align-items: center; margin: -4px 0 20px; }
      .reviews-summary strong { color: #b58408; font-size: 25px; letter-spacing: .06em; }
      .reviews-summary span { color: #647671; font-size: 12px; }
      .reviews-list { display: grid; gap: 12px; }
      .public-review { border: 1px solid #e0e6e2; border-radius: 14px; padding: 17px; }
      .public-review > span { color: #ba8809; letter-spacing: .08em; }
      .public-review blockquote { margin: 10px 0; color: #334d49; line-height: 1.65; font-size: 14px; }
      .public-review footer { border: 0; margin: 0; padding: 0; display: flex; justify-content: space-between; font-size: 11px; color: #71817d; }
      .appointment header {
        margin: -28px -28px 22px;
        padding: 24px 28px;
        background: #edf5f1;
        border-radius: 18px 18px 0 0;
      }
      .appointment header span {
        font-size: 10px;
        letter-spacing: 0.12em;
        color: #54726d;
      }
      .appointment header h2 {
        font-family: "DM Sans", sans-serif;
        font-size: 23px;
        font-weight: 650;
        margin: 6px 0;
      }
      .appointment header p {
        font-size: 12px;
        margin: 0;
        line-height: 1.5;
      }
      .appointment form {
        display: grid;
        gap: 12px;
      }
      .appointment label {
        display: grid;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
      }
      .appointment input,
      .appointment select,
      .appointment textarea {
        width: 100%;
        border: 1px solid #d6dfda;
        border-radius: 9px;
        padding: 11px 12px;
        font: inherit;
        color: #173a38;
        background: #fff;
      }
      .appointment textarea {
        resize: vertical;
        min-height: 82px;
      }
      .appointment input:focus,
      .appointment select:focus,
      .appointment textarea:focus {
        outline: 2px solid #6da299;
        outline-offset: 1px;
      }
      .appointment button[type="submit"] {
        border: 0;
        background: #214f4c;
        color: #fff;
        border-radius: 10px;
        padding: 13px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      .appointment button[disabled] {
        opacity: 0.65;
        cursor: wait;
      }
      .appointment .fine {
        font-size: 10px;
        color: #83918e;
        line-height: 1.45;
        text-align: center;
      }
      .honeypot {
        position: absolute !important;
        left: -9999px !important;
      }
      .result {
        padding: 18px;
        border-radius: 12px;
        background: #eaf6f0;
        color: #245f4e;
        text-align: center;
      }
      .result strong {
        display: block;
        margin-bottom: 5px;
      }
      .result p {
        font-size: 12px;
        margin: 0;
      }
      .error {
        padding: 11px;
        border-radius: 9px;
        background: #fff0ed;
        color: #923d33;
        font-size: 12px;
      }
      .loading,
      .missing {
        min-height: calc(100vh - 66px);
        display: grid;
        place-items: center;
        padding: 30px;
        text-align: center;
      }
      .loading div,
      .missing div {
        max-width: 480px;
      }
      .loading span {
        display: block;
        width: 42px;
        height: 42px;
        border: 3px solid #d5e1dc;
        border-top-color: #2b625b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: auto;
      }
      .missing h1 {
        font-family: "Playfair Display", serif;
        font-size: 38px;
      }
      .missing p {
        color: #677975;
        line-height: 1.6;
      }
      .missing a {
        display: inline-block;
        margin-top: 16px;
        background: #214f4c;
        color: #fff;
        padding: 12px 17px;
        border-radius: 9px;
        text-decoration: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      footer {
        max-width: 1160px;
        margin: auto;
        padding: 28px 24px 44px;
        color: #7b8986;
        font-size: 11px;
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #dce2dd;
      }
      @media (max-width: 880px) {
        .hero {
          padding-top: 44px;
        }
        .hero-inner {
          grid-template-columns: 1fr;
        }
        .portrait {
          display: none;
        }
        .main-grid {
          grid-template-columns: 1fr;
        }
        .appointment {
          position: static;
          grid-row: 1;
        }
        .content {
          margin-top: -56px;
        }
        .facts {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 520px) {
        .top {
          padding: 0 16px;
        }
        .hero {
          padding: 35px 18px 92px;
        }
        .hero h1 {
          font-size: 43px;
        }
        .hero .headline {
          font-size: 15px;
        }
        .content {
          padding: 0 12px 60px;
        }
        .card {
          padding: 21px;
          border-radius: 15px;
        }
        .appointment header {
          margin: -21px -21px 18px;
          padding: 20px 21px;
        }
        .facts {
          grid-template-columns: 1fr;
        }
        .top button {
          font-size: 11px;
        }
        .trust span {
          font-size: 10px;
        }
        .appointment form > div[style] {
          grid-template-columns: 1fr !important;
        }
        footer {
          display: block;
          line-height: 1.8;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#app">Saltar al perfil profesional</a>
    <div class="shell">
      <header class="top">
        <div class="brand">SMYL</div>
        <div class="top-actions">
          <a href="#servicios">Servicios</a>
          <a href="#experiencia">Experiencia</a>
          <a href="#ubicaciones">Ubicaciones</a>
          <button id="share-profile" type="button">Compartir perfil</button>
          <span id="share-status" class="sr-only" role="status" aria-live="polite"></span>
          <a class="top-cta" href="#solicitar">Solicitar cita</a>
        </div>
      </header>
      <main id="app">
        <section class="loading" role="status" aria-live="polite">
          <div>
            <span aria-hidden="true"></span>
            <p>Preparando el perfil profesional…</p>
          </div>
        </section>
      </main>
      <footer>
        <span>SMYL · Perfiles profesionales dentales</span
        ><span>La clínica confirma cada solicitud de cita.</span>
      </footer>
    </div>
    <script>
      (function () {
        "use strict";
        var SUPA_URL = "https://rpxshsiwoxdbuevjjpfw.supabase.co",
          SUPA_KEY = "sb_publishable_2YmASbqlTpFXz12VxzzKJw_m9TWVLLo",
          // Cloudflare Turnstile — reemplaza con tu site key de https://dash.cloudflare.com/?to=/:account/turnstile
          // Deja vacío ("") para deshabilitar el widget; el backend también
          // requiere TURNSTILE_SECRET_KEY en los secrets de Supabase para validar.
          TURNSTILE_SITE_KEY = "",
          turnstileWidgetId = null;
        function renderTurnstile() {
          var container = document.getElementById("appointment-turnstile");
          if (!TURNSTILE_SITE_KEY || !container || !window.turnstile || container.dataset.rendered === "true" || container.offsetParent === null) return;
          turnstileWidgetId = window.turnstile.render(container, {
            sitekey: TURNSTILE_SITE_KEY,
            theme: "light",
            size: "flexible",
            appearance: "interaction-only",
          });
          container.dataset.rendered = "true";
        }
        if (TURNSTILE_SITE_KEY) {
          var _ts = document.createElement("script");
          _ts.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
          _ts.async = true; _ts.defer = true;
          _ts.onload = renderTurnstile;
          document.head.appendChild(_ts);
        }
        var sb = window.supabase.createClient(SUPA_URL, SUPA_KEY),
          app = document.getElementById("app"),
          profile = null;
        function esc(v) {
          return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }
        function initials(n) {
          return String(n || "SM")
            .split(/\s+/)
            .slice(0, 2)
            .map(function (x) {
              return x.charAt(0).toUpperCase();
            })
            .join("");
        }
        function photo(path) {
          if (!path) return "";
          return (
            sb.storage.from("smyl-professional-public").getPublicUrl(path).data
              .publicUrl || ""
          );
        }
        function rows(items, kind) {
          return (
            (items || [])
              .map(function (x) {
                return (
                  "<div><strong>" +
                  esc(typeof x === "string" ? x : x.title || x.name || "") +
                  "</strong>" +
                  (typeof x === "object" && x.subtitle
                    ? "<span>" + esc(x.subtitle) + "</span>"
                    : "") +
                  "</div>"
                );
              })
              .join("") || "<p>Información en actualización.</p>"
          );
        }
        function selectOptions(items) {
          return (items || [])
            .map(function (x) {
              return (
                '<option value="' + esc(x.id) + '">' + esc(x.name) + "</option>"
              );
            })
            .join("");
        }
        function renderCases(items) {
          var section = document.getElementById("authorized-cases"), host = document.getElementById("case-gallery");
          if (!section || !host || !items || !items.length) return;
          host.innerHTML = items.map(function (c) {
            return '<article class="public-case"><div class="public-case-images"><figure><img src="'+esc(c.before_url)+'" alt="Estado inicial documentado del caso: '+esc(c.title)+'" loading="lazy"><figcaption>Estado inicial</figcaption></figure><figure><img src="'+esc(c.after_url)+'" alt="Resultado documentado del caso: '+esc(c.title)+'" loading="lazy"><figcaption>Resultado documentado</figcaption></figure></div><div class="public-case-copy"><span>'+esc(c.treatment)+'</span><h3>'+esc(c.title)+'</h3><p>'+esc(c.summary)+'</p></div></article>';
          }).join("");
          section.hidden = false;
        }
        async function loadCases(slug) {
          try {
            var response = await fetch(SUPA_URL + "/functions/v1/public-professional-cases?perfil=" + encodeURIComponent(slug), { headers: { apikey: SUPA_KEY } });
            if (!response.ok) return;
            var body = await response.json();
            renderCases(body.cases || []);
          } catch (_) { /* El perfil sigue disponible si la galería no responde. */ }
        }
        function renderReviews(data) {
          var section=document.getElementById("verified-reviews"),host=document.getElementById("reviews-list"),summary=document.getElementById("reviews-summary");
          if(!section||!host||!data||!data.reviews||!data.reviews.length)return;
          summary.innerHTML='<strong>'+esc(data.average)+' de 5</strong><span>'+esc(data.count)+' '+(data.count===1?'opinión de paciente con cita completada':'opiniones de pacientes con cita completada')+'</span>';
          host.innerHTML=data.reviews.map(function(r){return '<article class="public-review"><span class="review-rating" aria-label="'+esc(r.rating)+' de 5 estrellas">'+esc('★★★★★'.slice(0,r.rating))+'</span><blockquote>“'+esc(r.body)+'”</blockquote><footer><strong>'+esc(r.public_name)+'</strong><time>'+esc(new Date(r.published_at).toLocaleDateString('es-MX',{month:'long',year:'numeric'}))+'</time></footer></article>';}).join('');
          section.hidden=false;
        }
        async function loadReviews(slug){try{var response=await fetch(SUPA_URL+"/functions/v1/public-patient-reviews?perfil="+encodeURIComponent(slug),{headers:{apikey:SUPA_KEY}});if(!response.ok)return;renderReviews(await response.json());}catch(_){/* El perfil sigue disponible sin reseñas. */}}
        function track(kind) {
          if (!profile || !profile.slug || profile.tenant_id === "preview") return;
          try {
            fetch(SUPA_URL + "/functions/v1/public-profile-event", {
              method: "POST",
              keepalive: true,
              headers: { "Content-Type": "application/json", apikey: SUPA_KEY },
              body: JSON.stringify({ profile_slug: profile.slug, event: kind, referrer: document.referrer || "" }),
            }).catch(function () {});
          } catch (_) { /* la métrica nunca bloquea la página */ }
        }
        window.smylTrack = track;
        function phoneData(value) {
          var raw = String(value || "").trim(), digits = raw.replace(/\D/g, "");
          return digits.length >= 10 && digits.length <= 15
            ? { label: raw, tel: "tel:+" + digits, whatsapp: "https://wa.me/" + digits }
            : null;
        }
        function updateMetadata(p, image, locations) {
          var description = p.headline || "Conoce el perfil de " + p.display_name + " y solicita una valoración dental.";
          var canonical = new URL(location.href);
          canonical.search = "?perfil=" + encodeURIComponent(p.slug || "");
          canonical.hash = "";
          document.title = p.display_name + " · Perfil profesional dental en SMYL";
          document.querySelector('meta[name="description"]').content = description;
          document.querySelector('meta[property="og:title"]').content = document.title;
          document.querySelector('meta[property="og:description"]').content = description;
          document.querySelector('meta[property="og:image"]').content = image || "";
          document.querySelector('link[rel="canonical"]').href = canonical.href;
          var previous = document.getElementById("profile-structured-data");
          if (previous) previous.remove();
          var structured = document.createElement("script");
          structured.id = "profile-structured-data";
          structured.type = "application/ld+json";
          structured.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "Dentist",
            name: p.display_name,
            description: description,
            image: image || undefined,
            medicalSpecialty: p.specialty || "Dentistry",
            telephone: p.public_phone || undefined,
            url: canonical.href,
            address: (locations || []).map(function (x) {
              return { "@type": "PostalAddress", streetAddress: x.address || undefined, addressLocality: x.city || undefined, addressRegion: x.state || undefined, name: x.name || undefined };
            }),
          });
          document.head.appendChild(structured);
          return canonical.href;
        }
        function servicesMarkup(services, canRequest) {
          if (!services.length) return '<div class="clinical-note"><strong>Servicios en actualización.</strong> La clínica todavía no ha publicado su oferta para este perfil.</div>';
          return '<div class="service-list">' + services.map(function (service) {
