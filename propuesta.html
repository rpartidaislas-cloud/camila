<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://rpxshsiwoxdbuevjjpfw.supabase.co; connect-src https://rpxshsiwoxdbuevjjpfw.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>Tu propuesta · SMYL</title>
<link rel="icon" href="icons/smyl_pwa.png">
<link rel="stylesheet" href="smyl-ui-template-v3.css">
<link rel="stylesheet" href="smyl-dental-record.css">
<link rel="stylesheet" href="smyl-proposals.css">
<style>
:root{--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;--blue:#194391;--bg:#F3F6FB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 14px 56px}
.pp-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:14px;box-shadow:0 4px 14px rgba(16,34,57,.06)}
.pp-card h2{font-size:18px;margin:0 0 8px}
.pp-msg{border-radius:10px;padding:12px 14px;font-size:14px;margin:12px 0}
.pp-msg.err{background:#FEF2F2;color:#B91C1C}.pp-msg.ok{background:#ECFDF5;color:#047857}.pp-msg.info{background:#EFF6FF;color:#1E3A8A}
.pp-text{white-space:pre-wrap;color:#374151;margin:0}
.pp-consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:12px 0;color:#374151}
.pp-consent input{margin-top:4px;width:18px;height:18px;flex:none}
.pp-btn{width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:700;padding:14px;cursor:pointer;margin-top:10px}
.pp-btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.pp-btn:disabled{opacity:.55;cursor:default}
.pp-fine{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div id="paper"></div>
  <div id="extra"></div>
  <p class="pp-fine">Esta página es privada y temporal. Si no esperabas este enlace, ignóralo. · <a href="privacidad.html">Aviso de privacidad</a></p>
</main>
<script src="smyl-clinical-model.js"></script>
<script src="smyl-proposal-model.js"></script>
<script src="smyl-tooth-map.js"></script>
<script src="smyl-proposal-print.js"></script>
<script>
(function () {
  'use strict';
  var API = 'https://rpxshsiwoxdbuevjjpfw.supabase.co/functions/v1/smyl-proposal-share';
  var KEY = 'smyl-proposal-token';
  var paper = document.getElementById('paper'), extra = document.getElementById('extra'), token = '';

  try {
    var m = /[#&]t=([a-f0-9]{64})/.exec(location.hash);
    if (m) { sessionStorage.setItem(KEY, m[1]); history.replaceState(null, '', location.pathname); }
    token = sessionStorage.getItem(KEY) || '';
  } catch (e) { var m2 = /[#&]t=([a-f0-9]{64})/.exec(location.hash); token = m2 ? m2[1] : ''; }

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function msg(text, tone) { return el('div', 'pp-msg ' + (tone || 'info'), text); }
  function post(body) {
    body.token = token;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; }); });
  }
  function fail(title, text) { paper.textContent = ''; extra.textContent = ''; var c = el('section', 'pp-card'); c.append(el('h2', '', title), msg(text, 'err')); paper.append(c); }

  function textCard(title, text) { var c = el('section', 'pp-card'); c.append(el('h2', '', title), el('p', 'pp-text', text)); return c; }

  function actions(v) {
    var c = el('section', 'pp-card');
    if (v.accepted_at) {
      c.append(el('h2', '', 'Gracias, recibimos tu aceptación'), msg('Tu clínica se pondrá en contacto contigo para agendar tu valoración.', 'ok'));
      return c;
    }
    c.append(el('h2', '', '¿Quieres dar el siguiente paso?'));
    var status = el('div'); var done = v.interested;
    if (done) status.append(msg('Ya avisamos a tu clínica que te interesa. Te contactarán pronto.', 'ok'));
    var interest = el('button', 'pp-btn ghost', 'Me interesa · quiero agendar mi cita'); interest.type = 'button'; interest.hidden = done;
    interest.onclick = function () {
      interest.disabled = true;
      post({ action: 'interest' }).then(function (d) {
        if (d.ok) { interest.hidden = true; status.textContent = ''; status.append(msg('Listo. Avisamos a tu clínica; te contactarán pronto.', 'ok')); }
        else { interest.disabled = false; status.append(msg(d.error || 'No se pudo enviar. Inténtalo de nuevo.', 'err')); }
      }).catch(function () { interest.disabled = false; status.append(msg('Sin conexión. Inténtalo de nuevo.', 'err')); });
    };
    var label = el('label', 'pp-consent'); var box = el('input'); box.type = 'checkbox'; box.id = 'pp-consent';
    label.append(box, el('span', '', v.consent_text));
    var accept = el('button', 'pp-btn', 'Acepto el plan'); accept.type = 'button'; accept.disabled = true;
    box.onchange = function () { accept.disabled = !box.checked; };
    accept.onclick = function () {
      accept.disabled = true;
      post({ action: 'accept', consent: true, consent_version: v.consent_version }).then(function (d) {
        if (d.ok) { v.accepted_at = d.accepted_at; extra.replaceChildren.apply(extra, build(v)); }
        else { accept.disabled = false; status.append(msg(d.error || 'No se pudo registrar. Inténtalo de nuevo.', 'err')); }
      }).catch(function () { accept.disabled = false; status.append(msg('Sin conexión. Inténtalo de nuevo.', 'err')); });
    };
    c.append(status, interest, label, accept);
    return c;
  }

  function build(v) {
    var out = [];
    if (v.sections && v.sections.history && v.history_summary) out.push(textCard('Resumen de tu historial', v.history_summary));
    if (v.payment_note) out.push(textCard('Formas de pago', v.payment_note));
    out.push(actions(v));
    return out;
  }

  function init() {
    if (!/^[a-f0-9]{64}$/.test(token)) return fail('Enlace no válido', 'Abre el enlace completo que te envió tu clínica.');
    post({ action: 'view' }).then(function (v) {
      if (v._status === 404) return fail('Enlace no disponible', 'Este enlace no existe o ya no está disponible.');
      if (v._status === 410 || (v.status && v.status !== 'active' && v.status !== 'accepted')) return fail(v.status === 'revoked' ? 'Enlace cancelado' : 'Enlace vencido', v.error || 'Pide un enlace nuevo a tu clínica.');
      try {
        paper.append(SmylProposalPrint.render(v.row, v.assets, true, { hideMap: !(v.sections && v.sections.odontogram) }));
      } catch (e) { return fail('No se pudo mostrar la propuesta', 'Inténtalo de nuevo en unos minutos.'); }
      extra.append.apply(extra, build(v));
    }).catch(function () { fail('Sin conexión', 'No pudimos cargar tu propuesta. Revisa tu conexión y vuelve a intentarlo.'); });
  }
  init();
})();
</script>
</body>
</html>
