# Las funciones clínicas y administrativas siempre requieren JWT de usuario.
[functions.claude]
verify_jwt = true

[functions.segment-teeth]
verify_jwt = true

[functions.secure-clinical-file]
verify_jwt = true

[functions.sign-segmentation-masks]
verify_jwt = true

[functions.file-lifecycle-maintenance]
verify_jwt = true

[functions.security-monitor]
verify_jwt = true

# Compras de paquetes consumibles (etapa 8): checkout y estado exigen sesión.
[functions.smyl-consumables-checkout]
verify_jwt = true

[functions.smyl-consumables-checkout-status]
verify_jwt = true

# Webhook de consumibles: sólo Stripe, autenticado por firma (STRIPE_CONSUMABLES_WEBHOOK_SECRET).
# Cobro en línea (OpenPay vía LANA). verify_jwt=false porque convive: acciones de personal (la función exige JWT y finance.manage),
# vista pública por token opaco y aviso de LANA firmado con HMAC. Nada se confía al navegador.
[functions.smyl-pay]
verify_jwt = false

# Propuesta compartida con el paciente: personal con JWT (la función lo exige) y vista pública por token opaco.
[functions.smyl-proposal-share]
verify_jwt = false

# Compartir archivos de la Nube con enlace privado. verify_jwt=false porque convive: acciones de personal (la función exige JWT, cloud.share
# y poder ver el archivo) y vista pública por token opaco (solo se guarda su SHA-256; vence, se revoca y deja bitácora).
[functions.cloud-share]
verify_jwt = false

# Sugerir el tipo de un archivo de la Nube con IA. Exige JWT, cloud.manage y poder ver el archivo; solo sugiere, no escribe.
[functions.cloud-classify]
verify_jwt = true

# Leer la constancia fiscal de un paciente con IA. Exige JWT y finance.manage; solo sugiere, no escribe ni guarda el archivo.
[functions.fiscal-extract]
verify_jwt = true

[functions.smyl-consumables-webhook]
verify_jwt = false

# Recordatorios de cita: sin verificación en la puerta porque el cron (pg_cron/pg_net) no
# tiene sesión y las claves nuevas (sb_publishable_…) no son JWT. El handler autentica TODAS las
# peticiones: sesión de usuario (requireUser) o el header x-smyl-cron-secret comparado en tiempo
# constante (SMYL_REMINDERS_CRON_SECRET); sin ninguno responde 401.
[functions.appointment-reminders]
verify_jwt = false

# El POST del navegador se autentica dentro del handler. El callback público de
# LANA exige HMAC-SHA256, ventana de cinco minutos e idempotencia por event_id.
[functions.appointment-negotiations]
verify_jwt = false

# OAuth de Google Calendar: el POST exige sesión dentro del handler; el GET es
# el callback público de Google y se autentica con state de un solo uso + PKCE.
[functions.google-calendar-oauth]
verify_jwt = false

# La sesion se valida dentro del handler. El webhook autentica los canales de
# Google por id, resource id y hash de un token aleatorio.
[functions.google-calendar-sync]
verify_jwt = false

[functions.google-calendar-webhook]
verify_jwt = false

# Excepciones públicas deliberadas. Cada una aplica su propio control de
# capacidad, firma, token de un solo uso o límite de abuso dentro del handler.
[functions.analizar-foto]
verify_jwt = false

[functions.meta-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.guardar-lead-prospecto]
verify_jwt = false

[functions.public-appointment-request]
verify_jwt = false

[functions.public-profile-event]
verify_jwt = false

[functions.public-professional-cases]
verify_jwt = false

[functions.public-patient-reviews]
verify_jwt = false

[functions.whatsapp-templates]
verify_jwt = true

[functions.radiograph-qc]
verify_jwt = true

[functions.radiograph-analyze]
verify_jwt = true

# MILA en el celular (QR): la computadora llama con sesión (requireUser + clinical.write dentro
# del handler); el celular no tiene sesión y se autentica con el token de un solo uso del QR y
# después con el secreto de dispositivo (hash SHA-256 en tiempo constante). Las sesiones vencen a los 90 min.
[functions.mila-interview]
verify_jwt = false

# Sesión clínica y alcance al paciente comprobados dentro del handler con requireUser y requirePermission.
[functions.periodontal-summary]
verify_jwt = false

# Aviso de privacidad automático por WhatsApp: sesión y permiso patients.manage comprobados dentro del handler (requireUser + requirePermission).
[functions.privacy-notice-dispatch]
verify_jwt = false

# Horarios libres para el asistente de IA de LANA (solo lectura). verify_jwt=false: la autentica la firma HMAC (SMYL_LANA_SCHEDULING_SECRET).
[functions.lana-scheduling]
verify_jwt = false
