# Las funciones clínicas y administrativas siempre requieren JWT de usuario.
[functions.claude]
verify_jwt = true

[functions.segment-teeth]
verify_jwt = true

[functions.secure-clinical-file]
verify_jwt = true

[functions.sign-segmentation-masks]
verify_jwt = true

[functions.file-lifecycle-maintenance]
verify_jwt = true

[functions.security-monitor]
verify_jwt = true

# Compras de paquetes consumibles (etapa 8): checkout y estado exigen sesión.
[functions.smyl-consumables-checkout]
verify_jwt = true

[functions.smyl-consumables-checkout-status]
verify_jwt = true

# Webhook de consumibles: sólo Stripe, autenticado por firma (STRIPE_CONSUMABLES_WEBHOOK_SECRET).
[functions.smyl-consumables-webhook]
verify_jwt = false

# Recordatorios de cita: sin verificación en la puerta porque el cron (pg_cron/pg_net) no
# tiene sesión y las claves nuevas (sb_publishable_…) no son JWT. El handler autentica TODAS las
# peticiones: sesión de usuario (requireUser) o el header x-smyl-cron-secret comparado en tiempo
# constante (SMYL_REMINDERS_CRON_SECRET); sin ninguno responde 401.
[functions.appointment-reminders]
verify_jwt = false

# OAuth de Google Calendar: el POST exige sesión dentro del handler; el GET es
# el callback público de Google y se autentica con state de un solo uso + PKCE.
[functions.google-calendar-oauth]
verify_jwt = false

# La sesion se valida dentro del handler. El webhook autentica los canales de
# Google por id, resource id y hash de un token aleatorio.
[functions.google-calendar-sync]
verify_jwt = false

[functions.google-calendar-webhook]
verify_jwt = false

# Excepciones públicas deliberadas. Cada una aplica su propio control de
# capacidad, firma, token de un solo uso o límite de abuso dentro del handler.
[functions.analizar-foto]
verify_jwt = false

[functions.meta-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.guardar-lead-prospecto]
verify_jwt = false

[functions.public-appointment-request]
verify_jwt = false

[functions.public-profile-event]
verify_jwt = false

[functions.public-professional-cases]
verify_jwt = false

[functions.public-patient-reviews]
verify_jwt = false

[functions.whatsapp-templates]
verify_jwt = true
